<!doctype html>
<!--
  OTA spike: a BLE frame pipe. The page connects to a board's NUS service and
  moves frames between it and `lp-cli link capture blepipe:<port>` over a
  WebSocket, one lp-link frame per message each way. It knows nothing about
  lp-link: the host runs the link, the login and the update.

    python3 -m http.server <p> --bind 127.0.0.1 --directory spikes/ble-lab
    open  http://localhost:<p>/pipe.html?ws=ws://127.0.0.1:<lp-cli port>
    Join (or cdp-central.mjs join --prefix LP-: the button is #btn-join)

  Text messages to the host: `up` when a connection is subscribed (a new
  session on the board), `down` when it drops. After a drop it reconnects to
  the same device on its own, as the board resets during an update.
-->
<html>
<head>
<meta charset="utf-8">
<title>BLE pipe</title>
<style>
  body { font: 13px ui-monospace, monospace; margin: 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<button id="btn-join">Join</button>
<span id="state">idle</span>
<pre id="log"></pre>
<script>
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // central -> board
const TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // board -> central
const wsUrl = new URLSearchParams(location.search).get("ws") || "ws://127.0.0.1:5599";
const S = { events: [], toBoard: 0, toHost: 0, connects: 0, drops: 0, writeErrors: 0, up: false };
window.S = S;
let device = null, rx = null, ws = null, writes = Promise.resolve();

function log(m) {
  const line = `${(performance.now() / 1000).toFixed(3)} ${m}`;
  S.events.push(line);
  if (S.events.length > 500) S.events.shift();
  document.getElementById("log").textContent = S.events.slice(-40).join("\n");
  document.getElementById("state").textContent =
    `${S.up ? "up" : "down"} · ws ${ws && ws.readyState === 1 ? "open" : "closed"} · ` +
    `connects ${S.connects} drops ${S.drops} · →board ${S.toBoard} →host ${S.toHost}`;
}

function openWs() {
  ws = new WebSocket(wsUrl);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { log("ws open"); if (S.up) ws.send("up"); };
  ws.onclose = () => { log("ws closed"); setTimeout(openWs, 500); };
  ws.onmessage = (e) => {
    if (typeof e.data === "string") return;
    const frame = new Uint8Array(e.data);
    // One write at a time, in order: the link's frames must arrive as sent.
    writes = writes.then(async () => {
      if (!rx) return;
      try { await rx.writeValueWithoutResponse(frame); S.toBoard++; }
      catch (err) { S.writeErrors++; log(`write failed: ${err.message}`); }
    });
  };
}

async function connect() {
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(NUS);
  const rxChar = await service.getCharacteristic(RX);
  const txChar = await service.getCharacteristic(TX);
  txChar.addEventListener("characteristicvaluechanged", (e) => {
    const v = e.target.value;
    S.toHost++;
    if (ws && ws.readyState === 1) ws.send(new Uint8Array(v.buffer, v.byteOffset, v.byteLength).slice());
  });
  // Subscribe before anything else: the board drops writes made earlier.
  await txChar.startNotifications();
  rx = rxChar;
  S.up = true;
  S.connects++;
  log(`ble up (${device.name})`);
  if (ws && ws.readyState === 1) ws.send("up");
}

// Chrome's `gatt.connect()` on macOS can hang forever (seen 2026-10-02: no
// resolve, no reject, after the board dropped an idle link), so every attempt
// is raced against a deadline and abandoned with an explicit disconnect.
async function reconnect() {
  for (;;) {
    try {
      await Promise.race([
        connect(),
        new Promise((_, no) => setTimeout(() => no(new Error("connect timed out")), 12000)),
      ]);
      return;
    } catch (e) {
      log(`connect failed: ${e.message}`);
      try { device.gatt.disconnect(); } catch {}
      await new Promise((r) => setTimeout(r, 700));
    }
  }
}

document.getElementById("btn-join").onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "LP-" }, { services: [NUS] }], optionalServices: [NUS],
    });
    device.addEventListener("gattserverdisconnected", () => {
      S.up = false; S.drops++; rx = null;
      log("ble down");
      if (ws && ws.readyState === 1) ws.send("down");
      reconnect();
    });
    await reconnect();
  } catch (e) { log(`join failed: ${e.message}`); }
};
openWs();
log("ready");
</script>
</body>
</html>
