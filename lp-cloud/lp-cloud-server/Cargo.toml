[package]
name = "lp-cloud-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The cloud service's HTTP edge: axum router for the control, content, and page planes"

[dependencies]
lp-cloud-domain = { path = "../lp-cloud-domain" }
lp-cloud-store-mem = { path = "../lp-cloud-store-mem" }
lp-cloud-store-sqlite = { path = "../lp-cloud-store-sqlite" }
lpc-cloud-api = { path = "../../lp-core/lpc-cloud-api" }
lpc-history = { path = "../../lp-core/lpc-history" }
# The `/firmware/` lookup's grammar, `ota-manifest.json` and verification.
lpc-firmware-release = { path = "../../lp-core/lpc-firmware-release" }
lpfs = { path = "../../lp-base/lpfs" }
# The relay's device-leg protocol (framing, version, limits).
lpc-relay = { path = "../../lp-core/lpc-relay" }

serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
log = { workspace = true }
env_logger = { workspace = true }

# THE edge crate: axum/tokio/reqwest live here and nowhere else in the
# workspace. Versions match what the lockfile already carries, so nothing
# gains a second copy.
# `ws`: the relay's two socket legs (`relay::device_leg`, `relay::browser_leg`).
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
] }

# The two outbound calls of the Google OAuth flow (`auth::google_auth`), and
# the only outbound HTTP this crate makes. `rustls-tls` with no default
# features to match `lpa-agent` and `object_store`: one reqwest and one TLS
# stack in the whole workspace.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# The release index fetches its manifests a few at a time
# (`StreamExt::buffered`). Already in the tree through axum; this was a
# dev-dependency for the relay tests' clients before.
futures-util = "0.3"

# Session tokens are bearer credentials, so the mint behind `IdMint` has to
# be the OS CSPRNG — `MemIdMint` is a counter and says so in its own docs.
getrandom = "0.3"

[dev-dependencies]
# `ServiceExt::oneshot` drives the router without binding a port: the edge
# tests are about routes and headers, not about sockets.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
# The relay tests' socket clients: a fake board and a fake browser.
tokio-tungstenite = "0.21"
# `K` as Studio installs it, for the fake board's account entries.
lpc-access = { path = "../../lp-core/lpc-access" }

[lints]
workspace = true
