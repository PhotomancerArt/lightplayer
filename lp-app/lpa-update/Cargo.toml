[package]
name = "lpa-update"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The host side of an over-the-air update (protocol v1): serving, the read-back backup, the login client, the decision, the update driver, and (feature pack) the one packer of encoding 1"

# Sans-IO, no_std + alloc (Studio's wasm and lp-cli share it). Never a
# dependency on `lpa-firmware-store`: the engine sources are effects the
# edge resolves. `lpc-firmware-release` is the one edge between the two OTA
# plans' crates (B-P02): `HostBuild::from_ota_manifest` and the identity
# comparison read a release's `ota-manifest.json`.
[dependencies]
lpc-firmware-release = { path = "../../lp-core/lpc-firmware-release" }
lp-crc32 = { path = "../../lp-base/lp-crc32" }
# M1's version comparison (FirmwareAge), reused rather than written twice.
lpa-devices = { path = "../lpa-devices" }
lpc-access = { path = "../../lp-core/lpc-access" }
lpc-update = { path = "../../lp-core/lpc-update" }
# The project stage (`projects`): the host upgrades a board's stored
# projects with the one upgrader. Host and wasm only, like this crate;
# `scripts/check-upgrade-fw.sh` keeps both out of every firmware graph.
lpa-upgrade = { path = "../lpa-upgrade" }
sha2 = { workspace = true }
# `pack` only: the one packer of encoding 1 (std). The compressor is a
# dependency (zlib-rs, pure Rust, Zlib licence), never copied source;
# lp-deflate, the board's own decoder, proves every chunk it emits.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"], optional = true }
lp-deflate = { path = "../../lp-base/lp-deflate", optional = true }

[features]
pack = ["dep:flate2", "dep:lp-deflate"]

[dev-dependencies]
lpc-update = { path = "../../lp-core/lpc-update", features = ["test-support"] }
serde_json = { workspace = true }
# `tests/projects_sim/`: the project stage against a board whose projects
# live in the real tree store on simulated NOR flash (the C6's and the S3's
# store), cut after every flash operation; memory stands in for a board
# with no transactions.
lp-tree-store = { path = "../../lp-base/lp-tree-store", features = ["lpfs", "nor-sim"] }
lp-nor-sim = { path = "../../lp-emu/lp-nor-sim" }
lpfs = { path = "../../lp-base/lpfs", default-features = false, features = ["std"] }
lpc-model = { path = "../../lp-core/lpc-model", default-features = false }

[lints]
workspace = true
