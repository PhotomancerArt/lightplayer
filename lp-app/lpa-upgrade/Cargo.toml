[package]
name = "lpa-upgrade"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The only thing this crate needs from the model: the format constant the
# step chain has to end at. Deliberately NOT the artifact types — the
# migrator rewrites JSON the current model can no longer parse.
lpc-model = { path = "../../lp-core/lpc-model", default-features = false }
# JSON parsing only. The crate never round-trips through `serde_json::Value`
# (see `json::JsonNode` for why) and never enables `preserve_order`, which
# would be a workspace-wide feature flip.
serde_json = { workspace = true }
# The one `Deserialize` impl the order-preserving document tree needs. No
# derives: nothing here is a typed model.
serde = { workspace = true }
# The format-6 reader and renderer, for one thing only: the view box of a
# format 1–5 map2d that has no canvas is its rendered lamps' bounds
# (`v11/freeze_view_box.rs`, map2d format 6's required `view_box`). Nothing
# else in the step reads the current model.
lpc-mapping = { path = "../../lp-core/lpc-mapping" }
# The frozen format-11 landing's filled-polygon cell count is copied verbatim
# from `lpc-mapping`'s resolver, trig included: the same `libm` it calls, so a
# turned lattice lands on the resolver's exact floats.
libm = "0.2"

[dev-dependencies]
# The real reader, so a migrated project is proved loadable rather than
# merely well-formed (docs/defects/2026-07-27-created-package-unloadable.md).
lpc-registry = { path = "../../lp-core/lpc-registry" }
lpfs = { path = "../../lp-base/lpfs" }
# (lpc-mapping, a dependency above, also checks the v11→v12 step's output
# with the real reader, renderer and patcher rather than the step's own
# arithmetic: lean Q6.)

[lints]
workspace = true
