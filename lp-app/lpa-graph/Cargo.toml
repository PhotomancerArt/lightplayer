[package]
name = "lpa-graph"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The Graph — Studio's project canvas: the editor model (fixtures on lpc-mapping parts, the node graph, selection, offers, hints)"

# The fixture domain is the product's own: `lpc-mapping` (the part tree,
# the patcher and its `edit` operations), the model the engine and firmware
# run, so what the Graph shows is what the board does (mapping rebuild M4
# P03). That ended this crate's fence (C32).
# Its node-graph domain (nodes, channels, bindings, the simulated board)
# stays its own.
[dependencies]
lpa-graph-layout = { path = "../lpa-graph-layout" }
libm = "0.2"
lpc-mapping = { path = "../../lp-core/lpc-mapping", features = ["std", "edit"] }

[lints]
workspace = true
