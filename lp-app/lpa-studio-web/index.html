<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Title text is injected by dx from `[web.app] title` in Dioxus.toml. -->
        <title></title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <!-- The brand mark (public/favicon.svg) — GENERATED from
             src/base/logo_mark.rs; regen via the favicon_regen test. -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <!-- Studio is dark-native; tell Dark Reader to leave it alone
             (extension-recognized opt-out, no styling effect of its own). -->
        <meta name="darkreader-lock">
        <!--
          Critical pre-paint styling. Studio's real theme (src/style.css) is
          injected by the wasm bundle only after it boots, so without this the
          browser paints the default white page for a beat first. Keep these
          values in sync with `--studio-color-bg` / `color-scheme` in style.css.
        -->
        <style>
            :root { color-scheme: dark; }
            html, body { margin: 0; background: #0d0d13; }
        </style>
        <!--
          The shell loader. Everything the page can show BEFORE the app
          wasm boots lives here: dx's injected glue fetches a multi-MB wasm
          with no UI of its own, so this script wraps `fetch` to watch that
          download and narrates it into the #lp-shell overlay in <body>.
          The app asks for dismissal on its first mounted render
          (`__lpShell.done()` from web_app.rs); a MutationObserver on #main
          is the belt-and-braces dismissal if that call ever goes missing.
          Dismissal itself waits for the styling that first render leans
          on: the Tailwind sheet is a <link> the app appends to <head> in a
          post-render effect that runs AFTER its done() effect, and the
          bundled fonts (font-display: block) only start downloading once
          that sheet applies. Dropping the overlay on the bare render paints
          a frame of unstyled, text-less chrome on every cold cache.

          `window.__lpShell` is a page-internal contract (ADR: static asset
          serving and the shell loader):

            observe(response, onProgress) -> Response  byte-counting tee
            phase(text)                                headline swap
            done() / fail(message)                     dismiss (once the
                                                       styling settles) /
                                                       dead end

          The engine handoff extends it with `engineFetch` (see the
          engine-manifest script below and lpa-link's engine_cache).

          Progress totals come from `x-uncompressed-length` (lp-cloud sets
          it on every asset answer) because Content-Length stops describing
          what a reader yields once a content-encoding applies; a plain
          Content-Length is the fallback on identity responses (dx dev
          serve), and no total at all degrades to an MB counter.
        -->
        <style>
            #lp-shell {
                position: fixed;
                inset: 0;
                display: grid;
                place-content: center;
                justify-items: center;
                gap: 14px;
                background: #101317;
                color: #aab4bf;
                font: 13px/1.4 system-ui, sans-serif;
                z-index: 9999;
                /* Invisible for the first beat so a warm load never
                   flashes it; a cold load fades in at 150 ms. */
                opacity: 0;
                animation: lp-shell-in 200ms ease 150ms forwards;
            }
            @keyframes lp-shell-in { to { opacity: 1; } }
            #lp-shell img { width: 56px; height: 56px; }
            #lp-shell-bar {
                width: 240px;
                height: 3px;
                border-radius: 2px;
                background: #232a33;
                overflow: hidden;
            }
            #lp-shell-bar > div {
                height: 100%;
                width: 0%;
                border-radius: 2px;
                background: #7f9cf5;
                transition: width 120ms linear;
            }
            #lp-shell-bar.lp-indeterminate > div {
                width: 30%;
                animation: lp-shell-slide 1.1s ease-in-out infinite alternate;
            }
            @keyframes lp-shell-slide { to { transform: translateX(233%); } }
            #lp-shell button {
                margin-top: 6px;
                padding: 7px 14px;
                border: 1px solid #3a4552;
                border-radius: 6px;
                background: transparent;
                color: #e2e8f0;
                font: inherit;
                cursor: pointer;
                display: none;
            }
            #lp-shell.lp-failed #lp-shell-bar { visibility: hidden; }
            #lp-shell.lp-failed button { display: block; }
        </style>
        <script>
            (() => {
                const shell = (window.__lpShell = {});
                const el = (id) => document.getElementById(id);
                const mb = (bytes) => (bytes / 1048576).toFixed(1);
                let dismissed = false;

                shell.phase = (text) => {
                    if (!dismissed) el("lp-shell-phase").textContent = text;
                };
                shell.progress = (label, received, total) => {
                    const bar = el("lp-shell-bar");
                    if (!bar || dismissed) return;
                    if (total > 0) {
                        const pct = Math.min(100, Math.round((received / total) * 100));
                        bar.classList.remove("lp-indeterminate");
                        bar.firstElementChild.style.width = pct + "%";
                        shell.phase(`${label}… ${pct}%`);
                    } else {
                        bar.classList.add("lp-indeterminate");
                        shell.phase(`${label}… ${mb(received)} MB`);
                    }
                };
                // Every stylesheet <link> that lands in <head> — the app
                // appends its Tailwind sheet on boot — with a promise that
                // settles on load OR error (an error must not strand the
                // overlay; the page just shows unstyled, as before).
                // Watching insertions, not polling `link.sheet`, because
                // `sheet` is null-until-loaded in Chromium but not
                // everywhere. The observer is armed at DOMContentLoaded,
                // long before the wasm boots and appends anything.
                const sheets = new Map();
                const watchSheet = (link) => {
                    if (sheets.has(link)) return;
                    sheets.set(
                        link,
                        new Promise((resolve) => {
                            link.addEventListener("load", resolve, { once: true });
                            link.addEventListener("error", resolve, { once: true });
                        }),
                    );
                };
                const nextTask = () => new Promise((resolve) => setTimeout(resolve, 0));
                const stylingSettled = async () => {
                    // The head <link>s land in effects queued behind the
                    // app's done() effect, in the same task; one task
                    // later they are in the DOM and being watched. A
                    // task, NOT a frame: requestAnimationFrame never
                    // fires in a background tab, and a Studio opened
                    // from a cmd-click must settle before it is looked
                    // at. Re-check after each wait — a sheet a later
                    // render appends joins the set.
                    await nextTask();
                    let awaited = 0;
                    while (awaited < sheets.size) {
                        awaited = sheets.size;
                        await Promise.all(sheets.values());
                    }
                    // Font requests start at the first layout that USES a
                    // face. Force that layout now the sheets apply, then
                    // wait out the loads; `ready` resolves at once when
                    // nothing is loading, so re-check the status once.
                    void document.body.offsetHeight;
                    const fonts = document.fonts;
                    if (!fonts) return;
                    await fonts.ready;
                    if (fonts.status === "loading") await fonts.ready;
                };
                // A stuck asset (a sheet that never answers, a font that
                // hangs) degrades to the old behaviour — an unstyled beat
                // — rather than an overlay that never leaves. Nothing
                // here needs a frame: a hidden tab settles too (the
                // forced layout starts the font loads, `fonts.ready`
                // resolves once they land), so a cmd-clicked Studio is
                // ready by the time it is looked at.
                const SETTLE_CAP_MS = 10000;
                shell.done = () => {
                    if (dismissed) return;
                    dismissed = true;
                    const remove = () => el("lp-shell")?.remove();
                    const cap = new Promise((resolve) => setTimeout(resolve, SETTLE_CAP_MS));
                    Promise.race([stylingSettled(), cap]).then(remove, remove);
                };
                shell.fail = (message) => {
                    if (dismissed) return;
                    const root = el("lp-shell");
                    if (!root) return;
                    root.classList.add("lp-failed");
                    shell.phase("Studio could not load");
                    el("lp-shell-detail").textContent = String(message || "");
                };

                // The byte-counting tee: same Response contract out, so
                // WebAssembly.instantiateStreaming keeps working on the
                // copy (status, statusText, and headers — including the
                // application/wasm content-type it insists on — ride over).
                shell.observe = (response, onProgress, onDone) => {
                    if (!response.ok || !response.body) return response;
                    const total =
                        Number(response.headers.get("x-uncompressed-length")) ||
                        (!response.headers.get("content-encoding")
                            ? Number(response.headers.get("content-length")) || 0
                            : 0);
                    let received = 0;
                    const reader = response.body.getReader();
                    const counted = new ReadableStream({
                        async pull(controller) {
                            const { done, value } = await reader.read();
                            if (done) {
                                onDone?.();
                                return controller.close();
                            }
                            received += value.byteLength;
                            onProgress(received, total);
                            controller.enqueue(value);
                        },
                        cancel(reason) { return reader.cancel(reason); },
                    });
                    return new Response(counted, {
                        status: response.status,
                        statusText: response.statusText,
                        headers: response.headers,
                    });
                };

                // The engine handoff: the moment the app wasm's BYTES are
                // done (compile/boot still ahead of it), start the engine
                // wasm download so it overlaps them instead of waiting for
                // the app to boot and ask. Sequential on purpose — running
                // both multi-MB fetches at once starves the app download
                // on the slow links this whole shell exists for.
                // `engine_cache` (lpa-link) adopts `shell.engineFetch`
                // instead of fetching its own copy; the shell never reads
                // the body — moving bytes is the whole job here, and the
                // Module's compile/ownership stays engine_cache's.
                shell.startEngineFetch = async () => {
                    if (shell.engineFetch) return;
                    const manifest = await window.__lpEngineAssets;
                    const url = manifest?.fw_browser_wasm;
                    if (!url) return;
                    shell.engineFetch = { url, promise: plainFetch(url) };
                    // A failed pre-fetch must not surface anywhere here:
                    // engine_cache sees the rejection when it adopts, falls
                    // back to its own fetch, and owns the error story.
                    shell.engineFetch.promise.catch(() => {});
                };

                // Watch the app wasm ride through fetch. dx's glue calls a
                // plain fetch(url); the URL names lpa-studio-web_bg in both
                // dev (/wasm/lpa-studio-web_bg.wasm) and release
                // (/assets/lpa-studio-web_bg-dxh….wasm) layouts.
                const isAppWasm = (input) => {
                    const url = typeof input === "string" ? input : input?.url || "";
                    return /lpa-studio-web_bg[^/]*\.wasm(\?|$)/.test(url);
                };
                const plainFetch = window.fetch.bind(window);
                window.fetch = async (input, init) => {
                    if (!isAppWasm(input)) return plainFetch(input, init);
                    try {
                        const response = await plainFetch(input, init);
                        if (!response.ok) {
                            shell.fail(`the app failed to download (HTTP ${response.status})`);
                            return response;
                        }
                        return shell.observe(
                            response,
                            (received, total) => {
                                shell.progress("Downloading Studio", received, total);
                                if (total > 0 && received >= total) shell.phase("Starting Studio…");
                            },
                            () => {
                                shell.phase("Starting Studio…");
                                shell.startEngineFetch();
                            },
                        );
                    } catch (error) {
                        shell.fail(error?.message || "the network request failed");
                        throw error;
                    }
                };

                // A wasm that downloads but fails to start (a panic in
                // init, a compile error) surfaces as the glue's rejected
                // promise — nothing else on a pre-boot page rejects, and
                // once the app is up this listener stops narrating.
                addEventListener("unhandledrejection", (event) => {
                    if (!dismissed) shell.fail(event.reason?.message || event.reason);
                });
                addEventListener("DOMContentLoaded", () => {
                    el("lp-shell-reload").onclick = () => location.reload();
                    // Insertions only: a static <link> in this file would
                    // have fired its load before this arms (do not add one
                    // to the watch — its promise would wait out the cap).
                    new MutationObserver((records) => {
                        for (const record of records) {
                            for (const node of record.addedNodes) {
                                if (node.matches?.('link[rel~="stylesheet"]')) watchSheet(node);
                            }
                        }
                    }).observe(document.head, { childList: true });
                    // Anything rendered into #main means the app is up —
                    // the fallback for surfaces that never call done()
                    // (story book, standalone editor pages).
                    const main = el("main");
                    new MutationObserver(() => {
                        if (main.childElementCount > 0) shell.done();
                    }).observe(main, { childList: true });
                });
            })();
        </script>
        <!--
          Pre-boot engine asset discovery (P2, hashed engine sidecar). The
          fw-browser engine wasm/glue are served under content-hashed names
          (see justfile's `sync-engine-sidecar.sh`), so nothing that boots a
          browser worker can hardcode their URLs; this fetches the small
          pkg/engine-manifest.json as early as possible so the resolved
          URLs are ready before the wasm bundle boots. `lpa-link`'s
          `resolved_engine_urls()` awaits this global (falling back to the
          unhashed constants on any failure); a later phase's shell loader
          also reads it for its own progress UI.
        -->
        <script>
            window.__lpEngineAssets = fetch("/pkg/engine-manifest.json")
                .then((response) => (response.ok ? response.json() : null))
                .catch(() => null);
        </script>
        <!--
          DEV MODE ONLY — the Web Serial shim's install seam (emulator plan
          two, M3; PD5, PD6).

          With `?emu=ws://<host>:<port>` in the URL, `navigator.serial` in
          this page is a virtual USB bus over an `lp-cli emu serve` holding
          emulated ESP32-C6 boards, and Studio's whole device stack —
          `browser_serial.js`, `browser_esp32_device_controller.js`,
          `browser_esp32_flash.js` and the Rust provider above them — runs
          against it UNCHANGED. Studio is not supposed to be able to tell,
          which is why nothing in `src/` reads this flag and why the honesty
          is a page-level banner instead (PD12).

          WITHOUT the flag, nothing here is fetched. Not fetched and ignored:
          no network request for the modules at all, and `navigator.serial`
          is Chromium's own. That is the whole meaning of "dev mode" and it is
          checkable in the network panel.

          A SYNCHRONOUS FAÇADE, resolved behind. A dynamic `import()` is
          async and the wasm bundle may boot before it lands, so this defines
          `navigator.serial` synchronously — as an `EventTarget` whose two
          methods await the module — and hands it the bus when it arrives.
          `browser_serial.js` re-reads `globalThis.navigator?.serial` at every
          call site, so nothing races and no code above this line has to
          await anything. It also matters for hotplug: `installSerialEvents`
          installs its listeners at most ONCE per page, so they must land on
          an object that is already there and stays.

          `navigator.serial` is a getter on `Navigator.prototype` in Chromium
          and an own property shadows it — proven in real Chrome by the M2
          conformance suite, which asserts both the shadowing and its removal.

          The flag is validated the way `capture_sink_url()` validates
          `?capture-sink=` (`src/device_events_io.rs`): a query is user input,
          an unknown value reads as no value, and the page says so once.
        -->
        <script>
            (() => {
                const raw = new URLSearchParams(window.location.search).get("emu");
                // No flag, no fetch.
                if (raw === null) return;
                const backing = raw.trim();
                // TWO SPELLINGS, TWO BACKINGS. `ws://host:port` is a native
                // `lp-cli emu serve` on the other side of a socket; `tab` is
                // a Worker in this page holding the emulator's own wasm.
                // Everything above this seam — the polyfill, the port, the
                // flasher, Studio — is the same code either way.
                const isTab = backing === "tab";
                if (!isTab && !/^wss?:\/\/\S+$/.test(backing)) {
                    console.warn(`emu ignored (not \`tab\` and not ws/wss): ${raw}`);
                    return;
                }
                // The flag is spelled `ws://` because what it installs is a
                // virtual USB bus, and that is the scheme its two endpoints
                // speak. `EmulatorPort`'s base is the door's HTTP origin
                // (`GET /boards`) and it derives the `ws://` URLs from it, so
                // the one translation between the two spellings is here. The
                // tab backing has no origin at all, so it is handed a
                // synthetic one the port only ever builds strings from.
                const httpBase = isTab
                    ? "http://tab.emu.invalid/"
                    : backing.replace(/^ws/, "http");
                // What the picker and the banner call this backing. A URL
                // for the door; a place for the tab.
                const label = isTab ? "in this tab" : backing;

                class LpEmuSerialFacade extends EventTarget {
                    async requestPort(options) {
                        return (await ready).requestPort(options);
                    }
                    async getPorts() {
                        return (await ready).getPorts();
                    }
                }
                const facade = new LpEmuSerialFacade();
                Object.defineProperty(navigator, "serial", {
                    value: facade,
                    configurable: true,
                    enumerable: true,
                    writable: false,
                });

                const whenBody = (run) => {
                    if (document.body) run();
                    else document.addEventListener("DOMContentLoaded", run, { once: true });
                };

                // The tab backing owns Workers, and they outlive a bus
                // that is merely disposed; `pagehide` ends both.
                let tabBacking = null;

                const ready = (async () => {
                    const [shim, chrome] = await Promise.all([
                        import("/lpa-link/virtual_serial.js"),
                        import("/lpa-link/emulator_picker.js"),
                    ]);
                    const options = {
                        picker: chrome.createPicker({ backingUrl: label }),
                    };
                    if (isTab) {
                        // The module is a content-hashed sidecar, so its URL
                        // comes from the manifest this page already fetched.
                        // Absent means a build that never ran
                        // `just studio-emu-sidecar` — which is a legitimate
                        // build, so say so rather than 404 in a Worker.
                        const assets = await window.__lpEngineAssets;
                        const moduleUrl = assets?.emu_esp32c6_wasm;
                        if (!moduleUrl) {
                            throw new Error(
                                "this build ships no emulator module " +
                                    "(pkg/engine-manifest.json has no emu_esp32c6_wasm; " +
                                    "run `just studio-emu-sidecar`)",
                            );
                        }
                        const tab = await import("/lpa-link/emulator_tab.js");
                        tabBacking = tab.tabBacking({ moduleUrl });
                        options.backing = tabBacking;
                    }
                    const bus = await shim.createBus(httpBase, options);
                    // The bus is where a re-enumeration and the banner's
                    // cable buttons raise their edges; the façade is what
                    // Studio listened to. Forward, one for one.
                    for (const type of ["connect", "disconnect"]) {
                        bus.addEventListener(type, (event) => {
                            facade.dispatchEvent(new CustomEvent(type, { detail: event.detail }));
                        });
                    }
                    // A page-internal contract, like `__lpShell`: the dev
                    // banner's controls, and an agent at the console, reach
                    // the boards through this. Studio never touches it.
                    // `tabBacking` is on here for the same reason the bus
                    // is: `just walk-no-board --tab` has no `GET /boards` to
                    // ask, and `describeBoards()` is a page-load cache that
                    // goes stale after a flash. `listBoards()` reads the
                    // worker's live row, so it is the tab's registry.
                    window.__lpEmuSerial = {
                        bus,
                        facade,
                        backing,
                        base: httpBase,
                        tabBacking,
                    };
                    whenBody(() =>
                        chrome.installDevBanner({ bus, backingUrl: label, facade }),
                    );
                    console.info(
                        `[emu] navigator.serial is a shim over ${label} ` +
                            `(${bus.describeBoards().length} board(s))`,
                    );
                    return bus;
                })();
                ready.catch((error) => {
                    console.error(`[emu] the shim over ${label} did not install:`, error);
                });

                // Hand the boards back when this page goes away. The door
                // admits ONE client per board and answers a second with 409
                // (`emu serve`, M1) — and Chrome's back/forward cache keeps a
                // navigated-away page, and its WebSockets, ALIVE. Measured
                // 2026-09-09: without this, the second load of `?emu=` in a
                // tab fails with "control channel refused" and stays failed
                // until the door restarts. `pagehide` (unlike `unload`) does
                // not itself make a page ineligible for bfcache, so a restored
                // page would come back holding closed sockets — reload it
                // instead and let the seam install cleanly.
                window.addEventListener("pagehide", () => {
                    ready.then((bus) => bus.dispose()).catch(() => {});
                    // A Worker is not a socket: disposing the bus drops the
                    // port objects, and the thread holding the machine (and
                    // its OPFS handle) would otherwise still be running.
                    tabBacking?.dispose().catch(() => {});
                });
                window.addEventListener("pageshow", (event) => {
                    if (event.persisted) window.location.reload();
                });
            })();
        </script>
        <!--
          Vendored CodeMirror bundle (globalThis.LpCodeMirror), regenerated
          via `just studio-codemirror-bundle`; see vendor-src/codemirror/.
          The CodeEditor component polls for the global, so load order vs
          the wasm bundle does not matter.
        -->
        <script defer src="/vendor/codemirror/codemirror.js"></script>
    </head>
    <body>
        <!-- The shell loader's overlay (script + contract in <head>).
             Static markup on purpose: it paints before any JS runs. -->
        <div id="lp-shell" role="status" aria-live="polite">
            <img src="/favicon.svg" alt="">
            <div id="lp-shell-bar" class="lp-indeterminate"><div></div></div>
            <p id="lp-shell-phase" style="margin:0">Loading Studio…</p>
            <p id="lp-shell-detail" style="margin:0;font-size:11px;color:#6b7683;max-width:340px;text-align:center"></p>
            <button id="lp-shell-reload" type="button">Reload</button>
        </div>
        <div id="main"></div>
    </body>
</html>
