<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Title text is injected by dx from `[web.app] title` in Dioxus.toml. -->
        <title></title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <!-- The brand mark (public/favicon.svg) — GENERATED from
             src/base/logo_mark.rs; regen via the favicon_regen test. -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <!-- Studio is dark-native; tell Dark Reader to leave it alone
             (extension-recognized opt-out, no styling effect of its own). -->
        <meta name="darkreader-lock">
        <!--
          Critical pre-paint styling. Studio's real theme (src/style.css) is
          injected by the wasm bundle only after it boots, so without this the
          browser paints the default white page for a beat first. Keep these
          values in sync with `--studio-color-bg` / `color-scheme` in style.css.
        -->
        <style>
            :root { color-scheme: dark; }
            html, body { margin: 0; background: #101317; }
        </style>
        <!--
          Pre-boot engine asset discovery (P2, hashed engine sidecar). The
          fw-browser engine wasm/glue are served under content-hashed names
          (see justfile's `sync-engine-sidecar.sh`), so nothing that boots a
          browser worker can hardcode their URLs; this fetches the small
          pkg/engine-manifest.json as early as possible so the resolved
          URLs are ready before the wasm bundle boots. `lpa-link`'s
          `resolved_engine_urls()` awaits this global (falling back to the
          unhashed constants on any failure); a later phase's shell loader
          also reads it for its own progress UI.
        -->
        <script>
            window.__lpEngineAssets = fetch("/pkg/engine-manifest.json")
                .then((response) => (response.ok ? response.json() : null))
                .catch(() => null);
        </script>
        <!--
          Vendored CodeMirror bundle (globalThis.LpCodeMirror), regenerated
          via `just studio-codemirror-bundle`; see vendor-src/codemirror/.
          The CodeEditor component polls for the global, so load order vs
          the wasm bundle does not matter.
        -->
        <script defer src="/vendor/codemirror/codemirror.js"></script>
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
