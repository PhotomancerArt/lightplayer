[package]
name = "lpa-studio-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Static Dioxus web shell for LightPlayer Studio"

[features]
stories = ["dep:lpa-studio-web-story-macros", "dep:lpc-mapping"]

[dependencies]
async-trait = "0.1"
dioxus = { version = "0.7", features = ["web"] }
dioxus-icons = "0.1"
futures-util = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
log = { workspace = true }
lpa-client = { path = "../lpa-client", default-features = false }
lpa-link = { path = "../lpa-link", features = ["browser-worker"] }
lpa-agent = { path = "../lpa-agent" }
lpa-studio-core = { path = "../lpa-studio-core", features = ["browser-worker", "browser-serial-esp32"] }
# The Gradient value type and its checked-in catalog + sampling helpers,
# for GradientStripCanvas.
lpc-model = { path = "../../lp-core/lpc-model" }
lpa-palettes = { path = "../lpa-palettes" }
# Story fixtures build lamp layouts from the shared mapping corpus.
lpc-mapping = { path = "../../lp-core/lpc-mapping", default-features = false, optional = true }
# Shared lamp-view geometry (universe palette, wiring arrows) + the editor.
lpa-mapping-editor = { path = "../lpa-mapping-editor" }
# Board catalog data + the BoardDiagram row-engine renderer.
lpa-board-editor = { path = "../lpa-board-editor" }
lpa-boards = { path = "../lpa-boards", features = ["diagram"] }
lpa-studio-web-story-macros = { path = "../lpa-studio-web-story-macros", optional = true }
lpc-wire = { path = "../../lp-core/lpc-wire" }
# Share links carry a `prj_…` uid; the router parses it with the same type
# the server's `page::share_path` does, so both halves agree about what a
# `/p/<slug>-prj_x` link means.
lpc-history = { path = "../../lp-core/lpc-history", default-features = false }
# Markdown parsing for agent chat replies (parser only; rendering goes
# through Dioxus nodes — never raw HTML).
pulldown-cmark = { version = "0.13", default-features = false }
lps-builtin-completions = { path = "../../lp-shader/lps-builtin-completions" }
lps-glsl = { path = "../../lp-shader/lps-glsl" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "BroadcastChannel",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "Crypto",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "OffscreenCanvas",
    "Performance",
    "PointerEvent",
    "RequestMode",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Storage",
    "StorageManager",
    "Url",
    "VisibilityState",
    "CssStyleDeclaration",
    "DomRect",
    "Window",
    "Worker",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lpa-fs-opfs = { path = "../lpa-fs-opfs" }
lpfs = { path = "../../lp-base/lpfs" }
wasm-bindgen-futures = "0.4"

[build-dependencies]
syn = { version = "2.0", features = ["full", "parsing"] }

[lints]
workspace = true

[dev-dependencies]
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
