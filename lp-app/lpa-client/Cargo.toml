[package]
name = "lpa-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lpc-model = { path = "../../lp-core/lpc-model" }
lpc-wire = { path = "../../lp-core/lpc-wire" }
# The tier a `NotPermitted` refusal names, and the login challenge/MAC types.
lpc-access = { path = "../../lp-core/lpc-access" }
# Where the board manifest and a stamp's staged copy live (`device_stamp`).
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false }
lpc-shared = { path = "../../lp-core/lpc-shared", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
anyhow = { version = "1", optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
# The SYNC half, for `stream/ws_stream.rs`: the host-side byte stream over
# `lp-cli emu serve`'s WebSocket byte door, the sibling of `tcp_stream.rs`.
# Optional and off in the browser build (`default-features = false`), which
# has no business compiling a native WebSocket client.
tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf", optional = true, features = ["std"] }
lp-riscv-emu = { path = "../../lp-emu/lp-riscv-emu", optional = true, default-features = false }
lp-emu-core = { path = "../../lp-emu/lp-emu-core", optional = true }
serialport = { version = "4.8", optional = true }
# Raw TIOCMGET/TIOCMSET for whole-status modem-line writes (see
# stream/serialport_stream.rs — the WCH CH34x macOS driver ignores the
# single-bit ioctls serialport's per-line calls use).
libc = { version = "0.2", optional = true }
hashbrown = { workspace = true, optional = true }
log = { workspace = true, features = ["std"] }
# `transport_lan` (feature `lan`): the OS's random bytes for each secure
# handshake's ephemeral key. Already in the tree (lp-cloud-server).
getrandom = { version = "0.3", optional = true }
# A board's relay id (`relay:` specifiers) and the relay's close codes.
# no_std and small; lpa-client already links lpc-access, its one dependency.
lpc-relay = { path = "../../lp-core/lpc-relay" }
# The deflate plan of a push (`push_files`): miniz_oxide, cut into chunks that
# each fit one tree-store record. No hasher, no store; wasm-safe.
lp-tree-store = { path = "../../lp-base/lp-tree-store", default-features = false, features = ["deflate-plan"] }

[features]
default = ["host"]
host = ["dep:anyhow", "dep:futures-util", "dep:lpc-shared", "dep:tokio"]
serial = [
    "host",
    "ws-stream",
    "lp-riscv-elf",
    "lp-riscv-emu",
    "lp-riscv-emu/std",
    "lp-emu-core",
    "lp-emu-core/std",
    "hashbrown",
    "serialport",
    "dep:libc",
]
emu = ["host", "lp-riscv-elf", "lp-riscv-emu", "lp-riscv-emu/std", "lp-emu-core", "lp-emu-core/std", "hashbrown"]
ws = ["host", "tokio-tungstenite"]
# `lan:<host>[:port]` (`transport_lan`): a board on the LAN, one secure
# lp-link inside a WebSocket to `ws://<board>/link` (Wi-Fi plan P06). Rides
# the serial transport's client half (`AsyncSerialClientTransport`) and the
# sync WebSocket client.
#
# The same feature carries `relay:<board>[@<origin>]` (`transport_relay`): the
# same secure link inside a WebSocket to the cloud relay, `wss://` in
# production — hence tungstenite's `native-tls`, which lp-cli already
# enables, so nothing new is linked.
lan = [
    "serial",
    "lpc-wire/secure-link",
    "dep:getrandom",
    "tungstenite/native-tls",
]
# `WsByteStream`: the raw-byte `serial:ws://…` sibling of `serial:tcp://…`.
# Distinct from `ws`, which is the lpc-wire protocol against an `lpa-server`.
ws-stream = ["dep:tungstenite"]

[dev-dependencies]
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf", features = ["std"] }
lp-riscv-inst = { path = "../../lp-riscv/lp-riscv-inst" }
lpc-view = { path = "../../lp-core/lpc-view" }
lpfs = { path = "../../lp-base/lpfs", features = ["std"] }
test-log = { workspace = true }

[lints]
workspace = true
