[package]
name = "lpa-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = [
    "std",
    "node-button",
    "node-radio",
    "node-fluid",
    "node-fixture",
    "node-texture",
    "node-playlist",
    "node-clock",
    "node-shader",
    "resolver-payload-cache",
]
# Panic recovery via catch_unwind (shader compilation, node render)
naga = ["lpc-engine/naga"]
std = [
	"lpc-hardware/std",
	"lpc-shared/std",
	"lpc-engine/std",
	"lpc-wire/std",
	"lpfs/std",
	"log/std"
]

# --- Per-node-kind runtime gates (forward to lpc-engine) -------------------
#
# `lpc-engine` is taken with `default-features = false` below, so without
# these a consumer of `lpa-server` would silently get NO node runtimes at
# all (see the trap note on the dependency line). All eight forward to the
# matching `lpc-engine/node-*` feature and are in `default` above, so any
# consumer taking lpa-server's defaults (the studio, `lp-cli`, tests) still
# gets every node kind — nothing changes for them. A constrained firmware
# build that opts out of lpa-server's defaults (`default-features = false`;
# `fw-esp32c6` does this today) lists only the gates it wants, same shape as
# `naga` above. This is the mechanism M3's `fw-esp32s3` uses to turn nodes
# off — `lpa-server` forcing every gate on unconditionally would make that
# impossible from firmware.
node-button = ["lpc-engine/node-button"]
node-radio = ["lpc-engine/node-radio"]
node-fluid = ["lpc-engine/node-fluid"]
node-fixture = ["lpc-engine/node-fixture"]
node-texture = ["lpc-engine/node-texture"]
node-playlist = ["lpc-engine/node-playlist"]
node-clock = ["lpc-engine/node-clock"]
node-shader = ["lpc-engine/node-shader"]

# Removal-only, same contract as the node gates above: forwards to
# `lpc-engine/resolver-payload-cache`, defaults on, and a firmware taking
# `default-features = false` simply omits it to trade frame time for heap.
resolver-payload-cache = ["lpc-engine/resolver-payload-cache"]

# --- FIXTURE builds — test scaffolding, never shipped ------------------
#
# The device-scenario matrix needs firmware that a CURRENT Studio classifies
# as Incompatible, and archiving old binaries is not maintainable (they rot
# against the toolchain and prove nothing about today's classifier). These
# two features make the CURRENT build misreport its hello instead, so the
# scenario is reproducible from source at any commit
# (`scripts/device-scenarios/s4-old-firmware.json`).
#
# ⚠️ Neither belongs in a released image. They exist to make a device LIE
# about its wire protocol.
#
# `fixture-old-proto` reports WIRE_PROTO_VERSION - 1 → Incompatible
# (proto-mismatch). `fixture-no-hello` refuses the hello entirely, which is
# what pre-hello firmware looks like → Incompatible (no-hello). They are
# mutually exclusive in effect; no-hello wins, because a server that never
# answers cannot also report a version.
fixture-old-proto = []
fixture-no-hello = []

[dependencies]
# `default-features = false` here means lpa-server takes none of
# `lpc-engine`'s defaults automatically — including its node-* gates, all
# eight of which are default-on over there. The `node-*` features above are
# what supply them: they forward into the matching `lpc-engine/node-*`
# feature and are all in lpa-server's own `default`, so nothing changes for
# a normal consumer. **The trap**: any crate depending on `lpa-server` (or
# `lpc-engine` directly) with `default-features = false` gets NO node
# runtimes unless it lists the gates it wants — this bit `fw-emu` and this
# crate itself when the gates first landed (2026-07-30). Anyone adding a
# ninth node gate to `lpc-engine` must add the forwarding feature here too.
lpc-engine = { path = "../../lp-core/lpc-engine", default-features = false }
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false }
lpc-history = { path = "../../lp-core/lpc-history", default-features = false }
lpc-model = { path = "../../lp-core/lpc-model", default-features = false }
lpc-registry = { path = "../../lp-core/lpc-registry", default-features = false }
lpc-wire = { path = "../../lp-core/lpc-wire", default-features = false }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lp-perf = { path = "../../lp-base/lp-perf", default-features = false }
lp-recovery = { workspace = true }
hashbrown = { workspace = true }
log = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# Concrete CPU graphics backend for tests and doc examples (the server takes
# an injected `Arc<dyn LpGraphics>`; hosts construct the backend).
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm", default-features = false }
# The client's request planner, so `tests/deploy_reload_source.rs` drives the
# real deploy sequence (stop → write → load) instead of re-stating it. Only
# the pure request builders are needed, so no host transports.
lpa-client = { path = "../lpa-client", default-features = false }
# A SECOND engine for `tests/shader_oracle_frame.rs`, and only for that.
#
# `TargetLpvmGraphics` on a host is wasmtime; firmware runs `lpvm-native`'s
# codegen. Rendering the same project through both is what turns "the device
# disagrees with the host" into "the *native codegen family* disagrees with
# wasmtime" — a distinction no amount of staring at one number provides.
# `emu` is the host-runnable rv32 arm of the same codegen the ESP32-S3 JITs.
lpvm-native = { path = "../../lp-shader/lpvm-native", default-features = false, features = ["emu"] }
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false, features = ["std"] }
# Same forwarding as the main [dependencies] entry above — `cargo test
# -p lpa-server` builds with lpa-server's own default features (std + all
# eight node-* gates) unless told otherwise, which forward into this dev
# instance of lpc-engine too (Cargo unifies features across dep kinds for
# the same resolved package). No explicit feature list needed here.
lpc-engine = { path = "../../lp-core/lpc-engine", default-features = false }
lpc-registry = { path = "../../lp-core/lpc-registry", default-features = false, features = ["std"] }
lpc-view = { path = "../../lp-core/lpc-view", default-features = false, features = ["std"] }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false, features = ["std"] }
lpfs = { path = "../../lp-base/lpfs", default-features = false, features = ["std"] }

[lints]
workspace = true
