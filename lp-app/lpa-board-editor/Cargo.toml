[package]
name = "lpa-board-editor"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = { workspace = true }
# Component-library feature set (no renderer, no launch): the consuming app
# picks the platform.
dioxus = { version = "0.7", default-features = false, features = ["lib"] }
lpa-boards = { path = "../lpa-boards", features = ["diagram"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The standalone page's persistence + open-dialog + clipboard plumbing only;
# the editor itself is DOM-free.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "HtmlElement",
    "Navigator",
    "Storage",
    "Window",
] }

[lints]
workspace = true
