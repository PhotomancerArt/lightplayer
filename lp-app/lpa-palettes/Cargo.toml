[package]
name = "lpa-palettes"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
# The Gradient value type the catalog is built from — see color::Gradient's
# doc comment: "a discrete swatch list is a Gradient with InterpMethod::Step;
# there is no separate palette type."
lpc-model = { path = "../../lp-core/lpc-model" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# The strip-sheet contact-sheet renderer (tests/curation gate) and the
# strip_sheet example binary. Same crate/version lp-gfx-wgpu already uses.
png = "0.18"

[lints]
workspace = true
