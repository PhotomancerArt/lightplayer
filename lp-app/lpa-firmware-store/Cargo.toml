[package]
name = "lpa-firmware-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Studio's engine cache seam (index, LRU + held eviction) and the firmware store client over an injected fetch port — sans-IO, host + wasm"

# Sans-IO: no executor, no clock, no HTTP client. The edges (Studio web,
# later lp-cli) inject the storage and the fetch. Never M4's lpa-update /
# lpc-update: the update protocol's host crate emits "look up the cache" /
# "fetch from the store" effects and the edge answers them with this crate.
[dependencies]
lpc-firmware-release = { path = "../../lp-core/lpc-firmware-release" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
