# E1 "Sean from empty": the headline. A Blank project, a XIAO C6 the app
# already knows about, and Sean's one sentence. Pass = the project drives
# 250 LEDs on D6 through a cycling playlist of colourful catalog patterns,
# every node running, saved.
name = "e1-sean-from-empty"
summary = "Blank project → 250 LEDs on D6, colourful patterns on a Cycle playlist"
start = "blank"
context = "A Seeed XIAO ESP32-C6 is connected over USB. Its board is known: Seeed XIAO ESP32-C6 (board id seeed/xiao-esp32-c6)."
user = "set up my leds to do some simple fun rainbow patterns. I have 250 leds on D6."
leds = 250
golden = "sean-250-d6"
checks = [
  "output_on_d6",
  "target_is_xiao_c6",
  "strip_of",
  "playlist_cycles",
  "graph_wired",
  "all_nodes_ok",
  "saved",
]

[budget]
turns = 24
usd = 0.75

[playlist]
min_entries = 3
step_seconds = [10.0, 60.0]
# Catalog patterns that read as "colourful" (Yona edits this list).
colourful = [
  "palette-waves",
  "plasma",
  "spiral",
  "aurora",
  "veins",
  "ripples",
  "heartbeat",
  "color-wipe",
  "plasma-duo",
]
