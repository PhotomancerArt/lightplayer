# S1 (was E1) "Sean from empty": the headline. A Blank project, a XIAO C6
# the app already knows about, and Sean's one sentence. Pass = the project
# drives 250 LEDs on D6 through a cycling playlist of colourful catalog
# patterns, every node running, saved — and the agent asked nothing,
# because Sean gave it everything.
id = "S1"
name = "e1-sean-from-empty"
summary = "Blank project → 250 LEDs on D6, colourful patterns on a Cycle playlist"
persona = "sean"
tags = ["build", "pin", "patterns"]
golden = "sean-250-d6"

[start]
project = "blank"
board = { known = "seeed/xiao-esp32-c6" }
# E1's exact line (kept verbatim so S1 runs as E1 did).
context = "A Seeed XIAO ESP32-C6 is connected over USB. Its board is known: Seeed XIAO ESP32-C6 (board id seeed/xiao-esp32-c6)."

[user]
say = "set up my leds to do some simple fun rainbow patterns. I have 250 leds on D6."
otherwise = "you pick."

[budget]
turns = 24
usd = 0.75

[[check]]
kind = "output_on"
pin = "D6"
[[check]]
kind = "target_is"
board = "seeed/xiao-esp32-c6"
[[check]]
kind = "strip_of"
leds = 250
[[check]]
kind = "playlist"
min_entries = 3
step_seconds = [10.0, 60.0]
# Catalog patterns that read as "colourful" (Yona edits this list).
from = ["palette-waves", "plasma", "spiral", "aurora", "veins", "ripples", "heartbeat", "color-wipe", "plasma-duo"]
[[check]]
kind = "graph_wired"
[[check]]
kind = "all_nodes_ok"
[[check]]
kind = "saved"
# New in the corpus (E1 did not have it): everything was given.
[[check]]
kind = "max_questions"
n = 0
