# S17 "Map a new PCB": a second fixture from a pick-and-place file, exact
# points in chain order, chained after the existing 144 on the same D10
# wire — and nothing else touched.
id = "S17"
name = "s17-yona-map-pcb"
summary = "Pick-and-place for a 64-LED ring → a second fixture 'ring', 208 LEDs on D10, playlist untouched"
persona = "yona"
tags = ["mapping", "edit", "power-user", "minimal-change"]
status = "pending"
waits_for = "M10"
note = "The product holds exact points (PathPoints), but the agent does not know the mapping formats well enough until M10 (easier after M6). The point-by-point check of 'ring' lands then; the S3 Plus has no stage B (Q8)."

