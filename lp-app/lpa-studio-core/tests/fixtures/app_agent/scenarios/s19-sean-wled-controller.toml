# S19 "Switch my WLED controller to LightPlayer" (added by Yona after
# review): a classic-ESP32 WLED controller over USB. Since 2026-10-28 the
# install reads the board first (plan
# lp2025/2026-10-28-0025-install-without-board-pick): the agent presses
# Install, the install stops on the one question it asks — replacing WLED,
# which erases its settings and presets — and that Replace is a card Sean
# clicks. Four classic boards fit what the bootloader says, so the agent
# then answers "Which board is this?" with the Dig2Go Sean named. Then a
# simple project on the controller's LED output, pushed.
id = "S19"
name = "s19-sean-wled-controller"
summary = "QuinLED Dig2Go running WLED → Replace as a card naming what's lost, the board named after, then 150 LEDs on its LED output"
persona = "sean"
tags = ["device-connect", "flash", "foreign-firmware", "push", "classic-esp32"]
golden = "dig2go-150-led"
note = "Classic ESP32: Studio-only checks, no stage B (the emulator decodes C6 images). The fake board prints the classic ROM banner and a WLED_DEBUG boot line."

[start]
project = "none"
board = { state = "foreign", firmware = "wled", actual = "quinled/dig2go" }

[user]
say = "I've got a WLED controller running my strip. can I switch it to lightplayer?"
otherwise = "you decide."

[[user.reply]]
topic = "controller"
when = ["controller", "board", "model", "quinled", "what kind", "which one", "make"]
text = "a QuinLED Dig2Go"

[[user.reply]]
topic = "leds"
when = ["how many", "leds", "count", "strip", "pixels"]
text = "about 150 LEDs on the main output"

[[user.card]]
offer = "devices/connect-usb"
do = "click"

# Replacing WLED is Sean's click.
[[user.card]]
offer = "devices/*/confirm-replace"
do = "click"

[budget]
turns = 30
usd = 0.50
tokens = 400_000

[[check]]
kind = "card_handed"
offer = "devices/*/confirm-replace"
[[check]]
kind = "never"
what = "pressed:devices/*/confirm-replace"
[[check]]
kind = "said_any"
words = ["preset", "setting", "erase", "wipe", "lose", "lost", "replace"]
[[check]]
kind = "said_none"
words = ["keep your presets", "presets will be kept", "presets are kept", "keeps your presets"]
[[check]]
kind = "board_firmware"
is = "flashed"
[[check]]
kind = "board_runs_project"
[[check]]
kind = "output_on"
pin = "LED"
[[check]]
kind = "strip_of"
leds = 150
[[check]]
kind = "target_is"
board = "quinled/dig2go"
[[check]]
kind = "all_nodes_ok"
