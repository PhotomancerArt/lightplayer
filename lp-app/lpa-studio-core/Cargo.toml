[package]
name = "lpa-studio-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Headless LightPlayer Studio application core"

[dependencies]
lpa-agent = { path = "../lpa-agent" }
# Data-only (no `diagram` feature): the provisioning flow reads the
# embedded runtime manifests + board↔build join; drawing stays web-side.
lpa-boards = { path = "../lpa-boards" }
lpa-client = { path = "../lpa-client", default-features = false }
# The device model the studio's effects layer drives (`app/devices`). Sans-IO
# and serde-only, so every target pays the same nothing for it; the transport
# that implements its `Link` contract is feature-gated below.
lpa-devices = { path = "../lpa-devices" }
# device-session everywhere (RuntimeAttachment::Device drives it), and
# device-link everywhere too: the effects layer's lens tap demuxes wire lines
# through `lpa_link::device_link` unconditionally, so the minimal lib build
# (`cargo check -p lpa-studio-core`, gated by `just check-studio-core-minimal`)
# must see the module without relying on the dev-only `fake-device` or the
# wasm browser features to unify it in. It only pulls lpa-devices + lpc-wire,
# both already in this crate's graph. The host transport WIRE still arrives
# via unification when a host provider feature is enabled (tests: fake-device
# below; wasm: the browser features).
# `layout-migration`: the C6 repartition's layout step (classify, plan,
# back up — `app/devices/device_layout_step.rs`), pure and wasm-safe.
lpa-link = { path = "../lpa-link", features = ["device-session", "device-link", "layout-migration"] }
# Format classification + offline migration for authored projects. Studio is
# the only crate that gets this dep: the library classifies every package it
# lists, and opening an older-but-supported one migrates it in place.
lpa-upgrade = { path = "../lpa-upgrade" }
lpc-history = { path = "../../lp-core/lpc-history", default-features = false }
# The engine cache seam and the firmware store client (OTA M5): installed
# by the shell, read by the update flow (M4/M7). Sans-IO, wasm-safe.
lpa-firmware-store = { path = "../lpa-firmware-store" }
# A released build's `ota-manifest.json` (M7's update host reads the store's
# builds: their facts for "Other version…", their files to install).
# no_std + serde; already in the graph through lpa-firmware-store.
lpc-firmware-release = { path = "../../lp-core/lpc-firmware-release" }
# The over-the-air update's host side (M7): `decide()` on this Studio's
# build facts reads a board's standing for the card's words and offers
# (`app/devices/device_update_standing.rs`); `lpc-update` parses the board
# manifest the device model carries verbatim. Both no_std + alloc.
lpa-update = { path = "../lpa-update" }
lpc-update = { path = "../../lp-core/lpc-update" }
# Which package files are access files (they never leave the library in an
# export or a share envelope; a device push does carry them).
lpc-access = { path = "../../lp-core/lpc-access" }
# The client-side display-layout fallback resolves map2d documents with the
# same resolver the engine and the device run (see
# `app/project/control_display_layout_fallback`).
lpc-mapping = { path = "../../lp-core/lpc-mapping" }
lpc-model = { path = "../../lp-core/lpc-model" }
lpc-view = { path = "../../lp-core/lpc-view" }
lpc-wire = { path = "../../lp-core/lpc-wire" }
# The save-time all-entries check (D19): loads the just-saved library copy
# with every playlist entry resident, the same coverage `lp-cli upload`
# refuses on — Studio warns instead, since a work-in-progress must still
# save. no_std + alloc, so this is fine on wasm too.
lpc-engine = { path = "../../lp-core/lpc-engine" }
lpc-registry = { path = "../../lp-core/lpc-registry" }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lps-probe = { path = "../../lp-shader/lps-probe" }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Always on: the shared-link conversation io (`app/devices/shared_link_client_io.rs`)
# implements `lpa_client::ClientIo` on every target, not only the browser ones.
async-trait = { version = "0.1" }
# The persisted last-frame sidecar (`app/devices/device_frame_snapshot.rs`)
# carries sample bytes as base64.
base64 = { workspace = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "MessageEvent",
    "OffscreenCanvas",
    "Performance",
    "Url",
    "Window",
    "Worker",
] }

[dev-dependencies]
# Host-only: the studio edit end-to-end tests run against an in-process
# LightPlayer server (simulator session, no UI). Never built for wasm.
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm" }
lpa-server = { path = "../lpa-server" }
# The link e2e tests drive the REAL provider path (DeviceSession over the
# scripted fake device); the feature is dev-only.
lpa-link = { path = "../lpa-link", features = ["fake-device"] }
# Scripted model-provider streams in the agent e2e tests.
futures-util = "0.3"
lpc-shared = { path = "../../lp-core/lpc-shared", features = ["std"] }
lpc-mapping = { path = "../../lp-core/lpc-mapping" }
jsonschema = { version = "0.46", default-features = false }
# The update host's end-to-end tests drive a model board (`BoardRig`).
lpc-update = { path = "../../lp-core/lpc-update", features = ["test-support"] }
lpfs = { path = "../../lp-base/lpfs", features = ["std"] }  # std for host tests
# App-agent evals (`app/agent/evals`): the in-process server wears the
# XIAO C6's real pin map, and scenarios are TOML fixtures.
lpc-hardware = { path = "../../lp-core/lpc-hardware" }
toml = "0.8"
# The live leg reaches OpenRouter over the host reqwest transport, which
# needs a tokio reactor (`just app-agent-eval`; never CI).
lpa-agent = { path = "../lpa-agent", features = ["host-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[features]
default = []
browser-worker = [
    "lpa-link/browser-worker",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
browser-serial-esp32 = [
    "lpa-link/browser-serial-esp32",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# The tab emulator's platform half (`app/devices/browser_emu_source.rs`).
# wasm-only, like the sim's worker half: the model half it plugs into
# (`emu_transport.rs`) is host-tested and pays nothing for this.
emulator-tab = [
    "lpa-link/emulator-tab",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# Web Bluetooth (M5 of the BLE remote-control plan): the platform half
# (`app/devices/browser_ble_source.rs`) over `lpa-link`'s `browser_ble`
# provider. wasm-only; the transport it plugs into (`ble_transport.rs`) is
# host-tested and pays nothing for this.
browser-ble = [
    "lpa-link/browser-ble",
    "dep:wasm-bindgen-futures",
]
# The update story's real inputs (`app/devices/device_update_fixtures.rs`):
# a board manifest, this Studio's build facts and the device view, for the
# web's stories to read through the same standing, words and offers the
# controller does. Stories only; never in an app build.
story-fixtures = []

[lints]
workspace = true

# The build stamps its app version (LP_APP_VERSION): tools/lp-app-version.
[build-dependencies]
lp-app-version = { path = "../../tools/lp-app-version" }
