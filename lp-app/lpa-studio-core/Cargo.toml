[package]
name = "lpa-studio-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Headless LightPlayer Studio application core"

[dependencies]
lpa-agent = { path = "../lpa-agent" }
# Data-only (no `diagram` feature): the provisioning flow reads the
# embedded runtime manifests + board↔build join; drawing stays web-side.
lpa-boards = { path = "../lpa-boards" }
lpa-client = { path = "../lpa-client", default-features = false }
# device-session everywhere (RuntimeAttachment::Device drives it); the host
# transport wire arrives via feature unification when a host provider
# feature is enabled (tests: fake-device below; wasm: the browser features).
lpa-link = { path = "../lpa-link", features = ["device-session"] }
lpc-history = { path = "../../lp-core/lpc-history", default-features = false }
lpc-model = { path = "../../lp-core/lpc-model" }
lpc-view = { path = "../../lp-core/lpc-view" }
lpc-wire = { path = "../../lp-core/lpc-wire" }
# Mounts raw `lpfs` images in wasm for the device filesystem backup (see
# `app/device/filesystem_backup`). Pure Rust, so the browser can do it.
littlefs-rust = { version = "0.1.0", default-features = false, features = [
    "alloc",
] }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lps-probe = { path = "../../lp-shader/lps-probe" }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
async-trait = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "MessageEvent",
    "OffscreenCanvas",
    "Performance",
    "Url",
    "Window",
    "Worker",
] }

[dev-dependencies]
# Host-only: the studio edit end-to-end tests run against an in-process
# LightPlayer server (simulator session, no UI). Never built for wasm.
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm" }
lpa-server = { path = "../lpa-server" }
# The link e2e tests drive the REAL provider path (DeviceSession over the
# scripted fake device); the feature is dev-only.
lpa-link = { path = "../lpa-link", features = ["fake-device"] }
async-trait = { version = "0.1" }
# Scripted model-provider streams in the agent e2e tests.
futures-util = "0.3"
lpc-shared = { path = "../../lp-core/lpc-shared", features = ["std"] }
# Library create → loader round-trip tests drive the real root format gate.
lpc-registry = { path = "../../lp-core/lpc-registry" }
# The generated-project gate loads every board's package through the REAL
# engine loader and validates it against the checked-in JSON Schemas, the
# same two oracles `lp-cli` holds the checked-in example corpus to.
lpc-engine = { path = "../../lp-core/lpc-engine" }
lpc-mapping = { path = "../../lp-core/lpc-mapping" }
jsonschema = { version = "0.46", default-features = false }
lpfs = { path = "../../lp-base/lpfs", features = ["std"] }  # std for host tests

[features]
default = []
browser-worker = [
    "lpa-link/browser-worker",
    "dep:async-trait",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
browser-serial-esp32 = [
    "lpa-link/browser-serial-esp32",
    "dep:async-trait",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[lints]
workspace = true
