[package]
name = "lpa-studio-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Headless LightPlayer Studio application core"

[dependencies]
lpa-agent = { path = "../lpa-agent" }
lpa-client = { path = "../lpa-client", default-features = false }
# device-session everywhere (RuntimeAttachment::Device drives it); the host
# transport wire arrives via feature unification when a host provider
# feature is enabled (tests: fake-device below; wasm: the browser features).
lpa-link = { path = "../lpa-link", features = ["device-session"] }
lpc-history = { path = "../../lp-core/lpc-history", default-features = false }
lpc-model = { path = "../../lp-core/lpc-model" }
lpc-view = { path = "../../lp-core/lpc-view" }
lpc-wire = { path = "../../lp-core/lpc-wire" }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lps-probe = { path = "../../lp-shader/lps-probe" }
# Optional, `harness`-feature only (see [features]): the headless agent
# runner's in-process server world. Host-only; the same crates are already
# dev-dependencies for the e2e tests.
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm", optional = true }
lpa-server = { path = "../lpa-server", optional = true }
lpc-shared = { path = "../../lp-core/lpc-shared", features = [
    "std",
], optional = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
async-trait = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "MessageEvent",
    "OffscreenCanvas",
    "Performance",
    "Url",
    "Window",
    "Worker",
] }

[dev-dependencies]
# Host-only: the studio edit end-to-end tests run against an in-process
# LightPlayer server (simulator session, no UI). Never built for wasm.
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm" }
lpa-server = { path = "../lpa-server" }
# The link e2e tests drive the REAL provider path (DeviceSession over the
# scripted fake device); the feature is dev-only.
lpa-link = { path = "../lpa-link", features = ["fake-device"] }
async-trait = { version = "0.1" }
# Scripted model-provider double in the agent e2e tests; debug-dump
# parsing in the export tests.
lpa-agent-harness = { path = "../lpa-agent-harness" }
lpc-shared = { path = "../../lp-core/lpc-shared", features = ["std"] }
lpfs = { path = "../../lp-base/lpfs", features = ["std"] }  # std for host tests

[features]
default = []
# Expose the in-process studio world the e2e tests run against
# (`studio_harness` module) to the OUT-OF-CRATE headless agent runner
# (`lpa-agent-harness`, P2). Host-only, dev-shaped: never enabled by a
# production dependency edge — only the runner's `runner` feature turns it
# on. Everything it unlocks is the exact test fixture surface, so the
# public API growth is dev-tooling, not product API.
# `lpa-server/naga` is REQUIRED, not optional polish: the harness world
# offers `ShaderFrontend::Naga` (the runner's browser-parity default), and
# without the feature the engine fails every naga compile at runtime with
# "naga frontend was not built into this binary" while the run header
# claims parity (found by the first real-provider smoke). Package-scoped
# builds (`cargo run/test -p lpa-agent-harness --features runner`) get no
# feature unification from the rest of the workspace, so the frontend must
# ride this feature explicitly.
harness = [
    "dep:lp-gfx-lpvm",
    "dep:lpa-server",
    "dep:lpc-shared",
    "lpa-server/naga",
    "lpfs/std",
]
browser-worker = [
    "lpa-link/browser-worker",
    "dep:async-trait",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
browser-serial-esp32 = [
    "lpa-link/browser-serial-esp32",
    "dep:async-trait",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[lints]
workspace = true
