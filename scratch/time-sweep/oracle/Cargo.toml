# Disposable P5 sweep oracle. Detached from the lp2025 workspace on purpose
# (own `[workspace]` table): it must not appear in `--workspace` lint/test
# runs, and it is deleted wholesale in P9.
[package]
name = "time-sweep-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lps-probe = { path = "../../../lp-shader/lps-probe" }
lps-shared = { path = "../../../lp-shader/lps-shared" }
lp-collection = { path = "../../../lp-base/lp-collection", features = ["serde"] }
lpc-engine = { path = "../../../lp-core/lpc-engine" }
lpc-model = { path = "../../../lp-core/lpc-model" }
lpfs = { path = "../../../lp-base/lpfs", features = ["std"] }
lp-gfx-lpvm = { path = "../../../lp-gfx/lp-gfx-lpvm" }
lp-shader = { path = "../../../lp-shader/lp-shader" }
lpc-hardware = { path = "../../../lp-core/lpc-hardware", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
