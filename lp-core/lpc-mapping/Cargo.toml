[package]
name = "lpc-mapping"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Host-only conveniences. The schema, resolver, fit, and import paths are
# no_std + alloc and must stay that way: the device resolves mapping
# documents at project load.
std = []

[dependencies]
libm = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
