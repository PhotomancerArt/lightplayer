[package]
name = "lpc-shared"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["lpc-hardware/std", "lpfs/std"]

# Calibrate the Xtensa stack walker for the **classic** ESP32 (LX6) instead of
# the ESP32-S3 (LX7). See the `xt_map` modules in `src/backtrace.rs`: the walk
# itself is identical on both cores, but the IRAM / flash-cache / DRAM windows a
# candidate frame is bounds-checked against are not.
#
# ⚠️ Getting this wrong is silent. The walker does not fail — it rejects every
# frame and reports zero, which the firmware's crash report renders as "the
# stack was unreadable". Only `fw-esp32v3` should enable it, and only ever
# alongside the `esp32` chip feature.
xt-map-esp32-classic = []

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
libm = "0.2"
log = { workspace = true, default-features = false }
lpc-hardware = { path = "../lpc-hardware", default-features = false }
lpc-model = { path = "../lpc-model", default-features = false }
# `ser-write-json` gives the frame batcher the same serializer the ESP32 writes
# with, so it budgets frames against real on-wire byte counts (not serde_json).
lpc-wire = { path = "../lpc-wire", default-features = false, features = [
    "ser-write-json",
] }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lps-shared = { path = "../../lp-shader/lps-shared", default-features = false }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
