[package]
name = "lpc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "node-button",
    "node-radio",
    "node-fluid",
    "node-fixture",
    "node-texture",
    "node-playlist",
    "node-clock",
    "node-shader",
    "resolver-payload-cache",
    "scrub-log",
]
# Panic recovery via catch_unwind (embedded targets)
naga = ["lp-shader/naga"]
std = [
    "lpc-hardware/std",
    "lpc-shared/std",
    "lpfs/std",
    "lp-recovery/std",
]

# --- Per-node-kind runtime gates -------------------------------------------
#
# These gates are REMOVAL-only: every one of them defaults on (see `default`
# above), and switching one off only drops that node kind's runtime code and
# its exclusive dependencies from the build — it never changes what a default
# build compiles or runs. They exist so a constrained firmware build (the S3
# app layer; see the M2 plan) can link only the node kinds it actually uses.
#
# Do NOT read `node-shader` as a step toward making the GLSL JIT compiler
# itself opt-in on `lpc-engine`/`lp-server` — see the hard rule in
# `AGENTS.md` ("Make the compiler an opt-in feature ... STOP. You are about
# to break the product."). Disabling `node-shader` removes the *Shader* and
# *ComputeShader* node runtimes only; `lp-shader` stays linked whenever any
# node that uses it (fixture, fluid) is enabled, and a default build always
# has the full compiler pipeline.
#
# `Output` and `Project` are never gated: `LpServer` requires an output
# provider, and `Project` is the always-present root placeholder.
node-button = []
node-radio = []
node-fluid = []
node-fixture = ["dep:lpc-mapping"]
node-texture = []
node-playlist = []
node-clock = []
node-shader = []

# --- Resolver payload cache (removal-only, same contract as the node gates) --
#
# On: the resolver keeps resolved slot *payloads* across frames as well as the
# route and intern decisions. Off: it keeps only the decisions and recomputes
# the values, which is slower and much smaller. Measured on the classic ESP32
# with `projects/test/quad-strips-v3`: 8,368 B of heap against 13 ms of frame
# time — see `ResolverCache::set_retain_payloads`.
#
# It defaults on, so nothing changes for the studio, `lp-cli` or any host with
# real memory. `fw-esp32v3` is the one build that leaves it off, because on a
# 110 KB arena 8,368 B is roughly 90 LEDs of capacity.
resolver-payload-cache = []

# --- Phasor breakpoint log (removal-only, same contract as the gates above) --
#
# On: every phasor on a timebase keeps an event-sparse log of the breakpoints
# where its effective rate changed, and its phase is evaluated in CLOSED FORM
# from the segment covering the clock's effective time. That is what makes
# scrubbing exact — dragging the clock back to a time already seen replays the
# same `fract(phase + rate·Δt)` from the same breakpoint, bit for bit, instead
# of re-integrating a different sum of deltas.
#
# Off: the store keeps only the forward integrator (`phase += rate · delta`)
# and allocates nothing per phasor. That is the firmware posture — a device
# has no transport UI to scrub with, and a `Vec` per phasor per consumer is
# not something a 110 KB arena should carry for a studio affordance. A
# backward `scrub_offset` write still moves a device sanely: the clock
# publishes a negative delta and the integrator wraps downward (parent D6's
# "monotone-consistent" device behavior).
#
# Defaults on, so the studio, `lp-cli` and every host test get it; the
# firmware crates take `lpc-engine` (or `lpa-server`) with
# `default-features = false` and simply do not list it. `just build-fw-emu`
# and the gate-off runs in `just check-lpc-engine-gates` are what pin that.
scrub-log = []

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
hashbrown = { workspace = true }
spin = { workspace = true }
lpir = { path = "../../lp-shader/lpir", default-features = false }
lp-gfx = { path = "../../lp-gfx/lp-gfx", default-features = false }
lp-shader = { path = "../../lp-shader/lp-shader", default-features = false }
lps-q32 = { path = "../../lp-shader/lps-q32", default-features = false }
log = { workspace = true, default-features = false }

# Fixture-exclusive (confirmed by grep: only src/nodes/fixture/** and the
# fixture attach arm in project_loader.rs reference it) — optional, held by
# `node-fixture`.
lpc-mapping = { path = "../lpc-mapping", default-features = false, optional = true }
lpc-model = { path = "../lpc-model", default-features = false }
lpc-hardware = { path = "../lpc-hardware", default-features = false }
lpc-registry = { path = "../lpc-registry", default-features = false }
# `ser-write-json` lets the stream batch tree deltas against real on-wire
# byte counts (same serializer the ESP32 writes with), matching lpc-shared's
# frame batcher.
lpc-wire = { path = "../lpc-wire", default-features = false, features = [
    "ser-write-json",
] }
lp-perf = { path = "../../lp-base/lp-perf", default-features = false }
lp-recovery = { workspace = true }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lpc-shared = { path = "../lpc-shared", default-features = false }
lps-shared = { path = "../../lp-shader/lps-shared", default-features = false }
libm = "0.2"

[dev-dependencies]
# Concrete CPU graphics backend for tests and examples (the engine itself
# depends only on the `lp-gfx` traits; hosts construct the backend).
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm", default-features = false }
# Unconditional for tests (the lib's copy is optional behind node-fixture):
# small_dome_scatter derives its expectations through the mapping resolver,
# and the gates-off clippy pass compiles tests with every node gate closed.
lpc-mapping = { path = "../lpc-mapping" }
# Per-thread ambient revision so parallel engine tests that tick/stamp
# revisions cannot race each other through the process-wide clock.
lpc-model = { path = "../lpc-model", features = ["test-support"] }
lpc-hardware = { path = "../lpc-hardware", default-features = false, features = ["std"] }
lpc-shared = { path = "../lpc-shared", default-features = false, features = ["std"] }
lpfs = { path = "../../lp-base/lpfs", default-features = false, features = ["std"] }
lpc-view = { path = "../lpc-view", default-features = false, features = ["std"] }
env_logger = { workspace = true }
serde_json = { workspace = true }
# The compile-peak memory probe steps the device's own compile pipeline
# (lps-glsl staged frontend, lpvm-native backend) on the host under a
# tracking allocator. Both device ISAs: rv32 is what the ESP32-C6 links,
# Xtensa is what the classic (fw-esp32v3) and the S3 link, and the probe
# puts the two backends' peaks on one table. The emitters need no toolchain.
lps-glsl = { path = "../../lp-shader/lps-glsl", default-features = false }
lpvm-native = { path = "../../lp-shader/lpvm-native", default-features = false, features = ["isa-rv32", "isa-xt"] }
