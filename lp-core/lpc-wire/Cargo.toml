[package]
name = "lpc-wire"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["lpc-model/std"]
schema-gen = ["std", "dep:schemars", "lpc-model/schema-gen"]
# ser-write-json for streaming serialization (ESP32), and the packed sink
# (`PackSink`, `ser_wire_to`) that rides the same serializer.
ser-write-json = ["dep:ser-write-json", "dep:ryu-js", "lp-json-pack/lex"]
# A `WireLinkPort` that is a secure lp-link initiator (Noise NNpsk0 with a
# key, sealed frames): lp-cli and Studio's future network links. Nothing
# turns it on in M4; it must build for wasm32 (`check-lp-link-targets`).
secure-link = ["lp-link/secure"]

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
# Tiers and the login payloads (offers, MACs, outcomes) ride the wire as-is.
lpc-access = { path = "../lpc-access" }
lpc-model = { path = "../lpc-model", default-features = false }
# The board manifest the hello carries (`ServerHello::firmware`): the
# over-the-air update protocol's type, one definition for `M` and the hello.
lpc-update = { path = "../lpc-update" }
# The packed encoding's codec. `alloc` for the host reader's boxed learned
# table (`WireStream`); nothing in it allocates on the encode path the device
# uses.
lp-json-pack = { workspace = true, features = ["alloc"] }
# The link every USB device connection runs on (framing, CRC, resend,
# channels, lifecycle): `WireLinkPort` is a host's end of one, the payload
# codec is what rides its proto channel, and the heartbeat reports its
# counters (plan `lp2025/2026-09-27-0215-lp-link-usb-cutover`).
lp-link = { path = "../../lp-base/lp-link", default-features = false }
# Floats print exactly as ser-write-json prints them (it depends on the same
# crate), so a packed decimal decodes to the JSON text byte for byte.
ryu-js = { version = "1.0", optional = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
ser-write-json = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
lpc-model = { path = "../lpc-model", default-features = false }

[lints]
workspace = true
