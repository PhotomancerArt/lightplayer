[package]
name = "lpc-cloud-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Client<->cloud-service message vocabulary: pure types, version-and-refuse envelope, no transport"

[features]
default = []
std = []

[dependencies]
lpc-history = { path = "../lpc-history" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# NFKD normalization for `share_link::slugify` (D11: strip accents before
# folding). `lpc-cloud-api` is reached only by lp-cloud-* crates,
# lpa-cloud-client, and lpa-studio-web (verified via `cargo tree -i
# lpc-cloud-api`) — no fw-*/embedded crate links this dependency.
unicode-normalization = { workspace = true }

[lints]
workspace = true
