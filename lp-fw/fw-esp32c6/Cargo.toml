[package]
name = "fw-esp32c6"
version.workspace = true
build = "build.rs"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["esp32c6", "server", "radio"]
esp32c6 = [
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-rtos/esp32c6",
    "esp-hal/esp32c6",
]
server = [
    "fw-esp32-common/server",
    "lpc-hardware",
    "lpc-model",
    "lpc-wire",
    "lp-gfx-lpvm",
    "lpa-server",
    "lpc-shared",
    "lpfs",
]  # Enable server dependencies (lpa-server, lpc-shared, lpc-model, lpc-wire, lpfs)
radio = [
    "lpc-hardware",
    "lpc-shared",
    "esp-radio",
    "esp-radio/esp32c6",
    "esp-rtos/esp-alloc",
    "esp-rtos/esp-radio",
]  # Root-owned ESP-NOW radio capability
naga = ["lpa-server/naga"]
# NOTE: the former `ws281x_2blocks` feature is gone: the RMT block plan is now
# computed at driver init from the board manifest's declared WS281x channel
# count (1 declared channel = the whole 192-word RMT RAM, 2 = one 48-word
# block each). See `src/output/rmt/c6_rmt.rs::plan_for_declared`.

# Periodic WS281x telemetry over the serial link — OFF by default.
#
# The classic's `fw-esp32v3` feature of the same name, ported field for field:
# one `[WS281X]` line per configured channel every ~10 s from the frame-write
# path — frames/complete/trips/skips/errors, refills vs the refills an
# untruncated frame set would have needed, mean/max refill lag with its
# 9-bucket histogram, and the entry-delay pair. Identical field order on both
# chips is the point: the stress matrix compares the C6's truncation under a
# WiFi scan with the classic's, and the same grep has to read both captures.
#
# Off by default because the shipping image should not spend serial bandwidth
# or code space on it; the whole module is `cfg`'d out and the call site
# becomes an empty `#[inline(always)]` fn, so a release build pays nothing —
# not even the timer read.
#
# Build (touch src/main.rs first if flipping features):
#   cargo build --profile release-esp32 --features esp32c6,server,ws281x_telemetry
ws281x_telemetry = []

# P4 stress-matrix load generators (plan 2026-08-01-1459-rmt-priority-hli) —
# OFF by default, never shipped. Each spawns a continuous radio-load task
# beside the running server, replacing the ESP-NOW radio driver registration
# (esp_radio::wifi::new runs once per boot and the load tasks need what it
# returns). Use with `ws281x_telemetry`; `touch src/main.rs` after flipping.
stress_s2 = ["radio"]  # WiFi scan loop (repeated active scans, station mode)
stress_s3 = ["radio"]  # ESP-NOW broadcast chatter, max payload, back to back
test_rmt = []  # Test RMT driver with simple patterns (no pipeline)
test_dither = []  # Test DisplayPipeline (use with default features; server brings lpc-shared)
test_gpio = []  # Test GPIO pin toggle
test_gpio_calibrate = []  # Host-driven GPIO square-wave calibration mode
test_button = ["server"]  # Test root-owned GPIO button input with internal pull-up
test_usb = []  # Test USB serial communication
test_json = ["server"]  # Validates ser-write-json on device (sends Heartbeat via OUTGOING_SERVER_MSG)
memory_fs = []  # Use in-memory filesystem instead of persistent flash
test_oom = []   # Allocate until OOM, verify catch_unwind recovers (for panic recovery validation)
test_msafluid = []  # MSAFluid perf harness (solver + cycle timing; phase 02 wires runner)
test_fluid_demo = []  # RGB MSAFluid demo on the basic ring fixture (gpio4, 241 leds, DisplayPipeline)
test_jit_math_perf = ["lps-builtins"]  # JIT Q32 math perf harness (cycle timing; no pipeline)
test_shader_compile_incremental = ["dep:fw-checks", "dep:lp-shader", "dep:lpvm-native", "dep:lpir", "dep:lps-shared", "lps-builtins"]  # Incremental native shader compile harness on ESP32-C6
# f32 soft-float semantics harness (roadmap M9). The ONLY configuration in this
# crate that turns `float-f32` on: the C6 has no FPU, ships Fixed-mode shaders,
# and must not carry an f32 backend it never enters. Enabling it here and nowhere
# else is what keeps `just fw-esp32c6-size-check` measuring an unchanged image.
test_f32_softfloat = ["dep:lpvm-native", "dep:lpvm", "dep:lps-glsl", "dep:lpir", "dep:lps-shared", "lps-builtins", "lpc-shared", "lpvm-native/float-f32", "lps-builtins/float-f32"]
test_espnow = ["radio"]  # ESP-NOW broadcast/receive smoke test with simulated 1Hz button events

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
unwinding = { version = "0.2", default-features = false, features = ["unwinder", "fde-static", "personality", "panic"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
esp-backtrace = { version = "0.19.0", features = ["println"] }
esp-bootloader-esp-idf = { version = "0.5.0" }
esp-hal = { version = "1.1.0", features = ["log-04", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "log-04"] }
esp-radio = { version = "0.18.0", optional = true, features = ["esp-now", "log-04", "unstable", "wifi"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32c6", "jtag-serial", "log-04"] }
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }

fw-core = { path = "../fw-core", default-features = false }
fw-esp32-common = { path = "../fw-esp32-common" }
fw-checks = { path = "../fw-checks", default-features = false, features = ["check-shader-compile"], optional = true }
lps-q32 = { path = "../../lp-shader/lps-q32", default-features = false }
# The portable WS281x driver core. `default-features = false` drops its host
# `mock` backend (and the `alloc` it needs) — firmware brings its own `RmtHw`.
lp-ws281x = { path = "../lp-ws281x", default-features = false }
lps-builtins = { path = "../../lp-shader/lps-builtins", default-features = false, optional = true }
lp-shader = { path = "../../lp-shader/lp-shader", default-features = false, optional = true }
lpvm-native = { path = "../../lp-shader/lpvm-native", default-features = false, features = [
    "isa-rv32",
], optional = true }
lpir = { path = "../../lp-shader/lpir", default-features = false, optional = true }
lps-shared = { path = "../../lp-shader/lps-shared", default-features = false, optional = true }
# `test_f32_softfloat` only: the GLSL frontend and the LPVM engine/instance
# traits, so the harness can go source → machine code → call without the
# `LpsPxShader` render plumbing (it needs to call arbitrary functions, not
# render a frame).
lps-glsl = { path = "../../lp-shader/lps-glsl", default-features = false, optional = true }
lpvm = { path = "../../lp-shader/lpvm", default-features = false, optional = true }
libm = "0.2"
# Graphics backend is selected automatically by target architecture
# (RV32 → lpvm-native::rt_jit on this firmware). No Cargo feature.
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm", default-features = false, optional = true }
# fw-esp32c6 deliberately opts into every node kind it has today — all
# eight `lpa-server` node-* gates (which forward to the matching
# `lpc-engine` gate), plus `panic-recovery` — on top of the real
# `lp-gfx-lpvm` compiler backend selected below by target architecture.
# This is not a constrained build; it exists so a genuinely constrained
# firmware (the S3 app layer, M3) can list fewer of these gates on its own
# `lpa-server` dependency and link only the node kinds it runs. See
# `lpc-engine/README.md` for what each gate is worth in flash.
lpa-server = { path = "../../lp-app/lpa-server", default-features = false, features = [
    "panic-recovery",
    "node-button",
    "node-radio",
    "node-fluid",
    "node-fixture",
    "node-texture",
    "node-playlist",
    "node-clock",
    "node-shader",
], optional = true }
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false, optional = true }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false, optional = true }
lpfs = { path = "../../lp-base/lpfs", default-features = false, optional = true }
lpc-model = { path = "../../lp-core/lpc-model", default-features = false, optional = true }
lpc-wire = { path = "../../lp-core/lpc-wire", default-features = false, optional = true, features = ["ser-write-json"] }
lp-perf = { path = "../../lp-base/lp-perf", default-features = false }
lp-recovery = { path = "../../lp-base/lp-recovery", default-features = false }
lp-bootctl = { path = "../../lp-base/lp-bootctl", default-features = false }
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
hashbrown = { workspace = true }

embassy-futures = "0.1"
embedded-io-async = "0.6"
log = { workspace = true, default-features = false }

embedded-storage = "0.3"
esp-storage = { version = "0.9", features = ["esp32c6", "panic-unaligned-buffer"] }
littlefs-rust = { version = "0.1.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
