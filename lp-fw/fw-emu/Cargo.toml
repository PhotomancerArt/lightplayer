[package]
name = "fw-emu"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fw-core = { path = "../fw-core", default-features = false, features = ["emu"] }
lpa-server = { path = "../../lp-app/lpa-server", default-features = false }
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm", default-features = false }
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false }
lpfs = { path = "../../lp-base/lpfs", default-features = false }
lpc-model = { path = "../../lp-core/lpc-model", default-features = false }
lpc-wire = { path = "../../lp-core/lpc-wire", default-features = false }
lp-riscv-emu = { path = "../../lp-riscv/lp-riscv-emu", default-features = false }
lp-riscv-emu-guest = { path = "../../lp-riscv/lp-riscv-emu-guest" }
lp-perf = { path = "../../lp-base/lp-perf", features = ["syscall"] }
lp-recovery = { workspace = true }
lp-emu-abi = { path = "../../lp-emu/lp-emu-abi" }
# fw-emu depends on `lpc-engine` directly (unlike fw-esp32c6, which reaches
# it through `lpa-server`), so there is no forwarding crate to opt in on its
# behalf — `default-features = false` here means fw-emu itself must list
# every node gate it wants. It wants all eight: fw-emu exercises the full
# node set (filetests/scene_render_emu depend on it) and must not silently
# lose one. See the "trap" note on `lpa-server/Cargo.toml`'s `lpc-engine`
# dependency — the same rule applies here directly.
lpc-engine = { path = "../../lp-core/lpc-engine", default-features = false, features = [
    "node-button",
    "node-radio",
    "node-fluid",
    "node-fixture",
    "node-texture",
    "node-playlist",
    "node-clock",
    "node-shader",
    # The resolver keeps resolved payloads across frames, as the reference
    # target does (`fw-esp32c6` and `fw-esp32s3` enable it; only the classic
    # `fw-esp32v3` runs decisions-only to save arena). fw-emu is the profiler's
    # and the heap-budget gate's firmware, so it models the C6 configuration;
    # the classic's cache-off frame cost is NOT what those figures measure.
    # See docs/heap-budget-gate.md ("Fidelity limits").
    "resolver-payload-cache",
] }
lps-builtins = { path = "../../lp-shader/lps-builtins", default-features = false }
hashbrown = { workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
log = { workspace = true, default-features = false }

[features]
default = []
std = []
# Unified profile session (alloc + perf hooks); guest syscall path was renamed from `alloc-trace`.
profile = ["lp-riscv-emu-guest/profile"]
naga = ["lpa-server/naga"]

[build-dependencies]

[dev-dependencies]
lpa-client = { path = "../../lp-app/lpa-client", features = ["serial"] }
lpc-hardware = { path = "../../lp-core/lpc-hardware" }
lpc-view = { path = "../../lp-core/lpc-view" }
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf", features = ["std"] }
lp-riscv-emu = { path = "../../lp-riscv/lp-riscv-emu", features = ["std"] }
lpc-shared = { path = "../../lp-core/lpc-shared" }
lpfs = { path = "../../lp-base/lpfs", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
