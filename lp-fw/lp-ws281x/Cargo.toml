[package]
name = "lp-ws281x"
version = "0.1.0"
# Explicit (not workspace-inherited) so the crate also resolves as a path
# dependency from the excluded fw/ crates; values match [workspace.package].
edition = "2021"
license = "MIT"
repository = "https://github.com/PhotomancerArt/2026-esp32s3-experiment"
description = "Portable no_std core of a multi-channel WS2811/WS2812 RMT LED driver: pulse encoding, ping-pong refill state machine, guard-word flicker protection."
rust-version = "1.86"

[features]
default = ["mock"]
# The host-test backend. Needs `alloc`; firmware depends on this crate with
# `default-features = false`.
mock = []
# On-silicon test instrumentation: lets a hardware self-test harness suppress
# threshold interrupts to prove the guard word fires on real silicon (plan
# phase P3's truncation test). Adds nothing to the default build and must
# never be enabled in production firmware.
test_hooks = []
# Place the interrupt-service path in `.rwtext` (IRAM on ESP32-class chips,
# the section esp-hal's `#[ram]` uses). Off by default ONLY because host
# builds have no such section: **every firmware deployment must enable it.**
# The rule (2026-09-02): the full interrupt-handler path goes in RAM unless
# it costs a lot of RAM — this one costs ~1 KB.
#
# Two measurements, one per deployment shape:
# * cross-core (classic ESP32, ISR on the APP core): flash-resident service
#   code stalls behind the *other* core's cache misses on the shared SPI bus —
#   entry delays exploding from ≤53 to 65+ words (frame-fatal) the moment
#   transmission overlapped render, per-refill cost unchanged.
# * single-core (ESP32-C6, 24-word halves): the render loop owns the cache,
#   so the path is cold on each frame's first refills — 99.7 % of frames
#   truncated under the meteor example with the path in flash, 0.25 % with
#   it in RAM; refill work 15.6 → 5.7 words (defect
#   `docs/defects/2026-09-02-c6-ws281x-first-three-leds-then-stale.md`).
#
# The feature is necessary, not sufficient: a backend's `RmtHw` methods must
# be `#[inline(always)]` (plain `#[inline]` is ignored at `opt-level = "z"`),
# and the hot path must not use closures (a closure is its own codegen item
# and does not inherit the caller's section). Verify with `llvm-nm`, not by
# reading attributes.
isr-in-ram = []

[dependencies]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
