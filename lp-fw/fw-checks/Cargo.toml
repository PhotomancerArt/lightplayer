[package]
name = "fw-checks"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
std = ["serde/std", "serde_json/std"]
check-shader-compile = []
# Q32 fixed-point kernels + corpus (mul/div/sin), no chip dependency beyond
# the injected cycle-counter function pointer (see `checks::jit_math_perf`).
check-jit-math-perf = ["dep:lps-builtins"]
# The `cycle-probe` payload: the two-clock bracket, the repetition, the
# record, and the three kernels that are ordinary Rust — the code walk, the
# `.rodata` stride walk and the slice-shaped case (`checks::cycle_probe`). The
# chip-bound kernels (IRAM/flash placement, the assembly loops whose
# instruction count has to be exact, the MMIO addresses) stay in `fw-esp32c6`,
# the same way this crate keeps the cycle counter out.
check-cycle-probe = []
check-json = []
check-gpio-calibrate = []
# The `gpio-input` payload: the scripted edge table both sides are driven by,
# the quadrature decoder the GPIO interrupt handler runs, the record shapes,
# and the renderer that turns the table into the emulated side's
# `--pin-script` file (`checks::gpio_input`). No chip dependency at all — the
# pads, the product button driver, the interrupt handler and the self-loop's
# register writes are chip facts and stay in `fw-esp32c6`.
check-gpio-input = []
check-uart-bridge = []
# The `espnow-broadcast` payload: the broadcast schedule, the payload-length
# ladder, the record shapes and the phase-independent reduction of a peer's
# event counter that makes two captures comparable
# (`checks::espnow_broadcast`). No chip dependency at all — board init, the
# ESP-NOW driver, the hardware registry and the executor stay in `fw-esp32c6`,
# and the driver itself is read and never written (E-product).
check-espnow-broadcast = []
check-oom = []
# The `rmt-chase` payload: the chase pattern, the FNV-1a checksum and the
# per-frame record (`checks::rmt_chase`). No chip dependency at all — the
# harness half (board init, `Rmt`, `LedChannel`, `embassy_time`) stays in
# `fw-esp32c6`.
check-rmt = []
# The `render-loop` payload: the frame-timing accumulator and the record
# shapes for the shipped server firmware rendering a real project
# (`checks::render_loop`). No chip dependency — the cycle counter, the project
# payload and the seeding stay in `fw-esp32c6`.
check-render-loop = []
check-dither = []
check-fluid-demo = []
check-msafluid = []

[dependencies]
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
log = { workspace = true, default-features = false }
# `check-jit-math-perf` only: the Q32 kernels under test. Already a workspace
# dependency of `fw-esp32c6` for the same harness — no new dependency to the
# build, just newly linked into this crate.
lps-builtins = { path = "../../lp-shader/lps-builtins", default-features = false, optional = true }

[lints]
workspace = true
