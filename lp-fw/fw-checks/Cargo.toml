[package]
name = "fw-checks"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
std = ["serde/std", "serde_json/std"]
check-shader-compile = []
# Q32 fixed-point kernels + corpus (mul/div/sin), no chip dependency beyond
# the injected cycle-counter function pointer (see `checks::jit_math_perf`).
check-jit-math-perf = ["dep:lps-builtins"]
check-json = []
check-gpio-calibrate = []
check-uart-bridge = []
check-oom = []
# The `rmt-chase` payload: the chase pattern, the FNV-1a checksum and the
# per-frame record (`checks::rmt_chase`). No chip dependency at all — the
# harness half (board init, `Rmt`, `LedChannel`, `embassy_time`) stays in
# `fw-esp32c6`.
check-rmt = []
# The `render-loop` payload: the frame-timing accumulator and the record
# shapes for the shipped server firmware rendering a real project
# (`checks::render_loop`). No chip dependency — the cycle counter, the project
# payload and the seeding stay in `fw-esp32c6`.
check-render-loop = []
check-dither = []
check-fluid-demo = []
check-msafluid = []

[dependencies]
serde = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
log = { workspace = true, default-features = false }
# `check-jit-math-perf` only: the Q32 kernels under test. Already a workspace
# dependency of `fw-esp32c6` for the same harness — no new dependency to the
# build, just newly linked into this crate.
lps-builtins = { path = "../../lp-shader/lps-builtins", default-features = false, optional = true }

[lints]
workspace = true
