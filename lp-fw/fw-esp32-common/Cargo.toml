[package]
name = "fw-esp32-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Chip-generic firmware layer shared by per-SOC ESP32 firmware crates"

[lints]
workspace = true

# Seam rules (ADR 2026-07-29-per-chip-fw-toolchains): this crate must build under
# both the pinned nightly and the Espressif fork. NO esp-hal/esp-alloc/esp-println/
# esp-storage/esp-rtos/esp-radio, NO `unwinding`, no rust-toolchain.toml, no
# .cargo/config.toml, no panic-strategy assumptions. Chip facts arrive by injection
# (memory-stats fn, RMT RAM base, flash Storage impl, manifest fallback).
[dependencies]
fw-core = { path = "../fw-core", default-features = false }
lp-collection = { workspace = true, features = ["serde"] }
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false }
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
# `serial::chunked_write`: the select-with-timeout and the async byte sink. Both
# are `no_std` and chip-free, and both are already on every bin crate's line —
# this is the seam moving down, not a new dependency for the images.
embassy-futures = "0.1"
embedded-io-async = "0.6"
log = { workspace = true, default-features = false }
hashbrown = { workspace = true }
littlefs-rust = { version = "0.1.0", default-features = false, features = ["alloc"], optional = true }

# Server stack (heavy) — only with the `server` feature, mirroring the bin crates.
lp-recovery = { path = "../../lp-base/lp-recovery", default-features = false, optional = true }
# ⚠️ No `panic-recovery` here — the panic tier is a CHIP fact and this crate is
# forbidden from holding chip facts (see the seam rules above). That feature
# pulls `unwinding`, which has no Xtensa backend, so hard-coding it made this
# crate unbuildable for any abort-tier chip (`fw-esp32s3`,
# ADR 2026-07-29-per-chip-fw-toolchains) — a hard `compile_error!`, not a size
# regression. Chips on the unwind tier list it on their own `lpa-server` line;
# `fw-esp32c6` already does, so its resolved feature set is unchanged.
lpa-server = { path = "../../lp-app/lpa-server", default-features = false, optional = true }
lpc-model = { path = "../../lp-core/lpc-model", default-features = false, optional = true }
lpc-wire = { path = "../../lp-core/lpc-wire", default-features = false, optional = true, features = ["ser-write-json"] }
lpfs = { path = "../../lp-base/lpfs", default-features = false, optional = true }
# `serial::server_msg`'s `StackJsonWriter` implements this crate's `SerWrite`
# trait, so it must be a direct dependency and not just `lpc-wire`'s. Same
# version/features as the bin crates so all three resolve to one instance —
# two would make the impl invisible to `lpc_wire::ser_write_json_to`.
ser-write-json = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }

[features]
default = []
server = ["dep:littlefs-rust", "dep:lp-recovery", "dep:lpa-server", "dep:lpc-model", "dep:lpc-wire", "dep:lpfs", "dep:ser-write-json"]
