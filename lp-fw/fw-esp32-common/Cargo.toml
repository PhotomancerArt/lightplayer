[package]
name = "fw-esp32-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Chip-generic firmware layer shared by per-SOC ESP32 firmware crates"

[lints]
workspace = true

# Seam rules (ADR 2026-07-29-per-chip-fw-toolchains): this crate must build under
# both the pinned nightly and the Espressif fork. NO esp-hal/esp-alloc/esp-println/
# esp-storage/esp-rtos/esp-radio, NO `unwinding`, no rust-toolchain.toml, no
# .cargo/config.toml, no panic-strategy assumptions. Chip facts arrive by injection
# (memory-stats fn, RMT RAM base, flash Storage impl, manifest fallback).
[dependencies]
fw-core = { path = "../fw-core", default-features = false }
lp-collection = { workspace = true, features = ["serde"] }
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false }
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
# `serial::chunked_write`: the select-with-timeout and the async byte sink. Both
# are `no_std` and chip-free, and both are already on every bin crate's line —
# this is the seam moving down, not a new dependency for the images.
embassy-futures = "0.1"
embedded-hal-async = "1.0"
embedded-io-async = "0.6"
log = { workspace = true, default-features = false }
# `usb_link` (feature `usb-link`): the USB-Serial-JTAG host link runs lp-link
# (plan `lp-link-usb-cutover`; docs/adr/2026-09-27-lp-link-one-comms-layer.md).
# no_std + alloc, time and nonce injected; `log` for the log ring's adapter.
lp-link = { path = "../../lp-base/lp-link", default-features = false, features = ["log"], optional = true }
# The log ring's lock (`log_ring_logger`): a short critical section around one
# record push, safe from any context. The chip crate supplies the impl.
critical-section = { version = "1", optional = true }
hashbrown = { workspace = true }
# `net::NetFrameDevice` (feature `wifi`): the frame-device trait embassy-net
# runs over. Chip-free; esp-radio's `WifiDevice` implements it.
embassy-net-driver = { version = "0.2.0", optional = true }
# `net::StationSettings` / `net::StationBoard` (feature `wifi`): the network
# file the station joins from; and the tier a radio link's channel-3 message
# carries to the core's update hook (`radio_link::radio_update_channel`,
# feature `radio-link`). Already in every server image (lpa-server).
lpc-access = { path = "../../lp-core/lpc-access", optional = true }
# `net::relay` (feature `wifi`): the cloud relay's device-leg protocol and the
# board's client state machine (Wi-Fi relay plan P6). no_std, sans-IO; its
# HMAC is lpc-access's, already linked.
lpc-relay = { path = "../../lp-core/lpc-relay", optional = true }
# `radio_link::core_only_links` (feature `radio-link`): core-only's radio
# and LAN links, driving the board's update session (`lpc-update`, no_std,
# sans-IO). Already in every split image's core.
lpc-update = { path = "../../lp-core/lpc-update", optional = true }
littlefs-rust = { version = "0.1.0", default-features = false, features = ["alloc"], optional = true }

# Server stack (heavy) — only with the `server` feature, mirroring the bin crates.
lp-recovery = { path = "../../lp-base/lp-recovery", default-features = false, optional = true }
# ⚠️ The `panic-recovery` feature this note used to warn about no longer exists
# anywhere (ADR 2026-08-02-rv32-firmwares-are-abort-tier), so the specific trap
# is gone. The RULE it illustrates is the point and still holds: the panic tier
# is a CHIP fact, and this crate is forbidden from holding chip facts (see the
# seam rules above). The original incident is the reason to keep the rule
# visible — hard-coding `panic-recovery` here pulled `unwinding`, which has no
# Xtensa backend, and made this crate unbuildable for any abort-tier chip. It
# failed as a hard `compile_error!`, not a size regression. Anything
# tier-specific belongs on a chip crate's own `lpa-server` line;
# `fw-esp32c6` already does, so its resolved feature set is unchanged.
lpa-server = { path = "../../lp-app/lpa-server", default-features = false, optional = true }
lpc-model = { path = "../../lp-core/lpc-model", default-features = false, optional = true }
lpc-wire = { path = "../../lp-core/lpc-wire", default-features = false, optional = true, features = ["ser-write-json"] }
# The learned table a packed link keeps (`serial::packed_link`); `alloc` for
# its zeroed, fallible heap allocation at opt-in.
lp-json-pack = { workspace = true, optional = true, features = ["alloc"] }
lpfs = { path = "../../lp-base/lpfs", default-features = false, optional = true }
# `serial::server_msg`'s `StackJsonWriter` implements this crate's `SerWrite`
# trait, so it must be a direct dependency and not just `lpc-wire`'s. Same
# version/features as the bin crates so all three resolve to one instance —
# two would make the impl invisible to `lpc_wire::ser_write_json_to`.
ser-write-json = { version = "0.3", optional = true, default-features = false, features = ["alloc"] }
# `net::host_lan_harness` only (feature `host-lan-harness`): the no-shader
# graphics backend a harness board runs when its test passes none.
lp-gfx = { path = "../../lp-gfx/lp-gfx", optional = true, features = ["null-backend"] }

# Emulator seams (`src/seams/`; ADR docs/adr/2026-10-05-emulator-seams.md):
# the seam ABI, MIT, no_std, no deps. RISC-V only — the seam functions are RV32
# assembly — so the Xtensa firmwares that build this crate do not even see it.
[target.'cfg(target_arch = "riscv32")'.dependencies]
lp-seam = { path = "../../lp-base/lp-seam" }

[features]
default = []
# JSON Pack (plan `lp-json-pack`): write replies as packed frames on a link
# whose host opted in (`ClientRequest::SetEncoding`). Without it the board
# answers every opt-in "json". On by default in all three chip crates (Q4).
json-pack = ["server"]
# The USB-Serial-JTAG host link on lp-link (`usb_link`, `log_ring_logger`):
# the C6 and S3 turn it on. The classic's UART0 link is `uart-link`.
# The server transport over it (`usb_link::usb_link_transport`) also needs
# `server`.
usb-link = ["dep:lp-link", "dep:critical-section"]
# The radio links on lp-link (`radio_link`'s mux and port, plan
# `ble-on-lp-link`): one `Link` per open connection, Datagram framing. The
# C6's `ble` feature turns it on; the S3 and the classic have no radio link.
radio-link = ["server", "dep:lp-link", "dep:lpc-access", "dep:lpc-update"]
# The classic's UART0 host link on lp-link (`uart_link`, `log_ring_logger`;
# plan `classic-uart-on-lp-link`): the classic (v3) turns it on. The server
# transport over it (`uart_link::uart_link_transport`) also needs `server`.
uart-link = ["dep:lp-link", "dep:critical-section"]
# Frame pacing measured on the board (`frame_pace_diag`): one `[pace]` line
# every 5 s — frame intervals, render offset and judder, tick cost with and
# without requests, link-task passes. OFF by default, never shipped.
frame-pace-diag = ["dep:critical-section"]
# Every log record handed to the emulator's allocation trace as a marker, at
# the instant it is logged (`_lp_alloc_trace_mark`, an `ebreak` the chip
# crate defines — fw-esp32c6's `alloc_trace_emu`). OFF by default, never
# shipped, never flashed.
alloc-trace-marks = []
# The Wi-Fi station, chip-free (`net`; Wi-Fi roadmap M6): the join policy,
# the scan answer, and the boundary the chip's radio (and the emulator's
# network seam) plug into. The C6 turns it on.
# It also brings the LAN's links into the radio-link mux, secure: every
# network link runs lp-link's Noise handshake (plan P04, D2).
wifi = [
    "radio-link",
    "lp-link/secure",
    "dep:lpc-wire",
    "dep:lpc-access",
    "dep:lpc-relay",
    "dep:embassy-net-driver",
    "dep:critical-section",
]
# A board's LAN path on the host, for tests (`net::host_lan_harness`; Wi-Fi
# plan P06): the WebSocket server over a std TCP listener, the radio-link
# port and mux, and a real lpa-server on a memory filesystem, on std threads.
# TEST-ONLY: no firmware's line may name it. std (the embassy-time std
# driver, critical-section's std impl) comes in with it and only with it.
host-lan-harness = [
    "wifi",
    "embassy-time/std",
    "embassy-time/generic-queue-8",
    "critical-section/std",
    "dep:lp-gfx",
]
server = ["dep:littlefs-rust", "dep:lp-json-pack", "dep:lp-recovery", "dep:lpa-server", "dep:lpc-model", "dep:lpc-wire", "dep:lpfs", "dep:ser-write-json"]

[dev-dependencies]
# The seam ABI on the host, for the unit tests of `seams` and the network
# seam's adapters (every call shim runs its silicon body off riscv32).
lp-seam = { path = "../../lp-base/lp-seam" }
# Host tests of the link mux run embassy-sync channels, whose
# `CriticalSectionRawMutex` needs an implementation on the host.
critical-section = { workspace = true, features = ["std"] }
# The USB link transport's host tests read the clock and may wait for room.
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }
# The interrupted-stamp test (`hardware::manifest_loader`): the real client
# conversation against the real server's file handler, then the boot loader.
# Host-only; no image links any of this.
lpa-client = { path = "../../lp-app/lpa-client", default-features = false }
# `radio_link::core_only_links`'s tests: a real board session on the
# update crate's NOR model. Host-only.
lpc-update = { path = "../../lp-core/lpc-update", features = ["test-support"] }
async-trait = "0.1"
# Oracles for the `wifi` codecs (host tests only, never linked): a real
# WebSocket client for `net::ws`, RustCrypto's SHA-1 for its accept hash, and
# a DNS parser for `net::mdns`'s records.
tungstenite = "0.28"
sha1 = "0.10"
simple-dns = "0.9"
