[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# GNU ld through xtensa-esp32s3-elf-gcc, as fw-esp32s3.
rustflags = [
  "-C", "panic=abort",
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,--gc-sections",
]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem", "optimize_for_size"]
