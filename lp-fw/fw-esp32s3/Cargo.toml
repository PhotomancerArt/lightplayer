[package]
name = "fw-esp32s3"
version.workspace = true
build = "build.rs"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LightPlayer firmware for ESP32-S3 (Xtensa LX7)."

[features]
default = ["esp32s3", "server", "float-f32"]
esp32s3 = [
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
]

# The LightPlayer app: `LpServer` over the USB-Serial-JTAG transport, plus the
# wire-protocol serialization `serial::io_task` drives (which lives in
# `fw_esp32_common::serial::server_msg`, hence the forward below).
#
# Feature-for-feature this now matches fw-esp32c6's `server`: all eight
# `lpa-server` node gates and the same `lp-gfx-lpvm` graphics backend. The
# remaining differences are tier, not capability: no `panic-recovery` (the S3
# is abort tier) and no `radio` transport (ESP-NOW bring-up on Xtensa is a
# future milestone). See the dependency section for why each entry is
# load-bearing.
server = [
    "fw-esp32-common/server",
    "dep:lpa-server",
    "dep:lp-gfx-lpvm",
    "dep:lpc-hardware",
    "dep:lpfs",
    "dep:lpc-wire",
]

# Print every transmitted WS281x frame to the serial log: one full hex dump per
# channel after open/resize, then a periodic checksum and lit-LED count. This is
# what `scripts/m4-hardware-walk.sh` diffs against the host oracle, and it is
# opt-in because hex-formatting frames costs render time and floods the same
# USB-Serial-JTAG link the transport runs on. Deliberately NOT a `test_*`
# feature: it decorates the app path rather than replacing it, so a frame-dump
# build is the real firmware plus a transcript.
frame-dump = []

# Hardware float. This is the board that has an FPU, so this is the board that
# gets `FloatMode::F32` compiled in — the whole point of M7.
#
# Every reference is **weak** (`dep?/feat`): `lpvm-native`, `lps-builtins` and
# `lp-gfx-lpvm` are all optional here, and a strong reference would enable the
# dependency itself, dragging the JIT stack into builds that deliberately do
# not have it. So this says "if that crate is in this build, turn its f32 on",
# which is exactly the intent — the harness path reaches the first two
# directly, the app path reaches all three through `server`.
#
# On by default. The ESP32-C6 has no such feature and names nothing: it has no
# FPU and its image must not grow by a backend it never enters (f32 roadmap
# D2). The C6's byte-identical image size across this change is the proof that
# the gate does not leak, and it is checked, not asserted — see
# `just fw-esp32c6-size-check`.
#
# Note what this does *not* do: it links the capability, it does not select the
# mode. A shader compiles in F32 on this board when its authored `float_mode`
# slot says Float; every other shader is still Q32, and both kinds can run in
# one project. `CPENABLE` is armed regardless — see `board::esp32s3::fpu`.
float-f32 = [
    "lpvm-native?/float-f32",
    "lps-builtins?/float-f32",
    "lp-gfx-lpvm?/float-f32",
]

# Hardware harnesses. Any `test_*` feature makes build.rs set the `fw_harness`
# cfg, which replaces the (future) app entrypoint with a harness — mirroring
# fw-esp32c6 rather than inventing a second mechanism.
#
# Runs the Xtensa hardware-risk corpus (`lpvm_native::xt_corpus`) through the
# on-device JIT and prints PASS/FAIL per case against goldens confirmed on
# lp-xt-emu. The corpus is shared with the host golden test precisely so the
# two cannot drift.
# The silicon oracle for `lpc_shared::backtrace`'s Xtensa windowed walk: a
# known-depth call chain whose frame count must match exactly, plus corrupt
# save-area chains that must terminate. Needs no extra dependencies —
# `lpc-shared` is already unconditional for the panic path.
test_backtrace_oracle = []

# The RMT loopback self-test: every TX channel transmits into its own RX
# channel through the GPIO matrix (no wires, no strips) and the waveform is
# asserted numerically. `lp-ws281x/test_hooks` is what lets it drop a threshold
# interrupt on one channel and prove the guard word truncates that frame on
# silicon — it must never be enabled in an app build, which is why it hangs off
# this feature rather than off the dependency line.
test_loopback = ["lp-ws281x/test_hooks"]

# GPIO button diagnostic mode: D9/GPIO8 with an internal pull-up, mirroring
# fw-esp32c6's `test_button` feature. Needs `server` for the hardware
# registry/manifest and driver types the button driver is built on.
test_button = ["server"]

test_xt_jit_corpus = [
    "dep:lpvm-native",
    "dep:lpvm",
    "dep:lpir",
    "dep:lps-shared",
    "dep:lps-builtins",
]

# The M6 FP conformance rig: runs the `lp-xt-fp-vectors` corpus on the FPU and
# prints `(result, FSR)` per vector for the host to diff against predictions
# committed before any board ran. Also carries the estimate-table sweep
# (`LP_FP_MODE=tables`), which reads the implementation-defined lookup ROMs
# behind `recip0.s`/`rsqrt0.s`/`sqrt0.s`/`div0.s` back exhaustively.
#
# The generator crate is the SAME one the host predicted with — that is the
# whole design (M6 D3), and both sides print its fingerprint so a drift is a
# hard stop rather than a quiet mis-comparison. It is `no_std`, dependency-free
# and performs no float arithmetic, so it costs this image nothing but its own
# table constants.
test_xt_fp_conformance = ["dep:lp-xt-fp-vectors"]

[dependencies]
esp-hal = { version = "1.1.0", features = ["log-04", "unstable"] }
esp-backtrace = { version = "0.19.0", features = ["println"] }
esp-bootloader-esp-idf = { version = "0.5.0" }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "jtag-serial", "log-04"] }
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
esp-rtos = { version = "0.3.0", default-features = false, features = ["embassy", "log-04"] }
log = { workspace = true, default-features = false }

# Abort-tier crash recovery (ADR 2026-07-29-per-chip-fw-toolchains): the
# arch-neutral ledger, plus the backtrace capture the panic path stages. Both
# are unconditional — the crash path must exist in every app build, not just
# ones that happen to enable the server. `lpc-shared`'s reachable surface here
# is `backtrace::capture_frames` alone (M3 P4 gives it an Xtensa walker); the
# rest of the crate is stripped at link time.
lp-recovery = { path = "../../lp-base/lp-recovery", default-features = false }
lpc-shared = { path = "../../lp-core/lpc-shared", default-features = false }

# Async runtime for `serial::io_task`. Mirrors fw-esp32c6's set; the S3 runs the
# same embassy executor through esp-rtos.
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1"
embedded-io-async = "0.6"

# MessageRouter + the SerialIo trait the USB-Serial-JTAG adapter implements.
# NOTE: fw-core depends unconditionally on lpa-server, so this is the edge at
# which fw-esp32s3 starts linking the LightPlayer stack. It arrives with
# `default-features = false` (no node runtimes, no std) — P5 is what opts into
# gates deliberately.
fw-core = { path = "../fw-core", default-features = false }

# Flash-backed filesystem. The lpfs partition is located by label at runtime
# (see src/flash_storage.rs), not transcribed from partitions.csv.
embedded-storage = "0.3"
# `critical-section` is esp-storage's own default and is added back
# deliberately: it wraps every flash operation so an interrupt cannot run from
# a disabled cache mid-write. `default-features = false` without it compiles
# fine and corrupts silently — exactly the trap M2 hit twice.
esp-storage = { version = "0.9", default-features = false, features = ["critical-section", "esp32s3", "panic-unaligned-buffer"] }
littlefs-rust = { version = "0.1.0", default-features = false, features = ["alloc"] }

# The boot-time `ServerHello` plus the wire types `io_task` hands to
# `fw_esp32_common::serial::server_msg`. The `ser-write-json` sink itself moved
# down with that module, so this crate no longer names the serializer.
lpc-wire = { path = "../../lp-core/lpc-wire", default-features = false, optional = true, features = ["ser-write-json"] }

# Chip-generic firmware layer: logger, time provider, output provider, the
# chunked serial writer, and — behind `server` — the server loop, transport,
# the io_task JSON-serialization half, littlefs `LpFs`, project auto-load, and
# hardware-manifest loader. Consumed, never reimplemented; this
# crate must stay free of chip code (ADR 2026-07-29-per-chip-fw-toolchains).
fw-esp32-common = { path = "../fw-esp32-common", default-features = false }

# All eight node gates, matching fw-esp32c6. `default-features = false` means
# no gate is implied — a kind not listed here loads as an inert placeholder
# (see lpc-engine/README.md) — so this list is the exact set of node kinds the
# board can run.
#
# `node-fixture` is load-bearing for `node-shader`: `OutputNode::consume`
# requires a *control* product, `ShaderNode` produces a *visual* one, and
# `FixtureNode` is the only runtime that converts between them — a shader
# without the fixture renders into a bus nothing reads.
#
# `node-button` and `node-radio` are on ahead of their hardware services: with
# no service wired the node runtime reports a visible error ("button node has
# no button service") instead of loading as a silent placeholder, which is the
# preferred failure mode until the S3 grows the corresponding drivers.
#
# `panic-recovery` is absent on purpose: the S3 is abort tier (`panic = "abort"`
# + the lp-recovery RTC ledger), and that feature pulls `unwinding`, which is
# the C6's tier. See src/recovery/.
lpa-server = { path = "../../lp-app/lpa-server", default-features = false, features = [
    "node-button",
    "node-radio",
    "node-fluid",
    "node-fixture",
    "node-texture",
    "node-playlist",
    "node-clock",
    "node-shader",
], optional = true }

# The graphics backend, and the single biggest lever in the image. Through M3
# this was `lp-gfx` with `null-backend`, which linked no compiler at all;
# M4 replaces it with the real thing, and the difference is the headline flash
# number of this milestone.
#
# There is no ISA feature to get wrong here, and that is deliberate:
# `lp-gfx-lpvm` selects the LPVM engine by `target_arch`, so an
# `xtensa-esp32s3-none-elf` build takes `lpvm-native` with `isa-xt` and nothing
# else. Naming an ISA on this line would be the way to silently pay for a
# backend the chip cannot execute (+26,448 B measured on the C6).
#
# `lp-gfx` itself arrives transitively and **without** `null-backend`: that
# feature exists so a shader-less firmware pays nothing, and leaving it on here
# would compile a `NullGraphics` nothing constructs. When it was unconditional
# the unused module still cost 512 B of LTO perturbation.
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm", default-features = false, optional = true }

# The portable half of the WS281x driver: pulse encoding, ping-pong refill and
# guard-word flicker protection, all tested on the host. Unconditional, because
# the RMT backend under it is shared by the app path and the `test_loopback`
# harness. `default-features = false` drops the host-only `MockRmt`.
lp-ws281x = { path = "../lp-ws281x", default-features = false }

# Hardware registry/manifest for the WS281x output driver, and the filesystem
# traits the server is handed.
lpc-hardware = { path = "../../lp-core/lpc-hardware", default-features = false, optional = true }
lpfs = { path = "../../lp-base/lpfs", default-features = false, optional = true }

# Shader/JIT stack — harness-only for now, so the boot path stays dependency-free.
# `default-features = false` + explicit `isa-xt` is load-bearing: pulling the
# rv32 backend onto an Xtensa image costs flash for code the chip cannot
# execute (measured +26,448 B on the C6 before that gate existed).
lpvm-native = { path = "../../lp-shader/lpvm-native", default-features = false, features = [
    "isa-xt",
    "xt-corpus",
], optional = true }
lpvm = { path = "../../lp-shader/lpvm", default-features = false, optional = true }
lpir = { path = "../../lp-shader/lpir", default-features = false, optional = true }
lps-shared = { path = "../../lp-shader/lps-shared", default-features = false, optional = true }
lps-builtins = { path = "../../lp-shader/lps-builtins", default-features = false, optional = true }

# The M6 FP conformance corpus generator. Harness-only, `no_std`, no
# dependencies of its own, and float-free by a checked property — it must be,
# since on this board it would otherwise need the very FPU it characterizes.
lp-xt-fp-vectors = { path = "../../lp-xt/lp-xt-fp-vectors", optional = true }

[lints]
workspace = true
