# Fixture workspace — DEVICE-target crates (esp toolchain, xtensa-esp32s3-none-elf).
#
# This is its own workspace precisely so the root (stable, host-only) workspace
# never tries to build it; the root Cargo.toml lists it (and the guest crate,
# which lives under `lp-emu/` with the rest of the emulation family) in its
# exclude list. Build with ./build.sh (or `cargo build --release` here).
[workspace]
resolver = "2"
members = [
  "../../lp-emu/lp-xt-emu-guest",
  "../lps-builtins-xt-app",
  "corpus",
  "mach",
]

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
debug = 2
overflow-checks = false

[profile.dev]
opt-level = "s"

# `mach` reaches lpc-wire (through lpc-shared), whose serializer needs the
# root workspace's vendored forks: a separate workspace does not inherit the
# root `[patch]` table, so it is repeated here for the ones it needs.
# `just lint-nested-patches` fails if this falls out of step with the root.
[patch.crates-io]
ser-write-json = { path = "../../third_party/ser-write-json" }
