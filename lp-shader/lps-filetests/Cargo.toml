[package]
name = "lps-filetests"
description = "GLSL filetest infrastructure for the LightPlayer shader compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lps-builtins = { path = "../lps-builtins", features = ["std"] }
lps-shared = { path = "../lps-shared" }
lp-collection = { workspace = true }
lps-diagnostics = { path = "../lps-diagnostics", features = ["std"] }
lps-frontend = { path = "../lps-frontend" }
lps-glsl = { path = "../lps-glsl" }
lpvm = { path = "../lpvm", features = ["std"] }
lpir = { path = "../lpir" }
lpvm-cranelift = { path = "../lpvm-cranelift", features = ["riscv32-object"] }
lpvm-emu = { path = "../lpvm-emu" }
lpvm-wasm = { path = "../lpvm-wasm" }
lp-emu-core = { path = "../../lp-emu/lp-emu-core", features = ["std"] }
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf" }
lp-riscv-inst = { path = "../../lp-riscv/lp-riscv-inst" }
# `emu-xt` adds the Xtensa host engine behind the `xtn.q32`/`xtlpn.q32` targets.
# It needs the Xtensa builtins image, a gitignored cross-target artifact; when
# that is absent those targets skip with a loud note (see `runner`), so enabling
# the feature never makes the suite dependent on the esp toolchain.
lpvm-native = { path = "../lpvm-native", features = ["emu", "emu-xt", "debug"] }
# Availability probe for the skip above — same crate the engine embeds from, so
# the check cannot disagree with what the engine will find.
lps-builtins-xt-image = { path = "../../lp-xt/lps-builtins-xt-image" }
# wgpu.f32 probe target (adapter-gated; native/host-only test harness)
lp-gfx-wgpu = { path = "../../lp-gfx/lp-gfx-wgpu" }
lp-gfx-lpvm = { path = "../../lp-gfx/lp-gfx-lpvm" }
lp-shader = { path = "../lp-shader", features = ["naga"] }
wgpu = "29"
pollster = "0.3"
wasmtime = "42"
wasm-encoder = "0.245"
wasmprinter = "0.245"
anyhow = { workspace = true }
regex = { workspace = true }
walkdir = "2"
num_cpus = "1"
glob = { workspace = true }
glsl = { git = "https://github.com/light-player/glsl-parser.git", branch = "feature/spans", default-features = false, features = ["std"] }

[dev-dependencies]
libm = "0.2"

[[test]]
name = "filetests"
harness = true
