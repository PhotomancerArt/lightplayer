[package]
name = "lpvm-native"
description = "LPIR to RV32 native code generation with pool-based register allocation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Host builds and tests get every backend; firmware opts in to exactly the one
# it runs on. An ISA left out costs nothing — and an ISA left IN costs real
# flash: `isa/xt` measured +26,448 B on the ESP32-C6 image before this gate
# existed (LTO cannot drop it — `IsaTarget` is matched on a runtime value).
# Adding a backend means adding a feature here AND opting the firmware crates
# in; see README "Multi-ISA seam".
default = ["isa-rv32", "isa-xt"]
# RISC-V 32-bit backend (ESP32-C6): `isa/rv32`, its emitter and encoder.
isa-rv32 = ["dep:lp-riscv-inst"]
# Xtensa backend (ESP32-S3 / classic ESP32): `isa/xt`, its emitter and the
# per-opcode immediate table.
isa-xt = ["dep:lp-xt-inst"]
# Enable debug info generation (increases binary size, for development only)
debug = []
# Host: link with builtins ELF and run in lp-riscv-emu (pulls std).
emu = [
    # The emulation path is the rv32 reference target (lp-riscv-emu).
    "isa-rv32",
    "dep:cranelift-codegen",
    "dep:lpvm-cranelift",
    "dep:lpvm-emu",
    "dep:lp-emu-core",
    "dep:lp-riscv-elf",
    "dep:lp-riscv-emu",
    "lpvm-cranelift/riscv32-object",
    "lpvm-cranelift/std",
    "lpvm-emu/std",
    "lp-riscv-emu/std",
]

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
lpir = { path = "../lpir" }
lp-perf = { path = "../../lp-base/lp-perf", default-features = false }
lps-q32 = { path = "../lps-q32" }
lp-riscv-inst = { path = "../../lp-riscv/lp-riscv-inst", optional = true }
lpvm = { path = "../lpvm" }
lps-shared = { path = "../lps-shared" }
lps-builtin-ids = { path = "../lps-builtin-ids" }
object = { version = "0.37", default-features = false, features = ["write_core", "elf"] }
log = { workspace = true, default-features = false }
cranelift-codegen = { workspace = true, optional = true, default-features = false, features = [
    "riscv32",
] }
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf", optional = true }
lpvm-cranelift = { path = "../lpvm-cranelift", optional = true, default-features = false, features = [
    "std",
    "riscv32-object",
] }
lpvm-emu = { path = "../lpvm-emu", optional = true, default-features = false, features = ["std"] }
lp-emu-core = { path = "../../lp-emu/lp-emu-core", optional = true, features = ["std"] }
lp-riscv-emu = { path = "../../lp-riscv/lp-riscv-emu", optional = true, features = ["std"] }
lp-xt-inst = { path = "../../lp-xt/lp-xt-inst", optional = true }

[dev-dependencies]
rstest = "0.25"
# Real synth render wrappers for the rt_emu per-invocation fuel tests.
lp-shader = { path = "../lp-shader" }
# Emulator oracle for the isa/xt emitter tests (windowed execution).
lp-xt-emu = { path = "../../lp-xt/lp-xt-emu" }
# Loader + host-side oracle for the Xtensa builtins-image test: the ELF is
# cross-compiled from the SAME lps-builtins source this links natively, so the
# host build is the reference answer.
lp-xt-elf = { path = "../../lp-xt/lp-xt-elf" }
lps-builtins = { path = "../lps-builtins", default-features = false }

[target.'cfg(any(target_arch = "riscv32", target_arch = "xtensa"))'.dependencies]
lps-builtins = { path = "../lps-builtins", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
