[package]
name = "lpvm-native"
description = "LPIR to RV32 native code generation with pool-based register allocation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Host builds and tests get every backend; firmware opts in to exactly the one
# it runs on. An ISA left out costs nothing — and an ISA left IN costs real
# flash: `isa/xt` measured +26,448 B on the ESP32-C6 image before this gate
# existed (LTO cannot drop it — `IsaTarget` is matched on a runtime value).
# Adding a backend means adding a feature here AND opting the firmware crates
# in; see README "Multi-ISA seam".
default = ["isa-rv32", "isa-xt", "float-f32"]
# RISC-V 32-bit backend (ESP32-C6): `isa/rv32`, its emitter and encoder.
isa-rv32 = ["dep:lp-riscv-inst"]
# Xtensa backend (ESP32-S3 / classic ESP32): `isa/xt`, its emitter and the
# per-opcode immediate table.
isa-xt = ["dep:lp-xt-inst"]
# Native-f32 (`FloatMode::F32`) lowering: `lower_f32`, the Xtensa float
# register/ABI tables (`isa/xt/fpr`) and FP emitter, and on a JIT-capable target
# the soft-float symbol entries in the `rt_jit` builtin table.
#
# In `default` alongside the ISAs, and gated for exactly the same measured
# reason: `FloatMode` is matched on a runtime value, so LTO cannot drop the f32
# arms on its own, and a firmware crate that takes this crate with
# `default-features = false` (all of them do) links none of it. The shipping
# ESP32-C6 image runs Fixed-mode shaders only and must not grow by an f32
# backend it never enters (f32 roadmap D2); its zero-byte delta is the check
# that proves the gate holds. Pair it with `lps-builtins/float-f32`, which gates
# the `__lp_lpir_*_f32` implementations this lowering calls — the firmware
# crates name both (see `fw-esp32c6`'s `test_f32_softfloat`), because
# `lps-builtins` is a target-specific dependency here and cannot be forwarded
# from this feature on the host.
float-f32 = []
# Enable debug info generation (increases binary size, for development only)
debug = []
# The Xtensa hardware-risk corpus (`xt_corpus`), shared by the ESP32-S3 JIT
# harness and the host golden test so the two cannot drift. Needs `isa-xt` to
# be meaningful; `no_std` and off by default so the app firmware never links it.
xt-corpus = ["isa-xt"]
# Host: link with builtins ELF and run in lp-riscv-emu (pulls std).
emu = [
    # The emulation path's reference target is rv32 (lp-riscv-emu); Xtensa is
    # additive on top of it via `emu-xt`.
    "isa-rv32",
    # Host emulation is where the f32 filetest targets run, and the builtins
    # image it links is always built with the f32 family. Nothing on the host is
    # flash-constrained, so the gate has no job here.
    "float-f32",
    "dep:cranelift-codegen",
    "dep:lpvm-cranelift",
    "dep:lpvm-emu",
    "dep:lp-emu-core",
    "dep:lp-riscv-elf",
    "dep:lp-riscv-emu",
    "lpvm-cranelift/riscv32-object",
    "lpvm-cranelift/std",
    "lpvm-emu/std",
    "lp-riscv-emu/std",
]
# Host: additionally run Xtensa code in lp-xt-emu, linked against the Xtensa
# builtins image. Additive on `emu` — `isa-xt` alone still compiles just the
# backend, so the firmware ISA gate (which recovered 26,432 B of C6 flash) is
# unaffected. The builtins image is a cross-target artifact; when it has not been
# built the engine returns a clear error and consumers skip (see
# `lps-builtins-xt-image`).
emu-xt = [
    "emu",
    "isa-xt",
    "dep:lp-xt-emu",
    "dep:lp-xt-elf",
    "dep:lps-builtins-xt-image",
]

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
lpir = { path = "../lpir" }
lp-perf = { path = "../../lp-base/lp-perf", default-features = false }
lps-q32 = { path = "../lps-q32" }
lp-riscv-inst = { path = "../../lp-riscv/lp-riscv-inst", optional = true }
lpvm = { path = "../lpvm" }
lps-shared = { path = "../lps-shared" }
lps-builtin-ids = { path = "../lps-builtin-ids" }
object = { version = "0.37", default-features = false, features = ["write_core", "elf"] }
log = { workspace = true, default-features = false }
cranelift-codegen = { workspace = true, optional = true, default-features = false, features = [
    "riscv32",
] }
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf", optional = true }
lpvm-cranelift = { path = "../lpvm-cranelift", optional = true, default-features = false, features = [
    "std",
    "riscv32-object",
] }
lpvm-emu = { path = "../lpvm-emu", optional = true, default-features = false, features = ["std"] }
lp-emu-core = { path = "../../lp-emu/lp-emu-core", optional = true, features = ["std"] }
lp-riscv-emu = { path = "../../lp-riscv/lp-riscv-emu", optional = true, features = ["std"] }
lp-xt-inst = { path = "../../lp-xt/lp-xt-inst", optional = true }
# Host Xtensa execution (feature `emu-xt`): the emulator, the ELF loader for the
# builtins base image, and the build-time-embedded image itself.
lp-xt-emu = { path = "../../lp-xt/lp-xt-emu", optional = true }
lp-xt-elf = { path = "../../lp-xt/lp-xt-elf", optional = true }
lps-builtins-xt-image = { path = "../../lp-xt/lps-builtins-xt-image", optional = true }

[dev-dependencies]
rstest = "0.25"
# Real synth render wrappers for the rt_emu per-invocation fuel tests.
lp-shader = { path = "../lp-shader" }
# Host-side oracle for the Xtensa builtins-image test: the ELF is cross-compiled
# from the SAME lps-builtins source this links natively, so the host build is the
# reference answer.
lps-builtins = { path = "../lps-builtins", default-features = false }
# Also listed above as OPTIONAL regular dependencies (feature `emu-xt`). They stay
# here unconditionally because the isa/xt emitter tests and the Xtensa fixture
# tests use the emulator and loader as their oracle at *default* features, where
# `emu-xt` is off — `emu-xt` is about the host execution *engine*, not about
# whether tests may run guest code.
lp-xt-emu = { path = "../../lp-xt/lp-xt-emu" }
lp-xt-elf = { path = "../../lp-xt/lp-xt-elf" }

[target.'cfg(any(target_arch = "riscv32", target_arch = "xtensa"))'.dependencies]
lps-builtins = { path = "../lps-builtins", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
