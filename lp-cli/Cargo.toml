[package]
name = "lp-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lp-collection = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
log = { workspace = true }
anyhow = "1"
env_logger = { workspace = true }
async-trait = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
base64 = { workspace = true }
tungstenite = { version = "0.21", features = ["native-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
egui = "0.30"
eframe = "0.30"
notify = "6"
# lp-cli is host-only tooling that nothing in the firmware graphs depends on,
# so the (non-default) schema-gen features are safe to enable unconditionally.
lpc-model = { path = "../lp-core/lpc-model", features = ["schema-gen"] }
lpc-wire = { path = "../lp-core/lpc-wire" }
# `upload`'s pre-deploy all-entries check (D19): loads every playlist entry
# host-side, the same as `lp-cli/tests/examples_valid.rs`'s coverage gate.
# Also used by `pattern preview`, which loads an in-memory pattern-on-swatch
# project straight into the host engine and resolves the swatch mapping for
# its lamp positions.
lpc-engine = { path = "../lp-core/lpc-engine" }
lpc-registry = { path = "../lp-core/lpc-registry" }
lpa-server = { path = "../lp-app/lpa-server" }
# `project upgrade`: offline format migration for authored project packages.
lpa-upgrade = { path = "../lp-app/lpa-upgrade" }
lpc-mapping = { path = "../lp-core/lpc-mapping" }
lp-gfx-lpvm = { path = "../lp-gfx/lp-gfx-lpvm" }
lpa-link = { path = "../lp-app/lpa-link", features = ["host-process", "host-serial-esp32"] }
lpc-hardware = { path = "../lp-core/lpc-hardware", features = ["schema-gen"] }
lpa-boards = { path = "../lp-app/lpa-boards", features = ["schema-gen"] }
# The two persisted access files (project sidecar, device store).
lpc-access = { path = "../lp-core/lpc-access", features = ["schema-gen"] }
# `ota-manifest.json`, the OTA release manifest: its schema (`schema gen`),
# and `firmware package` / `release-assets` / `release-check`, which write,
# stage and re-verify it.
lpc-firmware-release = { path = "../lp-core/lpc-firmware-release", features = ["schema-gen"] }
# `firmware package` of a split def: the one packer of encoding 1 (`pack`),
# and the code table `ota-manifest.json`'s `requires` and `encodings[].id`
# use. lp-cli never compresses firmware itself.
lpa-update = { path = "../lp-app/lpa-update", features = ["pack"] }
lpc-update = { path = "../lp-core/lpc-update", features = ["schema-gen"] }
# `firmware release-check` validates every `ota-manifest.json` against the
# checked-in schema, embedded so the binary checks without a checkout. Also
# the corpus conformance test's validator (tests/schema_conformance.rs).
jsonschema = { version = "0.46", default-features = false }
# `firmware package`: the bootloader-range guard checks the merged image
# against the device model's hung-bootloader table.
lpa-devices = { path = "../lp-app/lpa-devices" }
schemars = { workspace = true }
lpc-shared = { path = "../lp-core/lpc-shared" }
lpfs = { path = "../lp-base/lpfs", features = ["std"] }
lpc-view = { path = "../lp-core/lpc-view" }
# `lan`: a board on the LAN (`lan:<host>[:port]`, a secure lp-link inside a
# WebSocket; Wi-Fi plan P06).
lpa-client = { path = "../lp-app/lpa-client", features = ["ws", "serial", "emu", "lan"] }
lp-emu-core = { path = "../lp-emu/lp-emu-core", features = ["std"] }
lp-riscv-emu = { path = "../lp-emu/lp-riscv-emu", features = ["std"] }
lp-perf = { path = "../lp-base/lp-perf", default-features = false }
lp-riscv-elf = { path = "../lp-riscv/lp-riscv-elf", features = ["std"] }
lp-riscv-inst = { path = "../lp-riscv/lp-riscv-inst" }
serialport = "4.8"
# `link lab --termios chrome`: set the tty's flags the way Chromium's Web
# Serial does, which serialport does not expose.
libc = "0.2"
# `link lab`: the comms lab's host half and the link it drives.
# `secure`: `link rtt|capture lan:` run a secure link (every LAN link is one).
lp-link = { path = "../lp-base/lp-link", features = ["std", "lab", "secure"] }
# fwcheck flashes locally built check ELFs in-process (M5: no espflash
# subprocess). Library-only: the `cli` feature and its dep tree stay out.
espflash = { version = "3.3", default-features = false, features = [
    "serialport",
] }
dialoguer = "0.11"
chrono = "0.4"
# `firmware install`: lightplayer.app's public firmware lookup and, when
# `--release previous` needs the GitHub releases list and `gh` is not on
# PATH, the public GitHub REST API. reqwest 0.12 is already in the workspace
# dependency graph (lp-cloud-server, lpa-agent).
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
# `firmware install`: a scratch directory for the downloaded package,
# cleaned up on drop. Already a dev-dependency here; promoted to a normal
# one for this.
tempfile = "3"
# `firmware package` hashes the merged image for the distribution manifest.
sha2 = { workspace = true }
# `firmware build|package` of a split def (the ESP32-C6): the split pipeline
# as a library, and the boot formats it lays out.
lp-fw-split = { path = "../tools/lp-fw-split" }
lp-bootctl = { path = "../lp-base/lp-bootctl" }
# Both halves of the validation system, so the registry-parity test can see
# them at once: fw-checks is the payload crate (AGPL, outside the lp-emu MIT
# fence) and lp-emu-validate is the host side, which deliberately mirrors its
# registry rather than importing it.
fw-checks = { path = "../lp-fw/fw-checks", features = [
    "std",
    "check-shader-compile",
    "check-gpio-calibrate",
    # `check-gpio-input` so that the parity test can hold the committed
    # `--pin-script` equal to the firmware's own edge table.
    "check-gpio-input",
    "check-uart-bridge",
    "check-rmt",
] }
lp-emu-validate = { path = "../lp-emu/lp-emu-validate" }
# `lp-cli emu run`: the C6 machine itself, so the front door builds and drives
# it in process rather than shelling out to a second binary and re-parsing its
# thirty flags. It was already a dev-dependency for `tests/emu_usb_hello.rs`;
# this promotes it. The fence runs the other way — nothing under `lp-emu/` may
# reach a product crate — so a product crate reaching in is fine
# (`just lint-emu-fence`).
lp-emu-esp32c6 = { path = "../lp-emu/esp/lp-emu-esp32c6" }
# `lp-cli emu run --chip esp32s3 --host-link`: since wire proto 30 the S3's
# console IS an lp-link, and only a product crate may host one (the fence), so
# the heap ratchet's S3 arm and the S3 host-side tests drive the machine from
# here. Same direction as the C6 line above.
lp-emu-esp32s3 = { path = "../lp-emu/esp/lp-emu-esp32s3" }
# `lp-cli emu run --chip esp32v3 --host-link`: since wire proto 32 the
# classic's UART0 is an lp-link (plan `classic-uart-on-lp-link`), and only a
# product crate may host one. Same direction as the two lines above.
lp-emu-esp32v3 = { path = "../lp-emu/esp/lp-emu-esp32v3" }
# `lp-cli emu serve --air`: the `LPA1` air wire codec and `ParticipantId`,
# which `lp-emu-esp32c6` uses but does not re-export. Same direction as the
# line above — a product crate reaching INTO the fence, which is fine.
lp-emu-esp-common = { path = "../lp-emu/esp/lp-emu-esp-common" }
# `lp-cli emu run --lan <fixture>` / `emu serve --lan <name>=<fixture>`: the
# virtual LAN's fixture file (`[[access_point]]` tables), the format
# `lp-emu-esp-common/testdata/virtual_lan.toml` is written in. The same major
# the emulator crates already use.
toml = "0.8"
lpir = { path = "../lp-shader/lpir" }
lps-frontend = { path = "../lp-shader/lps-frontend" }
lps-shared = { path = "../lp-shader/lps-shared" }
lp-shader = { path = "../lp-shader/lp-shader" }
# `debug` enables interleaved alloc rendering for `shader-debug` and related tooling.
lpvm-native = { path = "../lp-shader/lpvm-native", features = ["debug"] }
lpvm-cranelift = { path = "../lp-shader/lpvm-cranelift", features = ["riscv32-object"] }
unicode-width = "0.2"
rustc-demangle = "0.1"
pollster = "0.3"
# `hardware desk-images` (feature `desk-images`, off by default): Studio's
# BoardDiagram component rendered server-side to standalone SVG files for the
# desk's board bench. Off so lp-cli's normal build never pulls a UI framework.
dioxus = { version = "0.7", default-features = false, features = ["lib"], optional = true }
dioxus-ssr = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
lpa-server = { path = "../lp-app/lpa-server" }
lpc-hardware = { path = "../lp-core/lpc-hardware" }
lpc-shared = { path = "../lp-core/lpc-shared" }
lpfs = { path = "../lp-base/lpfs", features = ["std"] }
lpc-model = { path = "../lp-core/lpc-model" }
lpc-wire = { path = "../lp-core/lpc-wire", features = ["ser-write-json"] }
# The frame scanner the JSON Pack emulator test reads the link with
# (tests/emu_usb_json_pack.rs).
lp-json-pack = { workspace = true, features = ["alloc"] }
serde_json = "1"
# The host-side twins of the chip gates that need a link host since wire
# proto 30 (tests/emu_usb_link_gates.rs): the figures record they pin, and
# the strip order the pad decoder un-permutes by.
lp-emu-esp-figures = { path = "../lp-emu/esp/lp-emu-esp-figures" }
lp-ws281x = { path = "../lp-fw/lp-ws281x", default-features = false }
# The oracle for the partition-table parity test
# (tests/c6_partition_table_parity.rs): espflash's own CSV parser and binary
# encoder, already in the tree through espflash.
esp-idf-part = "0.5"
# A board's LAN path on the host (tests/lan_link.rs): the board's own
# WebSocket server, link port and mux in front of a real lpa-server.
# `json-pack` so the board answers a packed opt-in as a C6 does.
fw-esp32-common = { path = "../lp-fw/fw-esp32-common", features = ["host-lan-harness", "json-pack"] }
# Well-formedness of the SVG files `hardware desk-images` writes.
quick-xml = "0.39"

[features]
default = ["serial"]
serial = []
# `lp-cli hardware desk-images`: pictures for the desk's board bench
# (github.com/PhotomancerArt/lp-board-bench). `just desk-images` builds it.
desk-images = ["dep:dioxus", "dep:dioxus-ssr", "lpa-boards/diagram"]

[lints]
workspace = true

# The build stamps its app version (LP_APP_VERSION): tools/lp-app-version.
[build-dependencies]
lp-app-version = { path = "../tools/lp-app-version" }
