<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emulator Bench</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 20px; font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #eef1f3; color: #1b2229; }
  @media (prefers-color-scheme: dark) { body { background: #151b20; color: #e6ecef; } }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { opacity: .7; font-size: 13px; word-break: break-all; }
  button { font: inherit; padding: 10px 18px; border-radius: 6px; border: 1px solid #0e6e6a; background: #0e6e6a; color: #fff; margin: 14px 0; }
  button:disabled { opacity: .5; }
  fieldset { border: 1px solid rgba(128,128,128,.4); border-radius: 8px; margin: 14px 0 0; padding: 10px 14px; }
  legend { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
  label { font-size: 14px; margin-right: 18px; display: inline-block; }
  select { font: inherit; padding: 4px 6px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; margin-bottom: 10px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid rgba(128,128,128,.35); }
  th:first-child, td:first-child { text-align: left; }
  th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
  .headline { margin: 4px 0 16px; }
  .big { font-size: 24px; font-weight: 700; color: #0e6e6a; }
  .bad { color: #b3261e; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .big { color: #4fb8b2; } .bad { color: #f2b8b5; } }
  pre { font-size: 12px; white-space: pre-wrap; opacity: .8; overflow-x: auto; }
  #status { min-height: 1.5em; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Emulator Bench</h1>
<div class="sub" id="ua"></div>
<div class="sub" id="build">Loading build info…</div>

<fieldset>
  <legend>what to run</legend>
  <label>mode <select id="mode"></select></label>
  <label>blocks/fn (JD26) <select id="fnBlocks"></select></label>
  <label>bound <select id="timeout"></select></label>
  <label>grade <select id="grade"></select></label>
  <label>image <select id="image"></select></label>
  <label>repeats <select id="repeats"><option>1</option><option>2</option><option>3</option></select></label>
</fieldset>

<button id="run">Run</button>
<div id="status">Loading…</div>
<div id="headlines"></div>
<div class="wrap">
<table id="results" hidden>
  <thead><tr>
    <th>run</th><th>image</th><th>mode</th><th>grade</th><th>fn</th>
    <th>wall s</th><th>ns/instr</th><th>real time</th><th>cover %</th>
    <th>stay</th><th>esc %</th><th>boot ms</th><th>uart</th>
  </tr></thead>
  <tbody></tbody>
</table>
</div>
<pre id="boot"></pre>
<pre id="tail"></pre>
<script type="module">
  const $ = (id) => document.getElementById(id);
  $('ua').textContent = navigator.userAgent + ' · cores ' + (navigator.hardwareConcurrency || '?');
  const status = $('status'), tbody = document.querySelector('#results tbody');
  const table = $('results'), headlines = $('headlines'), tail = $('tail'), boot = $('boot');
  const btn = $('run'), buildEl = $('build');
  let worker = null, results = [], manifest = null;

  async function loadManifest() {
    if (manifest) return manifest;
    manifest = await (await fetch('manifest.json')).json();
    renderBuildInfo(manifest);
    fillControls(manifest);
    return manifest;
  }

  // Shown before the run starts and stays up through the whole run, so a
  // refreshed phone can see at a glance which build it is on.
  function renderBuildInfo(m) {
    const b = m.build;
    if (!b) { buildEl.textContent = ''; return; }
    buildEl.textContent = 'emu ' + b.short + ' (' + b.branch + (b.dirty ? ', dirty' : '') + ') built ' + b.built_at + ' · wasm ' + b.wasm_bytes + ' bytes';
  }

  // Every fork the phone can be A/B'd across without a rebuild: the JD26 size
  // knob and the `--interpreter` switch above all, so the Step A row is
  // re-taken on the same binary, the same image, the same device and in the
  // same session as the translated one.
  function fillControls(m) {
    const opts = (el, values, labels) => {
      el.innerHTML = values.map((v, i) => '<option value="' + v + '">' + (labels ? labels[i] : v) + '</option>').join('');
    };
    const d = m.defaults || {};
    opts($('mode'), m.modeChoices || ['jit', 'interp'], ['translated', '--interpreter']);
    opts($('fnBlocks'), m.fnBlocksChoices || [256]);
    opts($('timeout'), m.timeoutChoices || ['5500ms']);
    opts($('grade'), ['t2', 't1', 'both']);
    opts($('image'), m.images.map((i) => i.slug).concat(['all']));
    $('mode').value = d.mode || 'jit';
    $('fnBlocks').value = String(d.fnBlocks || 256);
    $('timeout').value = d.timeout || '5500ms';
    $('image').value = m.images.some((i) => i.slug === 'render-basic') ? 'render-basic' : m.images[0].slug;
  }

  function buildPlan(m) {
    const mode = $('mode').value;
    const fnBlocks = Number($('fnBlocks').value);
    const timeout = $('timeout').value;
    const grades = $('grade').value === 'both' ? ['t1', 't2'] : [$('grade').value];
    const slugs = $('image').value === 'all' ? m.images.map((i) => i.slug) : [$('image').value];
    const repeats = Number($('repeats').value);
    const wallTimeout = (m.defaults && m.defaults.wallTimeout) || 600;
    const exitOn = !!(m.defaults && m.defaults.exitOn);
    const plan = [];
    for (const slug of slugs) {
      for (let r = 0; r < repeats; r++) {
        for (const grade of grades) plan.push({ slug, grade, mode, fnBlocks, timeout, wallTimeout, exitOn });
      }
    }
    return plan;
  }

  function renderHeadlines() {
    const by = {};
    for (const r of results) {
      if (!r.realtime) continue;
      (by[r.slug + ' ' + r.grade + ' ' + r.mode] ||= []).push(r);
    }
    headlines.innerHTML = Object.entries(by).map(([key, rs]) => {
      const best = rs.reduce((a, b) => (b.realtime > a.realtime ? b : a));
      return '<div class="headline"><span class="big">' + best.realtime.toFixed(2) + '× real time</span> · ' +
        best.nsPerInstr.toFixed(2) + ' ns/guest instr · ' + key + ' (best of ' + rs.length + ')</div>';
    }).join('');
  }

  async function start() {
    const m = await loadManifest();
    const plan = buildPlan(m);
    if (worker) worker.terminate();
    // A MODULE worker: it imports jit-host.js, which is the module Studio's
    // own worker will import unchanged (JD25).
    worker = new Worker('worker.js?v=' + (m.build ? m.build.short : 'dev'), { type: 'module' });
    results = []; tbody.innerHTML = ''; headlines.innerHTML = ''; boot.textContent = ''; table.hidden = true; btn.disabled = true;
    status.textContent = 'Loading module…';
    worker.onerror = (e) => { status.innerHTML = '<span class="bad">Worker died: ' + (e.message || e) + '</span>'; btn.disabled = false; };
    worker.onmessage = (ev) => {
      const d = ev.data;
      if (d.type === 'loaded') status.textContent = 'emu.wasm (' + d.wasmBytes + ' B) compiled in ' + d.compileMs.toFixed(0) + ' ms';
      if (d.type === 'progress') status.textContent = 'Run ' + (d.i + 1) + ' of ' + d.n + ' (' + d.step.slug + ' ' + d.step.grade + ' ' + d.step.mode + ')… keep the screen on';
      if (d.type === 'result') { addRow(d.i, d.r); }
      if (d.type === 'done') { btn.disabled = false; send(m); }
      if (d.type === 'error') { status.innerHTML = '<span class="bad">Error: ' + d.message + '</span>'; btn.disabled = false; }
    };
    worker.postMessage({ plan, images: m.images });
  }

  function addRow(i, r) {
    results.push(r); table.hidden = false;
    const tr = document.createElement('tr');
    const bootMs = (r.boot || []).reduce((a, b) => a + b.discoverMs + b.emitMs + b.compileMs + b.instantiateMs, 0);
    const cells = [
      i + 1, r.slug, r.mode, r.grade, r.fnBlocks ?? '–',
      r.failed ? '–' : (r.wallMs / 1000).toFixed(2),
      r.nsPerInstr ? r.nsPerInstr.toFixed(2) : '–',
      r.realtime ? r.realtime.toFixed(3) + '×' : '–',
      r.coverage !== undefined ? r.coverage.toFixed(2) : '–',
      r.meanStay ? r.meanStay.toFixed(1) : '–',
      r.escapeRate !== undefined ? (100 * r.escapeRate).toFixed(3) : '–',
      bootMs ? bootMs.toFixed(0) : '–',
      r.uartSha256 ? r.uartSha256.slice(0, 8) : '–',
    ];
    tr.innerHTML = cells.map((c) => '<td>' + c + '</td>').join('');
    if (r.failed || r.trap || r.selftestError) tr.classList.add('bad');
    tbody.appendChild(tr);
    // JD20 says the boot cost is a product number, reported not buried: the
    // emulator's own line, verbatim, per translation event.
    if (r.boot && r.boot.length) boot.textContent = r.boot.map((b) => b.line).join('\n');
    tail.textContent = r.failed || r.selftestError || r.trap || r.tail || '';
    renderHeadlines();
  }

  async function send(m) {
    const payload = { ua: navigator.userAgent, cores: navigator.hardwareConcurrency, at: new Date().toISOString(),
      build: m.build, deviceMemory: navigator.deviceMemory || null, results };
    const name = 'result-' + payload.at.replace(/[:.]/g, '-') + '.json';
    const fd = new FormData();
    fd.append('file_to_upload', new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), name);
    try {
      const resp = await fetch('/upload?path=/', { method: 'POST', body: fd });
      status.textContent = resp.ok ? 'Done. Results sent to the Mac as ' + name + '.' : 'Done, but sending failed (' + resp.status + '). Paste the table into the chat.';
    } catch (e) { status.textContent = 'Done, but sending failed. Paste the table into the chat.'; }
  }
  btn.addEventListener('click', start);
  loadManifest().then(() => { status.textContent = 'Ready. Pick the row and press Run.'; });
</script>
</body>
</html>
