[workspace.package]
version = "40.0.0"
authors = ["Photomancer"]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.90.0"

[workspace.lints.rust]
unused_extern_crates = 'warn'
trivial_numeric_casts = 'warn'
unstable_features = 'warn'
unused_import_braces = 'warn'
unused-lifetimes = 'warn'
unused-macro-rules = 'warn'

[workspace.lints.clippy]
all = { level = 'allow', priority = -1 }
clone_on_copy = 'warn'
map_clone = 'warn'
uninlined_format_args = 'warn'
unnecessary_to_owned = 'warn'
manual_strip = 'warn'
useless_conversion = 'warn'
unnecessary_mut_passed = 'warn'
unnecessary_fallible_conversions = 'warn'
unnecessary_cast = 'warn'
allow_attributes_without_reason = 'warn'
from_over_into = 'warn'
redundant_field_names = 'warn'
multiple_bound_locations = 'warn'
extra_unused_type_parameters = 'warn'

[workspace.dependencies]
# Logging dependencies
test-log = "0.2"
env_logger = "0.11"

# Cranelift crates - git main (TestCase fix); uncomment [patch] for local path
cranelift-codegen = { git = "https://github.com/light-player/lp-cranelift", branch = "main", version = "0.127.0", default-features = false }
cranelift-frontend = { git = "https://github.com/light-player/lp-cranelift", branch = "main", version = "0.127.0", default-features = false }
cranelift-module = { git = "https://github.com/light-player/lp-cranelift", branch = "main", version = "0.127.0", default-features = false }
cranelift-object = { git = "https://github.com/light-player/lp-cranelift", branch = "main", version = "0.127.0" }
lp-collection = { path = "lp-base/lp-collection", default-features = false }
lp-recovery = { path = "lp-base/lp-recovery", default-features = false }

# Common dependencies

# Common dependencies
target-lexicon = "0.13.0"
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
anyhow = { version = "1.0.100", default-features = false }
log = { version = "0.4", default-features = false }
regex = "1.9.1"
glob = "0.3.3"
critical-section = { version = "1.2.0", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
serde = { version = "1.0.228", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
schemars = { version = "1.2.1", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.80", default-features = false, features = ["alloc", "raw_value"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# The test suites are execution-bound, not codegen-bound: the filetests run
# 31k GLSL cases through the RV32 emulator, the wasm interpreter, and the LPIR
# interpreter, and fw-tests boots a firmware image on the emulator. At
# opt-level 0 those interpreter loops dominate every timing we have — the
# `control/` filetest directory takes 20.8s unoptimized and 2.3s with the
# overrides below (9x wall, 8x CPU), and `fw-tests --test scene_render_emu`
# goes 79s -> 33s.
#
# Only the execution engines are lifted, not the compiler frontend
# (lps-glsl/lps-frontend/lpir stay at opt-level 0): the engines are rarely
# edited, so the extra codegen is paid once and cached, while shader-frontend
# work keeps its fast edit-build cycle. Lifting the frontend too was measured
# and bought only 2.3s -> 2.0s, which does not pay for the rebuild cost.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.lp-emu-core]
opt-level = 3
[profile.dev.package.lp-riscv-emu]
opt-level = 3
[profile.dev.package.lp-emu-abi]
opt-level = 3
[profile.dev.package.lp-riscv-inst]
opt-level = 3
[profile.dev.package.lp-xt-inst]
opt-level = 3
[profile.dev.package.lp-xt-emu]
opt-level = 3
[profile.dev.package.lp-xt-elf]
opt-level = 3
[profile.dev.package.lpvm]
opt-level = 3
[profile.dev.package.lpvm-wasm]
opt-level = 3
[profile.dev.package.lps-q32]
opt-level = 3
[profile.dev.package.lps-builtins]
opt-level = 3
[profile.dev.package.lp-gfx-lpvm]
opt-level = 3

[profile.release]
# Link-time optimization for all release builds - saves ~100-300 KB
lto = true
opt-level = "z"
codegen-units = 1
panic = "unwind"

# ESP32: panic=unwind for OOM recovery via unwinding crate
[profile.release-esp32]
inherits = "release"
panic = "unwind"

[profile.release-esp32.package.esp-radio]
opt-level = "s"

[profile.release-esp32.package.lps-glsl]
opt-level = "s"

# fw-esp32s3: speed-optimized codegen, NOT the workspace's opt-level="z".
# Measured on silicon 2026-07-31: at "z" the ws281x RX drain path misses the
# 30 µs half-window deadline on the cold first frame and the loopback
# harness deterministically truncates channel 0's first capture at 24 of 48
# items; at "s" (what the driver was validated at in the experiment repo) the
# full suite passes. The S3 has a 6 MB app budget with ~4.7 MB headroom, so
# size-optimized codegen buys nothing this chip needs.
[profile.release-esp32s3]
inherits = "release"
opt-level = "s"

# fw-esp32v3 (classic ESP32, LX6): same reasoning as the S3 profile above, and
# deliberately the same `opt-level = "s"` rather than the workspace default
# "z". The S3's evidence is that "z" missed a 30 µs cold-frame RMT deadline on
# the *faster* LX7; there is no reason to assume the LX6 is safe where the LX7
# was not. M4 re-checks the cold first frame with real RMT output on this chip.
# No per-package overrides — the S3 profile carries none either.
[profile.release-esp32v3]
inherits = "release"
opt-level = "s"

# Profile for fw-emu: opt-level=3 avoids Cranelift codegen bugs in emulator (InvalidMemoryAccess).
# Used by test_scene_render_fw_emu via ensure_binary_built(..with_profile("release-emu")).
[profile.release-emu]
inherits = "release"
opt-level = 3
codegen-units = 4

# Hot-path builtins are size-sensitive but still execute per pixel.
[profile.release.package.lps-builtins]
opt-level = 3
codegen-units = 4

[patch.crates-io]
esp-storage = { path = "third_party/esp-storage" }
# naga 29.0.0 fork: glsl-in lowers `&&`/`||` with side-effecting right operands
# to control flow so they short-circuit per the GLSL spec (upstream evaluates
# eagerly). See third_party/naga/README-LP.md; candidate for an upstream PR.
naga = { path = "third_party/naga" }
# no_std pp-rs fork for naga `glsl-in` on bare-metal (https://github.com/light-player/pp-rs)
pp-rs = { path = "third_party/pp-rs" }
# no_std JSON serializer patch: preserve serde_json::RawValue as raw JSON.
ser-write-json = { path = "third_party/ser-write-json" }

