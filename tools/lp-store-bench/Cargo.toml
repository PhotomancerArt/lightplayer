[package]
name = "lp-store-bench"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host testbed that races on-device store candidates through simulated power cuts on lp-nor-sim (spike tooling; never linked into firmware)"
publish = false

[dependencies]
lp-nor-sim = { path = "../../lp-base/lp-nor-sim" }
lp-crc32 = { path = "../../lp-base/lp-crc32" }
clap = { version = "4", features = ["derive"] }
rayon = "1.11"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = "1"

[lints]
workspace = true
