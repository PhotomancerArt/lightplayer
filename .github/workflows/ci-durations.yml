# Weekly check: are any of pre-merge.yml's jobs crowding their
# timeout-minutes budget? scripts/ci/job-durations.py does the measuring;
# this workflow just runs it on a schedule and goes red when something is
# `over` or `tight` (exit code 2), the same way a wedge used to go
# unnoticed until it hit its budget and got cancelled with every test
# passing (emu-c6 2026-09-08, heap-budget-chips 2026-10-06). See
# docs/debt/ci-runner-time-over-the-concurrency-cap.md.
#
# Deliberately its own workflow, not a pre-merge job: it runs on a
# schedule, never on `pull_request`, and reads pre-merge.yml's history
# rather than gating it — `check-red-main-needs.py` only looks at
# pre-merge.yml, so this file needs no `needs:` entry there.
name: CI durations

on:
  schedule:
    # Monday 14:00 UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  job-durations:
    name: Pre-merge job durations
    runs-on: ubuntu-24.04
    # The first run (37572977722) took 13.2 of 15 minutes: ~300 runs' job
    # lists fetched one request at a time, on purpose (a parallel `gh api`
    # loop trips GitHub's secondary rate limit). The per-run cache below is
    # the real fix; 30 minutes is the headroom for a cold cache.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finished runs' job lists never change, and the script caches each by
      # run id under target/ci-durations/. Restore the newest entry (the
      # prefix match) so only runs newer than the last check are fetched.
      # Saved from the default branch only, one small entry per run, per the
      # Actions-cache rules in pre-merge.yml's header.
      - name: Restore fetched-runs cache
        uses: actions/cache/restore@v4
        with:
          path: target/ci-durations
          key: ci-durations-${{ github.run_id }}
          restore-keys: |
            ci-durations-

      - name: Measure pre-merge.yml's job durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/job-durations.py --runs 300

      # `always()`: exit 2 (a job over budget) is the signal, and it must
      # still save what it fetched, or the red week re-fetches everything.
      - name: Save fetched-runs cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/ci-durations
          key: ci-durations-${{ github.run_id }}
