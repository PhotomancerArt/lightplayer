name: CI

on:
  pull_request:
    branches: ["main", "feature/*"]
  push:
    branches: ["main"]
  # Manual story-baseline refresh: pick a branch in the Actions UI and run.
  # ONLY `validate-stories` runs (the validate jobs skip themselves below), so
  # this is the ~10-minute recapture, not the full suite. It exists because
  # the auto-commit path only fires on a *push-triggered* run: after a merge
  # that resolves baseline conflicts by hand, or any time the branch's PNGs
  # are stale with nothing new to push, there was no way to ask for a
  # recapture short of an empty commit. GitHub only shows the Run-workflow
  # button for workflows on the DEFAULT branch, so this trigger becomes
  # usable once it lands on main.
  workflow_dispatch:

# Cancel stale in-flight runs when new commits land on the same ref, except on
# main where every push should be validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_BACKTRACE: 1
  RISC_V_TARGET: riscv32imac-unknown-none-elf
  # Work around rustup rename failures on overlay/cross-device filesystems (ARM runners, Docker)
  RUSTUP_PERMIT_COPY_RENAME: 1

jobs:
  # The main validate job runs on x64. It was ARM from 2026-06 (x64 was
  # disabled over x86_64 host-JIT failures in `lpvm-cranelift`; that JIT was
  # removed 2026-07-11), and a 2026-07 side-by-side comparison run showed x64
  # green at equivalent wall-clock (19m23s x64 vs 19m51s ARM, warm caches).
  # Consolidated on x64 2026-07-27: every browser-dependent job is x64-only
  # anyway (Google Chrome ships no linux-arm64 build), and x64 runner images
  # are the better-supported default. validate-gfx stays on ARM deliberately —
  # it needs no browser and keeps a second architecture compiling the tree.
  # The GLSL filetest suite (31k cases x 5 targets) is the longest single unit
  # of work in `just test`. It only exercises the shader/exec stack, so PRs
  # that cannot reach that stack run `just test-rust` and skip it.
  #
  # The list is the *dependency closure* of the two binaries the suite builds,
  # by directory, not a guess at what "looks shader-y":
  #   - lps-filetests-app  -> lp-shader, lp-riscv, lp-gfx, lp-base, third_party
  #   - lps-builtins-emu-app (the guest ELF, built by scripts/build-builtins.sh)
  #     additionally pulls in lp-core
  # Cargo.lock is included deliberately (unlike detect-studio-web-changes): a
  # naga or wasmtime bump changes shader results, and the suite is cheap enough
  # after the profile.dev overrides in Cargo.toml that the insurance is free.
  #
  # Pushes to main always run it, so anything a filter miss lets through
  # surfaces on the very next merge.
  detect-shader-changes:
    name: Detect shader-relevant changes
    runs-on: ubuntu-24.04
    outputs:
      shader: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.shader }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shader:
              - 'lp-shader/**'
              - 'lp-riscv/**'
              - 'lp-gfx/**'
              - 'lp-base/**'
              - 'lp-core/**'
              - 'third_party/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'

  validate-x64:
    name: Validate (x64)
    runs-on: ubuntu-24.04
    needs: detect-shader-changes
    # A manual dispatch is a story-baseline recapture, not a revalidation:
    # the branch's code was already validated by the run that reviewed it.
    if: github.event_name != 'workflow_dispatch'
    # x64: full check + build + test
    steps:
      - name: Install system deps (libudev for serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: light-player/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      - name: Install RISC-V target
        run: rustup target add ${{ env.RISC_V_TARGET }}

      # rust-cache keys on the job id, so this job's cache stays separate
      # from the other jobs' and none evicts another. (The pre-2026-07
      # actions/cache config listed `target/` at the workspace root while the
      # repo checks out into `lp2025/`, so nothing was ever cached; rust-cache
      # keys on Cargo.lock + rustc version and prunes stale artifacts.)
      #
      # save-if main-only (all cache steps in this workflow): GitHub scopes
      # cache RESTORE so a PR can only see its own ref's caches plus main's,
      # and evicts LRU past the 10GB repo cap. When every PR saved ~4-5GB to
      # its own merge ref, two active PRs flushed main's baseline and every
      # new PR's first run went cache-cold (the observed 28-31m Validate runs
      # logged "No cache found"; warm runs took 17-19m). Saving only on main
      # keeps one shared warm baseline that every PR can restore, well under
      # the cap. Trade-off: repeat pushes to a PR rebuild that PR's delta each
      # time instead of resuming it — small next to the cold-start cost.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # `just test` = test-rust + test-filetests (parallel). When the shader
      # gate misses, only test-rust runs.
      - name: Validate
        env:
          TEST_RECIPE: ${{ needs.detect-shader-changes.outputs.shader == 'true' && 'test' || 'test-rust' }}
        run: cd lp2025 && just check build-ci "$TEST_RECIPE"

  # The wgpu-tree workspace members (lp-gfx-wgpu, fw-browser, naga-wasm-poc)
  # are validated in a separate job below. Building `-p lp-gfx-wgpu` unifies
  # cargo features differently from the default-members build, so folding it
  # into `just test` recompiled ~25 crates (the naga fork, wgpu-core/hal, and
  # most of lp-shader) at the tail of every Validate run, and clippy over the
  # wgpu tree added another ~1.5 min. Splitting it out keeps that work off the
  # critical path, and the paths gate skips it entirely on PRs that cannot
  # affect the GPU/wasm-sidecar build (docs, Planning, studio-web, lp-cli).
  #
  # The gate is intentionally conservative: it lists the dependency closure of
  # those crates by directory. Pushes to main always run the job, so anything
  # a filter miss lets through still surfaces on the very next merge.
  detect-gfx-changes:
    name: Detect GFX-relevant changes
    runs-on: ubuntu-24.04
    outputs:
      gfx: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.gfx }}
      browser: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.browser }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gfx:
              - 'lp-gfx/**'
              - 'lp-shader/**'
              - 'lp-riscv/**'
              - 'lp-base/**'
              - 'lp-core/**'
              - 'lp-fw/**'
              - 'lp-app/lpa-server/**'
              - 'lp-app/lpa-client/**'
              - 'lp-app/lpa-link/**'
              - 'lp-app/lpa-studio-core/**'
              - 'lp-app/lpa-fs-opfs/**'
              - 'spikes/naga-wasm-poc/**'
              - 'third_party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
            # Dependency closure (by directory) of the two real-browser wasm
            # suites: lpa-fs-opfs (real OPFS + Web Locks) and fw-browser
            # (runtime protocol over wasm). Same conservative-gate philosophy
            # as `gfx` above: misses surface on the next main push.
            browser:
              - 'lp-app/lpa-fs-opfs/**'
              - 'lp-fw/**'
              - 'lp-base/**'
              - 'lp-core/**'
              - 'lp-shader/**'
              - 'lp-gfx/**'
              - 'lp-riscv/**'
              - 'third_party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'

  validate-gfx:
    name: Validate GFX (ARM)
    runs-on: ubuntu-24.04-arm
    needs: detect-gfx-changes
    if: >-
      needs.detect-gfx-changes.outputs.gfx == 'true' &&
      github.event_name != 'workflow_dispatch'
    steps:
      - name: Install system deps (libudev for serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: light-player/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      # rust-cache keys on the job id, so this job's cache (wgpu tree) stays
      # separate from validate-x64's and neither evicts the other. save-if
      # main-only: see the validate-x64 cache step for the rationale.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Validate GFX
        run: cd lp2025 && just validate-gfx

  # Real-browser wasm suites: lpa-fs-opfs (real OPFS ops, Web Locks, store
  # round-trip — the Safari-OPFS-corruption defect class) and fw-browser
  # (runtime protocol tests). Both run `cargo test --target
  # wasm32-unknown-unknown` through wasm-bindgen-test-runner against headless
  # Chrome. Runs on x64 because Google Chrome has no linux-arm64 build; GitHub
  # x64 images preinstall Chrome and a matching chromedriver, and host arch is
  # irrelevant for wasm tests.
  validate-browser:
    name: Validate Browser (x64)
    runs-on: ubuntu-24.04
    needs: detect-gfx-changes
    if: >-
      needs.detect-gfx-changes.outputs.browser == 'true' &&
      github.event_name != 'workflow_dispatch'
    steps:
      - name: Install system deps (libudev for serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: light-player/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      # rust-cache keys on the job id, so this job's cache (wasm32 tree) stays
      # separate from the other validate jobs'. It also caches ~/.cargo/bin,
      # which amortizes the wasm-bindgen-cli install below. save-if main-only:
      # see the validate-x64 cache step for the rationale.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # Pinned to match the workspace wasm-bindgen dep; the just recipes
      # refuse to run with a missing runner and print this exact version.
      - name: Install wasm-bindgen-cli
        run: command -v wasm-bindgen-test-runner >/dev/null || cargo install wasm-bindgen-cli --version 0.2.114

      # The smoke check drives Chrome over a raw CDP WebSocket; pin node so
      # the global WebSocket client is guaranteed (same rationale as the
      # stories job).
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # End-to-end smoke: builds the fw-browser wasm bundle, loads smoke.html
      # in headless Chrome (preinstalled on the x64 image), and fails unless
      # the page reaches dataset.smoke === "ok" — the gate that catches page
      # rot and wasm-emission regressions the unit suites can't see. Runs
      # before the unit suites so a suite failure can't mask smoke signal.
      - name: fw-browser smoke check
        run: cd lp2025 && just fw-browser-smoke-check

      - name: Browser wasm tests
        run: cd lp2025 && just lpa-fs-opfs-test fw-browser-test

  # Story baselines are CI-canonical: this job captures every story with a
  # pinned browser and compares against the committed PNGs (pixel tolerance,
  # see studio-story-pngs.mjs). On drift from a same-repo PR it commits the
  # fresh set straight to the PR head branch (github-actions[bot]) and PASSES;
  # a sticky PR comment summarizes the change. Fork PRs, push races, crashed
  # captures, and main-push drift keep the fail path: `story-images-fresh`
  # artifact + `just studio-story-pull` as the manual fallback.
  #
  # GITHUB_TOKEN pushes deliberately do not trigger workflow runs: no loop
  # risk, but the bot commit (the new PR head) gets no CI run of its own — the
  # green run sits one commit back. Accepted (ADR
  # docs/adr/2026-07-26-ci-story-auto-commit.md): no required checks on this
  # repo, and the commit is images-only, produced by the very job that
  # validated it. Day-to-day: after a drift run goes green, `git pull` before
  # pushing again.
  #
  # The paths gate mirrors detect-gfx-changes: conservative directory list,
  # always-run on main pushes. Cargo.lock is deliberately EXCLUDED — a dep bump
  # can change rendering, but gating on it would run this ~20-30 min job on
  # every dependency PR; a miss surfaces on the very next merge to main.
  detect-studio-web-changes:
    name: Detect Studio-web changes
    runs-on: ubuntu-24.04
    outputs:
      studio: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.studio }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            studio:
              - 'lp-app/lpa-studio-web/**'
              - 'lp-app/lpa-studio-core/**'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'

  validate-stories:
    name: Validate story baselines
    # x64: Chrome ships no linux-arm64 build, and the canonical capture
    # environment is pinned to Chrome for Testing on x64 Linux.
    runs-on: ubuntu-24.04
    needs: detect-studio-web-changes
    if: needs.detect-studio-web-changes.outputs.studio == 'true'
    # The repo defaults workflow tokens to read-only; this job pushes baseline
    # refreshes to PR branches and posts the sticky summary comment.
    permissions:
      contents: write
      pull-requests: write
    env:
      # Bumping the pinned browser (or oxipng) is a DELIBERATE baseline-refresh
      # PR: bump, push, and this job auto-commits the regenerated PNGs to the
      # branch. Do not bump casually.
      CHROME_FOR_TESTING_VERSION: "151.0.7922.47"
      OXIPNG_VERSION: "10.1.1"
      WASM_BINDGEN_VERSION: "0.2.114"
      DIOXUS_CLI_VERSION: "0.7.9"
    steps:
      - name: Install system deps (libudev for serialport build scripts)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: light-player/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # The capture script drives Chrome over a raw CDP WebSocket; pin node so
      # the global WebSocket client is guaranteed (and rendering-adjacent
      # tooling stays deterministic).
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deploy-workflow-style cache (registry + git + bins + target) rather
      # than rust-cache: the cargo-installed tools live in ~/.cargo/bin and
      # must be cached with a key that includes their pinned versions.
      # Restore/save are split so saving happens only on main — same repo-wide
      # cache-eviction rationale as the validate-x64 cache step.
      - name: Restore cargo registry, tools, and build artifacts
        id: stories_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lp2025/target/
          key: ${{ runner.os }}-${{ runner.arch }}-stories-wb${{ env.WASM_BINDGEN_VERSION }}-dx${{ env.DIOXUS_CLI_VERSION }}-ox${{ env.OXIPNG_VERSION }}-cargo-${{ hashFiles('lp2025/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stories-wb${{ env.WASM_BINDGEN_VERSION }}-dx${{ env.DIOXUS_CLI_VERSION }}-ox${{ env.OXIPNG_VERSION }}-cargo-

      - name: Restore Chrome for Testing cache
        id: chrome_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/chrome
          key: chrome-for-testing-${{ env.CHROME_FOR_TESTING_VERSION }}

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install pinned tools (wasm-bindgen, dioxus-cli, oxipng)
        shell: bash
        run: |
          wasm-bindgen --version 2>/dev/null | grep -qF "$WASM_BINDGEN_VERSION" \
            || cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          dx --version 2>/dev/null | grep -qF "$DIOXUS_CLI_VERSION" \
            || cargo install dioxus-cli --version "$DIOXUS_CLI_VERSION" --locked --force
          oxipng --version 2>/dev/null | grep -qF "$OXIPNG_VERSION" \
            || cargo install oxipng --version "$OXIPNG_VERSION" --locked --force

      # Ubuntu 23.10+ AppArmor blocks unprivileged user namespaces, which the
      # pinned Chrome-for-Testing binary needs for its sandbox (the runner's
      # preinstalled Chrome deb ships an AppArmor profile; a raw CfT download
      # does not). Relax the restriction instead of running --no-sandbox so
      # the capture browser stays as close to a real one as possible.
      - name: Allow Chrome sandbox (unprivileged userns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Chrome for Testing (pinned)
        shell: bash
        run: |
          npx -y @puppeteer/browsers install "chrome@$CHROME_FOR_TESTING_VERSION" --path "$HOME/chrome"
          CHROME_BIN="$(find "$HOME/chrome" -type f -name chrome -path '*chrome-linux64*' | head -1)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      # `shell: bash` (not the default) so pipefail keeps tee from masking the
      # check's exit code — piped-away failures have bitten this pipeline
      # before (docs/debt/story-capture-pipeline.md).
      #
      # continue-on-error: drift is not a job failure by itself anymore — the
      # auto-commit step below resolves the common case. The "Fail on
      # unresolved story drift" step at the end restores the failure for every
      # path auto-commit can't handle. NOTE: this makes `failure()` false for
      # the rest of the job; downstream steps condition on
      # `steps.story_check.outcome` instead.
      - name: Story check
        id: story_check
        continue-on-error: true
        shell: bash
        env:
          # The historical navigate-stall wedge (a long-lived capture browser
          # degrades after a few hundred wasm navigations; see the debt
          # entry) is handled structurally by the script's periodic browser
          # restart (STUDIO_STORY_BROWSER_RESTART_EVERY, default 120), so
          # full default concurrency is fine here. Generous CDP timeout and
          # attempts stay as cheap insurance — completed captures resume
          # from disk.
          STUDIO_STORY_CDP_TIMEOUT_MS: 120000
          STUDIO_STORY_CAPTURE_ATTEMPTS: 4
        run: cd lp2025 && just studio-story-check 2>&1 | tee "$RUNNER_TEMP/story-check.log"

      # Only a COMPLETE comparison may publish an artifact: a crashed partial
      # capture staged via story-pull would delete every baseline it didn't
      # reach. The capture script writes .check-complete only after comparing
      # a full capture set. Runs on the success path too (not just failure):
      # the tolerated-evidence step below needs the completeness verdict and
      # the manifest's tolerated count even when the check passed.
      - name: Detect completed comparison
        id: check_complete
        shell: bash
        run: |
          new_dir=lp2025/lp-app/lpa-studio-web/story-images/.new
          if [ -f "$new_dir/.check-complete" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          count=0
          if [ -f "$new_dir/.refresh-manifest.json" ]; then
            count=$(jq '.tolerated | length' "$new_dir/.refresh-manifest.json" 2>/dev/null || echo 0)
          fi
          echo "tolerated_count=$count" >> "$GITHUB_OUTPUT"

      # Evidence retention for tolerated diffs. The check tolerates
      # sub-ratio pixel diffs and (before this step) THREW THE PIXELS AWAY —
      # `story-images-fresh` uploads only on failure, so a tolerated diff
      # left one log line of counts and nothing to diff. That is how the
      # Δ199 `opening-a-project` flip became undiagnosable (see
      # docs/defects/2026-07-27-story-check-tolerance-ignores-amplitude.md).
      # Uploads BOTH variants (fresh + committed baseline) of just the
      # tolerated files — a few hundred KB, never the whole set. Runs on
      # pass and fail alike: the auto-commit path also drops tolerated
      # pixels (the bot commit contains only manifest-listed files).
      # Deliberately a different artifact name from story-images-fresh:
      # story-pull selects runs by that artifact's presence, and a passing
      # run must never shadow a real drift capture.
      - name: Preserve tolerated-diff evidence (story-images-tolerated)
        if: >-
          steps.check_complete.outputs.complete == 'true' &&
          steps.check_complete.outputs.tolerated_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          cd lp2025
          new_dir=lp-app/lpa-studio-web/story-images/.new
          baseline_dir=lp-app/lpa-studio-web/story-images
          dest="$RUNNER_TEMP/story-tolerated"
          mkdir -p "$dest/fresh" "$dest/baseline"
          cp "$new_dir/.refresh-manifest.json" "$dest/"
          while IFS= read -r name; do
            cp "$new_dir/$name" "$dest/fresh/$name"
            cp "$baseline_dir/$name" "$dest/baseline/$name"
          done < <(jq -r '.tolerated[]?' "$new_dir/.refresh-manifest.json")
          {
            echo "## Tolerated story diffs (evidence retained)"
            echo
            echo 'The check tolerated pixel diffs on these stories. Both variants are'
            echo 'in the `story-images-tolerated` artifact — if the log above flags any'
            echo 'as suspected bistable (significant pixels > 0), diff them from there.'
            echo
            echo '```'
            jq -r '.tolerated[]' "$new_dir/.refresh-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tolerated-diff evidence
        if: >-
          steps.check_complete.outputs.complete == 'true' &&
          steps.check_complete.outputs.tolerated_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: story-images-tolerated
          path: ${{ runner.temp }}/story-tolerated/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      # Same-repo PRs only: fork PRs get a read-only token and fall through to
      # the artifact path below. Never --force, never rebase — a push race
      # (someone pushed mid-capture) rejects as non-fast-forward and falls
      # through likewise.
      - name: Auto-commit refreshed baselines
        id: auto_commit
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.check_complete.outputs.complete == 'true' &&
          (
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository) ||
            (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')
          )
        shell: bash
        env:
          # A manual dispatch names its branch directly; main is excluded above
          # so a mis-aimed dispatch cannot push baselines straight to it.
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          cd lp2025
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$HEAD_REF"
          BEFORE_SHA="$(git rev-parse "origin/$HEAD_REF")"
          # The pull_request checkout is a detached merge commit; the fresh
          # captures live in the gitignored story-images/.new/ and survive the
          # branch switch in place.
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          # Manifest-driven, NOT a wholesale swap: the check tolerates
          # sub-threshold anti-aliasing jitter, and copying the whole fresh set
          # committed those tolerated files anyway — that is how run-to-run
          # raster noise turned into ping-ponging baselines (see
          # docs/debt/story-capture-pipeline.md). Replace only what the
          # comparison judged stale; removals still propagate.
          node lp-app/lpa-studio-web/scripts/story-apply-refresh.mjs \
            lp-app/lpa-studio-web/story-images/.new
          git add -A -- lp-app/lpa-studio-web/story-images
          if git diff --cached --quiet; then
            # Drift was against the merge commit's baselines but the head
            # already matches the fresh set (e.g. main moved). Nothing to do.
            echo "resolved=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(studio): auto-refresh story baselines [validate-stories]" \
            -m "Captured in the pinned CI environment by run:" \
            -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if git push origin "$HEAD_REF"; then
            {
              echo "resolved=pushed"
              echo "before_sha=$BEFORE_SHA"
              echo "bot_sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "resolved=push-rejected" >> "$GITHUB_OUTPUT"
          fi

      - name: Post baseline-change PR comment
        if: >-
          steps.auto_commit.outputs.resolved == 'pushed' &&
          github.event_name == 'pull_request'
        # Cosmetic: a comment failure must not fail the job — the push already
        # landed, and GITHUB_TOKEN pushes don't retrigger CI, so a red run
        # here would stay red with no follow-up run to clear it.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ steps.auto_commit.outputs.before_sha }}
          BOT_SHA: ${{ steps.auto_commit.outputs.bot_sha }}
        run: cd lp2025 && node lp-app/lpa-studio-web/scripts/story-drift-comment.mjs

      - name: Baselines auto-committed summary
        if: steps.auto_commit.outputs.resolved == 'pushed'
        shell: bash
        env:
          BOT_SHA: ${{ steps.auto_commit.outputs.bot_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          {
            echo "## Story baselines auto-committed"
            echo
            echo "Drift was detected and resolved: fresh baselines were committed to"
            echo "\`${HEAD_REF}\` as \`${BOT_SHA}\`. GITHUB_TOKEN pushes do not trigger"
            echo "workflow runs, so that commit has no CI run of its own — this green run"
            echo "is the validating run. Remember to \`git pull\` before pushing again."
          } >> "$GITHUB_STEP_SUMMARY"

      # Fallback artifact path: fork PRs, push races, and main-push drift.
      # Skipped when the bot commit landed (the commit *is* the fresh set).
      - name: Upload fresh captures (story-images-fresh)
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.check_complete.outputs.complete == 'true' &&
          steps.auto_commit.outputs.resolved != 'pushed' &&
          steps.auto_commit.outputs.resolved != 'clean'
        uses: actions/upload-artifact@v4
        with:
          name: story-images-fresh
          path: lp2025/lp-app/lpa-studio-web/story-images/.new/
          retention-days: 7
          if-no-files-found: error
          # The capture dir itself is dot-prefixed; without this the v4
          # default hidden-file exclusion uploads nothing.
          include-hidden-files: true

      - name: Story drift summary
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.check_complete.outputs.complete == 'true' &&
          steps.auto_commit.outputs.resolved != 'pushed' &&
          steps.auto_commit.outputs.resolved != 'clean'
        shell: bash
        run: |
          {
            echo "## Story baselines differ (not auto-committed)"
            echo
            echo 'Auto-commit did not apply (fork PR, push race, or main-push drift).'
            echo 'Fresh captures are uploaded as the `story-images-fresh` artifact.'
            echo 'On this branch, run `just studio-story-pull` to stage them, review the diff, and commit.'
            echo
            echo '```'
            tail -80 "$RUNNER_TEMP/story-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture crash summary
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.check_complete.outputs.complete == 'false'
        shell: bash
        run: |
          {
            echo "## Story capture crashed (no artifact)"
            echo
            echo 'The capture did not complete, so no baseline artifact was uploaded —'
            echo 'this is a pipeline failure, not story drift. See the log tail below.'
            echo
            echo '```'
            tail -40 "$RUNNER_TEMP/story-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # story_check runs with continue-on-error, so this is what actually
      # fails the job for every drift/crash path auto-commit couldn't resolve.
      - name: Fail on unresolved story drift
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.auto_commit.outputs.resolved != 'pushed' &&
          steps.auto_commit.outputs.resolved != 'clean'
        shell: bash
        run: |
          echo "Story check failed and was not auto-resolved (fork PR, push race," \
               "crashed capture, or main-push drift). See the run summary;" \
               "'just studio-story-pull' is the manual fallback."
          exit 1

      # Main-only saves (see the restore steps above). `always()` preserves
      # the old actions/cache post-step behavior of saving even when a
      # main-push drift failed the job — the build artifacts are still good.
      - name: Save cargo registry, tools, and build artifacts (main only)
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          steps.stories_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lp2025/target/
          key: ${{ steps.stories_cache.outputs.cache-primary-key }}

      - name: Save Chrome for Testing cache (main only)
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          steps.chrome_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/chrome
          key: ${{ steps.chrome_cache.outputs.cache-primary-key }}

