name: CI

on:
  pull_request:
    branches: ["main", "feature/*"]
    # `edited` is on top of the defaults (opened, synchronize, reopened) for one
    # reason: **retargeting**. A stacked PR based on a `claude/*` branch matches
    # no filter above, so it gets NO CI AT ALL — not pending, not red, simply no
    # runs. When its base merges and it is retargeted to main, that is a base
    # edit, and without `edited` here nothing re-triggers: the PR sits there
    # looking clean, having never been validated once. That happened on #195 and
    # was caught by a human reading the checks list, which is not a control.
    #
    # Cost, accepted deliberately: `edited` also fires on title and body edits,
    # so editing a PR description re-runs the suite. Wasteful, never wrong —
    # and wrongness is the failure mode being fixed. If that cost ever bites,
    # tighten by gating on `github.event.changes.base` rather than by dropping
    # this, and check what skipped jobs do to required checks before you do.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["main"]

# Cancel stale in-flight runs when new commits land on the same PR ref. On
# main every push is validated, and each main push is its OWN group: with
# cancel off, a ref-keyed group does not cancel — it QUEUES, and every main
# run waited for the previous one to finish. Measured 2026-09-08: the main
# runs created 03:15 and 03:48 sat 21.2 and 14.8 min before their first job
# started, behind a ~30 min run each. At ~9 merges a day that queue was most
# of merge-to-green.
#
# Two main runs in flight share state; each case is fine by construction:
#   - rust-cache and the stories `actions/cache/save`: same key from both,
#     the second save logs "already exists" and the job continues.
#   - sccache: content-addressed, concurrent writes are fine.
#   - the stories snapshot push: each run pushes its own `sha-<sha>` ref (the
#     baseline authority — story-baseline-lookup.mjs reads only
#     refs/heads/sha-*) and force-updates `latest`, a convenience pointer
#     that can briefly land on the older of two out-of-order finishes.
#   - the stories baseline lookup walks main's first-parent chain for a
#     captured ancestor; a parallel run's parent may not be captured yet, so
#     it walks one further — the same thing a PR against a moving main does.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_BACKTRACE: 1
  RISC_V_TARGET: riscv32imac-unknown-none-elf
  # Work around rustup rename failures on overlay/cross-device filesystems (ARM runners, Docker)
  RUSTUP_PERMIT_COPY_RENAME: 1

# CI shape (2026-07-28 restructure — measured baseline: Validate was 39-52 min
# and dominated every run; 2026-09-08 restructure — baseline in the
# paragraphs below):
#
#   detect-changes ─┬─ lint              (fmt + clippy + repo lints)
#                   ├─ validate-x64      (build prereqs + gated test recipes + schema-check + heap ratchet)
#                   ├─ validate-gfx      (ARM; wgpu tree)
#                   ├─ validate-browser  (real-browser wasm suites)
#                   ├─ validate-stories  (story baseline capture)
#                   ├─ validate-xtensa   (Xtensa host engine + filetest corpus)
#                   ├─ firmware-xtensa   (esp32s3 image size, manifest, clippy)
#                   ├─ firmware-esp32v3  (esp32 image size, manifest, clippy)
#                   ├─ firmware-size     (esp32c6 image size, manifest)
#                   ├─ emu-c6            (the C6 SoC emulator's own suite)
#                   ├─ emu-esp32v3       (the classic ESP32 machine's gate)
#                   └─ heap-budget-chips (chip heap ratchet + lp-cli emu tests)
#
# Every job is path-gated, including lint/validate via the `core` filter, so a
# docs-only PR runs nothing but detect-changes — with one carve-out:
# `docs/user-guide/**` is compiled INTO lpa-studio-web (`include_str!`ed
# articles with build-generated embed/sim/link checks), so a user-guide-only
# PR still runs validate-x64 and validate-stories. All gates follow the same
# philosophy: conservative dependency-closure filters on PRs, and pushes to
# main force every gate true, so anything a filter miss lets through surfaces
# on the very next merge.
#
# Rebuild avoidance: rust-cache can only cache third-party deps (it prunes
# workspace-member artifacts because mtime-based fingerprints go stale on
# fresh checkouts), so before 2026-07-28 every run recompiled all ~64
# first-party crates from scratch — a no-op PR still paid 25-45 min. sccache
# (GHA cache backend) now caches individual rustc invocations
# content-addressed, workspace members included, and writes on every run (PRs
# too), so unchanged crates are cache hits regardless of mtimes. It does not
# cache build-script execution, linking, or clippy-driver lints of workspace
# crates (deps still hit). CARGO_INCREMENTAL=0 because sccache cannot cache
# incremental compiles (and CI never benefited: the incremental state was
# never restored). debug=0 because CI only needs symbol names in backtraces,
# not line tables, and it roughly halves compile output.
# validate-stories is deliberately exempt from all of this: its pinned
# capture environment must not churn (see that job).
#
# sccache has a FLOOR, measured 2026-09-08 (main run 34308562027): at
# 95-99.7 % hit rates a full test-profile build of this tree still costs
# 4-7 minutes — object fetches, linking, build scripts and proc macros, none
# of which it covers. The rule that follows: a job that builds the tree
# twice pays the floor twice, and "twice" hides in feature unification —
# `cargo test` (workspace) and `cargo run -p lp-cli` or `cargo test -p
# lp-cli` resolve features over different package sets and share no dep
# artifact. That is why validate-x64 reuses the test-built lp-cli for
# schema-check and the heap ratchet instead of a third build, and why the
# lp-cli emulator tests moved out of emu-c6 into heap-budget-chips. Only a
# restored target/ gets under the floor, and that needs the budget below.
#
# The Actions-cache budget (10 GB per repo, LRU) is the constraint every
# cache decision here answers to. On 2026-09-08 the repo held 11.7 GB in
# 5,597 entries: 5.8 GB of it was twelve per-job rust-cache copies of the
# same cargo registry (now one entry per toolchain family, see the lint
# job's cache step), 4.3 GB sccache objects, 1.07 GB the stories job's
# entry, which that pressure evicted on two of three main runs that day.
# Re-check the listing (`gh api repos/<r>/actions/caches`) before adding any
# entry over ~100 MB; what it displaces matters more than what it saves.
#
# Job timeouts (added 2026-08-05): every job carries `timeout-minutes`. Before
# this, NO workflow in the repo set one, so a wedge ran to GitHub's 6-hour
# default — burning a runner and leaving the PR's checks pending all day. Two
# validate-stories wedges on 2026-08-05 alone cost 5h08m and 3h35m of runner
# time and had to be cancelled by hand
# (docs/debt/story-capture-pipeline.md). The numbers below are sized from the
# p95 and max of the last ~60 runs' SUCCESSFUL jobs (each stated in the
# comment above the value), at roughly 2-3x the observed max. That is
# deliberately generous: the goal is to convert a wedge into a fast red, not
# to turn a slow-but-healthy run into a flake. Re-measure before tightening —
# and note a genuinely cold cache is the long tail here, not the typical run.
# A job that starts timing out legitimately wants its p95 re-measured, not a
# reflexive bump — the 2026-09-08 emu-c6 overrun was a job that had grown
# two whole builds, and the answer was a split (heap-budget-chips), with the
# raised budget kept as headroom rather than as the fix.
#
# Concurrency: PR refs cancel in-progress runs; each main push is its own
# group so main runs in parallel (the `concurrency:` block above says why).
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    # trivial (p95 0.1 min); the budget is checkout + the filter action.
    timeout-minutes: 10
    outputs:
      # docs_guide ORs into core: the user-guide articles are include_str!ed
      # into lpa-studio-web, so a markdown-only edit can break the generated
      # docs checks (embed names, sim declarations, links) that validate-x64
      # runs — the negative gate below would otherwise skip them.
      core: ${{ github.event_name != 'pull_request' && 'true' || steps.core.outputs.core == 'true' && 'true' || steps.some.outputs.docs_guide }}
      shader: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.shader }}
      gfx: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.gfx }}
      browser: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.browser }}
      studio: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.studio }}
      firmware: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.firmware }}
      emu_c6: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.emu_c6 }}
      emu_esp32v3: ${{ github.event_name != 'pull_request' && 'true' || steps.some.outputs.emu_esp32v3 }}
    steps:
      # Default quantifier ("some"): a filter is true when ANY changed file
      # matches one of its globs. Each list is the *dependency closure* of what
      # the gated job builds, by directory — not a guess at what "looks
      # relevant".
      #
      # shader gates the GLSL filetest suite (31k cases x 5 targets), the
      # longest single unit of work in `just test`. Closure of the two
      # binaries the suite builds: lps-filetests-app -> lp-shader, lp-riscv,
      # lp-xt, lp-gfx, lp-base, third_party; lps-builtins-emu-app (the guest
      # ELF, built by scripts/build-builtins.sh) additionally pulls in lp-core.
      #
      # lp-xt is in the closure because lps-filetests enables lpvm-native's
      # `emu-xt` (the Xtensa host engine, behind the xtn/xtlpn targets) and
      # because `isa-xt` is on by default, pulling lp-xt-inst into every host
      # build of lpvm-native. It is deliberately NOT in `gfx`/`browser`:
      # lp-gfx-lpvm selects its ISA per target_arch, so a host build of those
      # never compiles an Xtensa backend.
      # Cargo.lock is included deliberately: a naga or wasmtime bump changes
      # shader results, and the suite is cheap enough after the profile.dev
      # overrides in Cargo.toml that the insurance is free.
      #
      # browser is the closure of the three real-browser wasm suites:
      # lpa-fs-opfs (real OPFS + Web Locks), fw-browser (runtime protocol over
      # wasm) and lpa-link's Web Serial conformance suite (the shipped JS
      # device layer over the `navigator.serial` polyfill).
      - name: Filter changed paths (positive gates)
        id: some
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shader:
              - 'lp-shader/**'
              - 'lp-riscv/**'
              - 'lp-emu/**'
              - 'lp-xt/**'
              - 'lp-gfx/**'
              - 'lp-base/**'
              - 'lp-core/**'
              - 'third_party/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
              # The Xtensa install is a local composite action now; a change
              # to it must rebuild the jobs that use it (validate-xtensa here,
              # the two firmware-* jobs via the `firmware` filter below).
              - '.github/actions/**'
            gfx:
              - 'lp-gfx/**'
              - 'lp-shader/**'
              - 'lp-riscv/**'
              - 'lp-emu/**'
              - 'lp-base/**'
              - 'lp-core/**'
              - 'lp-fw/**'
              - 'lp-app/lpa-server/**'
              - 'lp-app/lpa-client/**'
              - 'lp-app/lpa-link/**'
              - 'lp-app/lpa-studio-core/**'
              - 'lp-app/lpa-fs-opfs/**'
              - 'spikes/naga-wasm-poc/**'
              - 'third_party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
            browser:
              - 'lp-app/lpa-fs-opfs/**'
              # The Web Serial JS layer and the `navigator.serial` polyfill
              # under it (emulator plan two, M2). Until 2026-09-09 this filter
              # listed neither, so a conformance suite for that layer would
              # have run on nothing on the very PRs that changed it — which is
              # the failure mode `docs/debt/web-serial-js-untestable.md` exists
              # about. `lpa-link` was already in the `core` filter; it is here
              # for `lpa-link-browser-test`, and `lpa-studio-web` for the two
              # polyfill files and the device controller it serves.
              - 'lp-app/lpa-link/**'
              - 'lp-app/lpa-studio-web/**'
              - 'lp-fw/**'
              - 'lp-base/**'
              - 'lp-core/**'
              - 'lp-shader/**'
              - 'lp-gfx/**'
              - 'lp-riscv/**'
              - 'lp-emu/**'
              - 'third_party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
            # Cargo.lock is deliberately EXCLUDED from studio (unlike the
            # filters above): a dep bump can change rendering, but gating on
            # it would run the ~10-15 min stories job on every dependency PR;
            # a miss surfaces on the very next merge to main.
            # Beyond the two studio crates, the list covers every crate whose
            # code or data is rendered DIRECTLY by story files: the story proc
            # macros (a sibling dir, so the studio-web glob misses it), the
            # board editor panes + BoardDiagram/catalog (board_editor_stories,
            # board_diagram_stories), the palette catalog + gradient sampling
            # that GradientStripCanvas and the palette-chooser swatches draw
            # pixels from, and the mapping editor canvas + the lpc-mapping
            # resolver/corpus its documents come from. Narrow by design — not
            # lp-app/** or lp-core/** — to keep the ~10-15 min job off
            # unrelated PRs. Deliberately NOT here: lpc-model, lpc-wire,
            # lpc-history, lpc-cloud-api — stories import them only to
            # construct fixture values, so a change there that moves pixels
            # arrives together with a studio-side edit that does trigger this.
            studio:
              - 'lp-app/lpa-studio-web/**'
              - 'lp-app/lpa-studio-web-story-macros/**'
              - 'lp-app/lpa-studio-core/**'
              - 'lp-app/lpa-board-editor/**'
              - 'lp-app/lpa-boards/**'
              - 'lp-app/lpa-palettes/**'
              - 'lp-app/lpa-mapping-editor/**'
              - 'lp-core/lpc-mapping/**'
              - 'docs/user-guide/**'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
            # The user-guide articles are compiled into lpa-studio-web
            # (include_str!), so editing only their markdown must still run
            # the generated docs checks in validate-x64. ORed into `core`
            # in the job outputs above.
            docs_guide:
              - 'docs/user-guide/**'
            # firmware gates the esp32c6 image size check. This list is
            # deliberately broad — it is the link closure of the device image,
            # and size regressions arrive through shared crates far more often
            # than through lp-fw itself (the 2026-07 overrun came from
            # lp-core mapping work). Cargo.lock is in: a dep bump is exactly
            # the kind of change that silently adds 40 KB.
            firmware:
              - 'lp-fw/**'
              - 'lp-core/**'
              - 'lp-app/lpa-server/**'
              - 'lp-shader/**'
              - 'lp-gfx/**'
              - 'lp-base/**'
              - 'lp-riscv/**'
              - 'lp-emu/**'
              - 'third_party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
              - '.github/actions/**'
            # emu_c6 gates the ESP32-C6 emulator's OWN boot-test + replay suite
            # (`just test-emu-c6`, DD27 of the 2026-09-06 esp-emulator plan):
            # the machine and its tests live in lp-emu/, and the two reference
            # firmware images it builds and boots
            # (`scripts/emu/build-reference-image.sh`, at a pinned historical
            # commit) come from lp-fw/fw-esp32c6. Deliberately narrower than
            # `firmware` above, which is the full link closure of the SHIPPED
            # device image: this job's ~69s (measured, warm cargo cache) is
            # dominated by building two extra reference images at that pinned
            # commit, cost a shared-crate bump gains nothing from re-paying
            # here when `firmware-size` already rebuilds the shipped image for
            # exactly that case. Caching prebuilt ELFs instead of building them
            # was considered and rejected (DD27).
            emu_c6:
              - 'lp-emu/**'
              - 'lp-fw/fw-esp32c6/**'
              # The tab host's WASI shim, which `scripts/emu/tab-smoke.mjs`
              # IMPORTS rather than copies (C6-in-tab P2): a change to it
              # changes what this job runs, so it must trigger this job. Since
              # P5b it is also where the JS host is attached, so the same
              # applies twice over.
              - 'lp-app/lpa-studio-web/public/lpa-link/emulator_wasi.js'
              # The recipe that builds every image this job boots. It was
              # missing until L4, so a change to the reference build — the
              # thing that decides WHICH BYTES the gates run against — ran no
              # gate at all unless it happened to touch something else.
              - 'scripts/emu/**'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
            # emu_esp32v3 is the same shape for the CLASSIC ESP32's machine
            # (`lp-emu-esp32v3`, plan three M3). The job it gates is
            # **non-required** and path-gated (Q8, ruling R10): it builds a
            # cross-target Xtensa firmware image, an `espflash save-image
            # --merge` chip from it, and then the reference image twice for
            # `--verify` — minutes, on a chip only one plan is working on.
            #
            # `lp-emu/**` rather than `lp-emu/esp/lp-emu-esp32v3/**`: the
            # classic's machine sits on `lp-emu-esp-common`'s bus, scheduler,
            # fabric and engines and on `lp-xt-emu`'s hart, so a change to any
            # of them is a change to this machine. That is also what makes
            # this job the C6's opposite number rather than its duplicate —
            # `emu_c6` and `emu_esp32v3` fire together on a shared-crate
            # change, which is the point: the two machines are the two sides
            # of the extraction M2 did, and a change that moves one and not
            # the other is exactly what nobody would notice.
            emu_esp32v3:
              - 'lp-emu/**'
              - 'lp-fw/fw-esp32v3/**'
              - 'scripts/emu/**'
              # Since M5 P5 this job also runs the classic's heap-budget
              # ratchet, so the gate has to fire when the gate's own script or
              # its recorded figures change. Neither filter covered them
              # before, which meant a record edit ran no chip gate at all.
              - 'scripts/heap-budget-check.sh'
              - 'scripts/heap-budget-record.json'
              - 'justfile'
              - '.github/workflows/pre-merge.yml'
              - '.github/actions/**'

      # `core` is the negative gate for lint + validate-x64: with
      # predicate-quantifier: every, a changed file counts only if it matches
      # ALL patterns below — i.e. it is none of the ignorable kinds. So the
      # filter is true iff the PR touches at least one file that could affect
      # a build or test.
      - name: Filter changed paths (core negative gate)
        id: core
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            core:
              - '!docs/**'
              - '!docs-archive/**'
              - '!**/*.md'
              # Planning/agent config; read only by agent tooling
              # (scripts/agent-context.sh, yona-* skills), never by a build.
              - '!agent-context.toml'
              - '!.gitignore'
              - '!LICENSE*'

  # fmt + clippy + repo lint scripts, split out of the old serial
  # `check build-ci test` chain so the ~13 min of clippy runs PARALLEL to
  # validate-x64 instead of in front of it (and so the two no longer fight
  # over the same 4 cores — the old `check` ran clippy and schema-check's
  # full dev build concurrently and both crawled). schema-check itself moved
  # into validate-x64, where its dev build shares artifacts with the test
  # builds; clippy's check-mode artifacts are shareable with nothing.
  lint:
    name: Lint (x64)
    runs-on: ubuntu-24.04
    # p95 6.5 min, max 7.1.
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      - name: Install RISC-V target
        run: rustup target add ${{ env.RISC_V_TARGET }}


      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # One rust-cache entry per toolchain family (`shared-key`), not per
      # job. With cache-targets false the entry IS the cargo registry, and
      # keying on the job id (the default) had produced twelve ~500 MB copies
      # of the same registry — 5.8 GB of the repo's 10 GB Actions-cache
      # budget, measured 2026-09-08 at 11.7 GB used — which is what kept
      # evicting the stories job's 1 GB entry (missed on 2 of 3 main runs
      # that day, 620 s of `cargo install` each time) and everyone's sccache
      # objects. The x64 nightly jobs share `x64-nightly`, the Xtensa
      # firmware pair `xtensa-fw`, validate-xtensa `xtensa-host`, the ARM
      # job `arm64-nightly`. rust-cache still adds an env hash (installed
      # toolchains + CARGO_*/RUST* env), so a family's members keep those
      # identical or the key silently splits. On main every member attempts
      # the save; the first wins and the rest log "already exists". save-if
      # main-only: GitHub scopes cache RESTORE so a PR can only see its own
      # ref's caches plus main's, and evicts LRU past the 10GB repo cap;
      # saving only on main keeps one shared warm baseline every PR can
      # restore.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          # target/ itself is NOT cached: sccache re-materializes crate
          # compiles content-addressed (91% hit rate measured on this PR's
          # warm run), and the 2-3GB-per-job target payloads pushed the repo
          # past its 10GB Actions-cache budget, which LRU-evicts into
          # thrash. Build scripts re-run each time — small next to the
          # eviction cost. The registry stays cached; ~/.cargo/bin does not
          # (cache-bin false): every tool comes prebuilt via cargo-binstall
          # in seconds, so a shared entry never depends on which job saved it.
          cache-targets: false
          cache-bin: false
          shared-key: x64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Lint
        run: cd lp2025 && just check-lint

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # fw-esp32s3 is the repo's only crate on a SECOND toolchain (Espressif's
  # Xtensa Rust fork — no upstream target exists), so no other job compiles it.
  # That is precisely the shape that rots here: 13 fw-esp32 test harnesses
  # silently stopped compiling because CI never built them. This job is the
  # anti-rot gate, and it measures the image against the same 3 MB partition
  # the C6 has overrun twice.
  #
  # Deliberately shares the broad `firmware` filter with firmware-size rather
  # than a narrow lp-fw/fw-esp32s3 one: that filter is the link closure of the
  # device image, and once this crate grows its app layer (server, storage,
  # shader engine — still ahead of it) a narrow filter would stop rebuilding on
  # the changes most likely to break it. A narrow filter here would recreate
  # the rot this job exists to prevent.
  #
  # Compile-only. Hardware validation is manual at the M6 gate; tethered CI is
  # recorded as future work, not attempted here.
  firmware-xtensa:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-24.04
    # p95 7.4 min, max 8.5.
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.firmware == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      # sccache (2026-09-08): the two Xtensa firmware jobs had been the only
      # compiling jobs without it, at 5-8.5 min each (the image build alone
      # 89-172 s). The same toolchain + build-std under sccache is what
      # validate-xtensa and deploy-cloud already run.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for espflash)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      # Installs the Xtensa Rust fork as the `esp` toolchain plus its bundled
      # GNU binutils, which the build needs on PATH — the Rust target spec
      # links through xtensa-esp32s3-elf-gcc, not rust-lld.
      #
      # Pinned rather than floating. The crate's rust-toolchain.toml says
      # `channel = "esp"`, which locally tracks whatever espup installed; CI
      # pins so a fork release cannot turn a green PR red on its own. Needs
      # >= 1.90 for the workspace MSRV — on 1.88 lpc-model genuinely fails to
      # compile (70x E0716 from the Slotted derive). Bump deliberately.
      #
      # Wrapped by a local action rather than calling esp-rs/xtensa-toolchain
      # directly: espup's release query was 403'ing on the shared runner-IP
      # rate limit. See .github/actions/xtensa-toolchain/action.yml.
      - name: Install Xtensa Rust toolchain
        uses: ./lp2025/.github/actions/xtensa-toolchain
        with:
          version: 1.95.0.0
          buildtargets: esp32s3
          default: true

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Shared `xtensa-fw` entry with firmware-esp32v3; see the lint job's
      # cache step for the shared-key rationale.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: xtensa-fw
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt, pinned to match the firmware-size job. A source build of
      # espflash cost 160 s whenever the bin cache had been evicted
      # (2026-09-08); binstall is seconds every time.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install espflash (prebuilt)
        run: cargo binstall --no-confirm --locked espflash@3.3.0

      # Builds the crate and checks the image against its 3 MB app partition.
      - name: Check esp32s3 image size
        run: cd lp2025 && just fw-esp32s3-size-check

      # The image just built must describe itself correctly: extract the
      # embedded manifest core and diff against the checked-in expectation.
      - name: Check esp32s3 embedded manifest
        run: cd lp2025 && just fw-manifest-check-esp32s3

      # The lint gate for this crate. It is separate from `clippy-host`, which
      # deliberately EXCLUDES fw-esp32s3: including it triggers a real
      # critical-section feature-unification conflict, so without this step the
      # crate has no clippy coverage anywhere.
      - name: Clippy esp32s3 firmware
        run: cd lp2025 && just clippy-fw-esp32s3

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # fw-esp32v3 (classic ESP32, "v3"/WROOM-32E) — the second crate on the
  # Xtensa fork, cloned from firmware-xtensa above. Same anti-rot rationale:
  # nothing else in CI compiles this crate.
  #
  # Shares the broad `firmware` filter with firmware-xtensa and
  # firmware-size, for the same reason both give: it is the link closure of
  # the device image, and a narrow lp-fw/fw-esp32v3 filter would stop
  # rebuilding on shared-crate changes most likely to break it — which since
  # M3-P1 is the whole `lpa-server` / `fw-esp32-common` stack.
  #
  # Compile-only, like firmware-xtensa: hardware validation is manual.
  firmware-esp32v3:
    name: Firmware build (esp32v3)
    runs-on: ubuntu-24.04
    # p95 5.3 min, max 6.7.
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.firmware == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      # sccache (2026-09-08): the two Xtensa firmware jobs had been the only
      # compiling jobs without it, at 5-8.5 min each (the image build alone
      # 89-172 s). The same toolchain + build-std under sccache is what
      # validate-xtensa and deploy-cloud already run.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for espflash)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      # Installs the Xtensa Rust fork as the `esp` toolchain plus its bundled
      # GNU binutils, which the build needs on PATH — the Rust target spec
      # links through xtensa-esp32-elf-gcc, not rust-lld.
      #
      # Pinned rather than floating, same reasoning and same pin as
      # firmware-xtensa: the crate's rust-toolchain.toml says `channel = "esp"`,
      # which locally tracks whatever espup installed; CI pins so a fork
      # release cannot turn a green PR red on its own. Keep this version in
      # sync with firmware-xtensa's.
      - name: Install Xtensa Rust toolchain
        uses: ./lp2025/.github/actions/xtensa-toolchain
        with:
          version: 1.95.0.0
          buildtargets: esp32
          default: true

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # `lp2025 -> target`, mirroring firmware-xtensa: this crate is a
      # repo-root workspace member (M3-P1 folded it in) and writes into the
      # shared root target/, so the cache key must be the repo root. Shared
      # `xtensa-fw` entry with firmware-xtensa; see the lint job's cache step.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: xtensa-fw
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt, pinned to match the firmware-size and firmware-xtensa jobs
      # (see firmware-xtensa for the cost of the source build it replaces).
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install espflash (prebuilt)
        run: cargo binstall --no-confirm --locked espflash@3.3.0

      # Builds the crate and checks the image against its 3 MB app partition.
      - name: Check esp32v3 image size
        run: cd lp2025 && just fw-esp32v3-size-check

      # The image just built must describe itself correctly: extract the
      # embedded manifest core and diff against the checked-in expectation.
      - name: Check esp32v3 embedded manifest
        run: cd lp2025 && just fw-manifest-check-esp32v3

      # The lint gate for this crate. Nothing else in CI lints it —
      # `clippy-host` excludes it, because it cross-compiles for Xtensa under
      # a different toolchain.
      - name: Clippy esp32v3 firmware
        run: cd lp2025 && just clippy-fw-esp32v3

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Xtensa HOST path: `lpvm-native`'s `rt_emu` compiling shaders for Xtensa
  # and executing them on `lp-xt-emu`, linked against a cross-compiled builtins
  # image. Nothing else in CI runs Xtensa *code* — `firmware-xtensa` above only
  # compiles a device image.
  #
  # This job exists because those tests were inert. They skip when the Xtensa
  # builtins image is absent (it is a gitignored cross-target artifact, and that
  # skip is deliberate — the workspace must build and test without the esp
  # toolchain), so before this job every one of them silently no-opped in CI
  # while looking green.
  #
  # Self-contained rather than passing the image between jobs: the toolchain and
  # the consumers sit in one place, `validate-x64` is untouched, and there is no
  # cross-gate coupling to get wrong. (`firmware-xtensa` is gated on `firmware`
  # and this on `shader`; wiring an artifact between them would leave a
  # shader-only PR running the suite against an EMPTY image and reporting green
  # — exactly the failure this job is meant to end.)
  #
  # Scope note: this gates BOTH halves of the Xtensa host story — the
  # engine/emitter tests (`just test-xt-host`, differential against rv32) and
  # the xtn.q32 / xtlpn.q32 filetest corpus targets. The corpus went green on
  # 2026-07-31 (851/851 files on each target), which is what the earlier
  # revision of this note was waiting for; gating it before that would only have
  # trained people to ignore the job.
  validate-xtensa:
    name: Validate Xtensa (host)
    runs-on: ubuntu-24.04
    # p95 6.6 min, max 7.6.
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.shader == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      # Mirrors validate-x64. regalloc2 resolves from git today, so this is not
      # strictly required — it is what makes the commented-out `[patch]` in the
      # root Cargo.toml work if anyone uncomments it, and a job that omitted it
      # would be the one that mysteriously broke.
      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Two toolchains, both needed: the pinned nightly builds the host test
      # binaries, and the Espressif fork cross-compiles the builtins image.
      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      # Same pin as firmware-xtensa; keep the two in sync. `default: false`
      # leaves the host nightly as the default toolchain — the image build
      # selects the esp channel itself through lp-xt/fixtures/rust-toolchain.toml.
      - name: Install Xtensa Rust toolchain
        uses: ./lp2025/.github/actions/xtensa-toolchain
        with:
          version: 1.95.0.0
          buildtargets: esp32s3
          default: false

      # Compile cache, mirroring every other compile-heavy job here (see
      # validate-x64 for the design: cache-targets is off repo-wide, sccache IS
      # the compile reuse). The wrapper also covers the esp cross-build below —
      # sccache + Espressif toolchain + build-std is already proven in this
      # workflow by firmware-size.
      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # `xtensa-host` entry of its own: this job installs nightly AND the esp
      # fork, so its env hash never matches the firmware pair's anyway; see
      # the lint job's cache step for the shared-key rationale.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: xtensa-host
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # The base image the host engine links compiled shader code against.
      - name: Build the Xtensa builtins image
        run: cd lp2025 && scripts/build-builtins-xt.sh

      # BOTH images are needed, which is not obvious. `xt_engine`'s tests are
      # differential: they compile the same LPIR for rv32 as the oracle and
      # compare, so an absent RV32 image fails them just as hard as an absent
      # Xtensa one. (Recipe pulls in `install-rv32-target` itself.)
      #
      # This is invisible locally — the rv32 image is always already built
      # there — so CI is the only place the omission can surface.
      - name: Build the RV32 builtins image (the differential oracle)
        run: cd lp2025 && just build-rv32-builtins

      # The bare-metal fixture corpus: the `corpus/` guests `lp-xt-elf`'s tests
      # run in the user-mode emulator, and the `mach/` images that run
      # xtensa-lx-rt's REAL vector table on the privileged hart (M1 P4). Same
      # gitignored-artifact story as the builtins image above, same
      # skip-and-report-success failure if it is absent.
      - name: Build the Xtensa fixture corpus (user-mode + mach)
        run: cd lp2025 && lp-xt/fixtures/build.sh

      # Guard the whole point of this job. Without the Xtensa image the tests
      # SKIP and still report success, which is what was happening before this
      # job existed; without the RV32 image they fail three minutes into a
      # compile with a message that reads like a codegen bug. Fail here, fast
      # and unambiguously, rather than either.
      #
      # The seven `mach_*` ELFs are here for exactly the same reason and it is
      # worth saying it twice: `lp-xt/fixtures/elf/` is gitignored, and
      # `lp-emu/lp-xt-emu/tests/mach_fixtures.rs` skips every test whose ELF is
      # missing. A phase's worth of evidence about the privileged hart would
      # then report green having executed nothing. Two guards, because one has
      # already failed here historically: this step, and
      # LP_XT_MACH_FIXTURES_REQUIRED below, which turns the skip into a failure
      # inside the test binary itself.
      - name: Assert both builtins images and the seven mach fixtures are present
        run: |
          cd lp2025
          xt=lp-xt/fixtures/elf/lps-builtins-xt-app.elf
          rv=target/riscv32imac-unknown-none-elf/release/lps-builtins-emu-app
          rc=0
          for img in "$xt" "$rv"; do
            if [ -s "$img" ]; then
              echo "ok: $img ($(wc -c < "$img") bytes)"
            else
              echo "::error::$img missing or empty — Xtensa tests would skip or fail spuriously"
              rc=1
            fi
          done
          for name in mach_backtrace mach_interrupts mach_loopnez mach_s32c1i \
                      mach_ctxswitch mach_dbreak mach_lserr; do
            elf="lp-xt/fixtures/elf/$name.elf"
            if [ -s "$elf" ]; then
              echo "ok: $elf ($(wc -c < "$elf") bytes)"
            else
              echo "::error::$elf missing or empty — the mach hart tests would SKIP and report success"
              rc=1
            fi
          done
          exit $rc

      # The privileged hart's evidence. Named explicitly rather than left to
      # `cargo test`, because this is the only job in the workflow with an esp
      # toolchain and therefore the only one where these tests do anything at
      # all: `validate-x64` runs the same binary against an empty `elf/` and
      # every test in it skips.
      #
      # LP_XT_MACH_FIXTURES_REQUIRED=1 is the in-binary half of the guard
      # above: with it set, a missing ELF panics by name instead of printing
      # SKIP and passing.
      - name: Xtensa mach fixtures (the privileged hart)
        env:
          LP_XT_MACH_FIXTURES_REQUIRED: "1"
        run: |
          cd lp2025
          set -o pipefail
          just test-xt-mach 2>&1 | sed -E 's/\x1b\[[0-9;]*[mGKHF]//g' | tee /tmp/xt-mach.log

      # Run and then CHECK THAT IT RAN, as the step below does for the engine
      # suite. Twelve tests: seven fixtures' assertions plus the goldens, the
      # presence guard, the golden/FIXTURES drift check and the runner's own
      # determinism check. A floor rather than an equality, so adding a test
      # never requires touching this; it trips only when tests DISAPPEAR.
      - name: Assert the mach fixtures actually ran
        run: |
          log=/tmp/xt-mach.log
          rc=0
          for canary in mach_backtrace_25_deep mach_interrupt_level1_cause4 \
                        mach_interrupt_level3_rfi mach_loopnez_runs_every_iteration \
                        mach_s32c1i_success_and_failure mach_esp_rtos_context_switch \
                        mach_dbreak_stack_guard mach_load_store_error_excvaddr \
                        mach_goldens mach_fixtures_present; do
            if ! grep -qF "test $canary ... ok" "$log"; then
              echo "::error::'$canary' did not run or did not pass — this job proved nothing about the privileged hart"
              rc=1
            fi
          done
          if grep -qF "SKIP " "$log"; then
            echo "::error::a mach test printed SKIP; LP_XT_MACH_FIXTURES_REQUIRED should have made that a failure"
            rc=1
          fi
          total=$(awk '/^test result: ok\./ {s+=$4} END {print s+0}' "$log")
          echo "mach tests passed: $total"
          if [ "$total" -lt 12 ]; then
            echo "::error::only $total mach tests ran (floor 12) — tests disappeared rather than were added"
            rc=1
          fi
          exit $rc

      # Run and then CHECK THAT IT RAN. A file-level `#![cfg(feature = "…")]`
      # turns a wrong feature set into **zero tests and no compile error**, and
      # `just test-xt-host` names its test targets explicitly, so a new file that
      # nobody adds there is silently never run. Both have already happened in
      # this repo (the `stories` feature on test-studio-host carries the same
      # warning), and both look identical to success.
      #
      # Two assertions, each self-maintaining in the safe direction:
      #   - no suite may report `running 0 tests` — the signature of a file that
      #     compiled to nothing. Doc-test sections are excluded: having no
      #     doctests is legitimate.
      #   - the canary must have run by name. `sin_matches_rv32_through_the_…`
      #     is the test that compiles a shader for Xtensa, links it against the
      #     cross-compiled builtins image, executes it on the emulator, and
      #     diffs against rv32. If that one did not run, this job proved nothing
      #     about Xtensa no matter how many others passed.
      #   - plus a floor on the total, which only trips when tests DISAPPEAR;
      #     adding tests never requires touching it.
      # ANSI escapes are stripped before the log is written. The job sets
      # CARGO_TERM_COLOR=always and cargo colors its status headers, so the
      # doctest header arrives as `\e[1m\e[92m   Doc-tests lpvm_native` and no
      # `^ *Doc-tests` pattern can match it. Every assertion below anchors at
      # start-of-line, so stripping once here is what makes them all mean what
      # they read as — not just the one that has already misfired.
      - name: Xtensa host tests
        run: |
          cd lp2025
          set -o pipefail
          just test-xt-host 2>&1 | sed -E 's/\x1b\[[0-9;]*[mGKHF]//g' | tee /tmp/xt-tests.log

      - name: Assert the tests actually ran
        run: |
          log=/tmp/xt-tests.log
          canary=sin_matches_rv32_through_the_builtins_image
          rc=0

          # "running 0 tests" from a test binary means its file compiled to
          # nothing. Doc-test sections legitimately have none, so ignore
          # anything after a Doc-tests header.
          if awk '/^ *Doc-tests/ {doc=1} /^running 0 tests/ && !doc {found=1} END {exit !found}' "$log"; then
            echo "::error::a test binary reported 'running 0 tests' — a file-level #![cfg] almost certainly emptied it"
            rc=1
          fi

          if ! grep -qF "test $canary ... ok" "$log"; then
            echo "::error::canary '$canary' did not run — this job proved nothing about Xtensa"
            rc=1
          fi

          total=$(awk '/^test result: ok\./ {s+=$4} END {print s+0}' "$log")
          echo "total tests passed: $total"
          if [ "$total" -lt 40 ]; then
            echo "::error::only $total tests ran (floor 40) — tests disappeared rather than were added"
            rc=1
          fi

          exit $rc

      # The filetest corpus, compiled and executed for Xtensa. This is the other
      # half of the job: `test-xt-host` covers the engine and emitter on a
      # handful of hand-written cases, this runs the full 851-file GLSL corpus
      # through the Xtensa backend. Both targets were green at 851/851 when they
      # were added here (2026-07-31).
      #
      # Two invocations, not one: `scripts/filetests.sh` keeps a single
      # `--target` pair, so a second `-t` silently overwrites the first and you
      # would test one target while believing you tested two. `just
      # test-glsl-filetests` invokes the script repeatedly for the same reason.
      # Separate steps rather than one step with two lines so a failure names
      # its target in the job UI.
      #
      # Ordering matters: both steps must come after "Build the Xtensa builtins
      # image" and its assertion above. Without the image the runner DROPS the
      # Xtensa targets with a note on stderr — and because each invocation here
      # requests exactly one target, dropping it empties the target set and the
      # run bails non-zero rather than reporting a green no-op. (The script also
      # rebuilds the image itself when an xt target is selected; it is already
      # warm from the earlier step.) That belt-and-braces is deliberate: silent
      # skip reported as success is the exact failure mode this job exists to
      # end.
      - name: Xtensa filetest corpus (xtn.q32)
        run: cd lp2025 && scripts/filetests.sh -t xtn.q32 --summary

      - name: Xtensa filetest corpus (xtlpn.q32)
        run: cd lp2025 && scripts/filetests.sh -t xtlpn.q32 --summary

  # The esp32c6 app image must fit a 3 MB partition. It has overrun twice, and
  # both times the signal was a red `Build and deploy Studio` run *after* the merge,
  # because no pre-merge job built the device firmware. This job builds it and
  # fails under 64 KB of headroom; it prints the number either way, so the size
  # is visible on every PR that can move it.
  # See docs/adr/2026-07-28-esp32c6-flash-budget.md.
  firmware-size:
    name: Firmware size (esp32c6)
    runs-on: ubuntu-24.04
    # p95 2.9 min, max 4.4.
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.firmware == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      # The firmware profile ignores these two; they are here so this job's
      # rust-cache env hash matches the rest of the `x64-nightly` family
      # (see the lint job's cache step).
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for espflash)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      # Toolchain is pinned in lp2025/lp-fw/fw-esp32c6/rust-toolchain.toml; keep
      # this in sync. rust-src is required: the firmware builds core/alloc from
      # source (build-std) to apply optimize_for_size.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install RISC-V target
        run: rustup target add ${{ env.RISC_V_TARGET }}

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Shared `x64-nightly` entry; see the lint job's cache step.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: x64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt, pinned to match the deploy workflows, which package the
      # image this job measures (see firmware-xtensa for the cost of the
      # source build it replaces).
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install espflash (prebuilt)
        run: cargo binstall --no-confirm --locked espflash@3.3.0

      - name: Check esp32c6 image size
        run: cd lp2025 && just fw-esp32c6-size-check

      # The image just built must describe itself correctly: extract the
      # embedded manifest core and diff against the checked-in expectation.
      - name: Check esp32c6 embedded manifest
        run: cd lp2025 && just fw-manifest-check-esp32c6

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The ESP32-C6 emulator's own boot-test + replay suite (`just
  # test-emu-c6-boot`, the emulator half of `just test-emu-c6`; L3 of the
  # 2026-09-06 esp-emulator plan, DD27). This builds TWO reference
  # `fw-esp32c6` images at a pinned historical commit
  # (`scripts/emu/build-reference-image.sh`: `git worktree add --detach` at
  # d6cfaa205, `git cherry-pick -n` of e8d64eeff on top) and boots them against
  # the `#[ignore]`d boot tests in `lp-emu-esp32c6` under `LP_EMU_BUILD_FW=1`,
  # then runs the `lp-emu-validate` replays. lp-cli's two emulator-backed
  # tests and the chip heap ratchet ran here too until 2026-09-08; they moved
  # to `heap-budget-chips` below (see that job for the timings), which is
  # what brought this job back under its budget. Before this job, that whole
  # suite was inert in CI — the boot tests
  # are `#[ignore]`d specifically so a bare `cargo test --workspace` (which
  # `validate-x64` runs) never starts a firmware build, so nothing exercised
  # them.
  #
  # fetch-depth: 0, unlike every other job here: the two commits above are
  # ordinary history, not refs, and the script's `git worktree add` /
  # `git cherry-pick` both need them present locally — a shallow checkout
  # would fail with "unknown revision".
  #
  # Same toolchain family as `firmware-size` (RISC-V, not Xtensa —
  # fw-esp32c6 is a RISC-V core, unlike the S3/v3 Xtensa firmware): the
  # pinned nightly with rust-src (build-std) plus the riscv32imac target.
  #
  # espflash IS needed here, which it was not until M7, and not for a port:
  # `save-image --merge` is what builds the merged flash image the ROM-up
  # boot reads, and the second-stage bootloader in that image comes out of
  # espflash's own bundled resources. It is installed **prebuilt**
  # (`cargo binstall`), as every espflash-using job now is — this was the
  # first to switch, being the job closest to its ceiling, and a source
  # build of espflash is minutes it did not have.
  #
  # Path-gated on `emu_c6` (narrower than `firmware`) rather than the full
  # device-image dependency closure — see that filter's comment in
  # detect-changes for why. Not added to any required-check list here; see
  # the PR description for that call.
  emu-c6:
    name: Emulator C6 (x64)
    runs-on: ubuntu-24.04
    # Measured 69s wall-clock on an M2 Max, warm cargo cache (2026-09-06, see
    # the PR that added this job for the CI-measured number); 9m34s on this
    # runner (2026-09-08, main at #567), which is three cold reference-image
    # builds and the suite. L4's `--verify` step adds a fourth build, so the
    # ceiling moves with it rather than the job living at 90 % of its budget.
    #
    # Raised 20 -> 35 (2026-09-08): #599's `--verify` build and the
    # heap-budget-check-chips step (a second, cross-target firmware build
    # plus four emulator profile captures) pushed the job past 20 minutes on
    # every run since — main's own post-merge run for #599 hit 20m21s, #597's
    # runs hit 20m17s/20m15s, all cut mid heap-budget-check-chips with no
    # step ever failing. Observed elapsed-to-that-step alone ranged
    # 15m26s-18m23s across cache states, and the step itself was still
    # running (not done) after 4m47s in the longest sample, so 20 min never
    # had margin. 35 covers a fully cold run (cold reference-image builds +
    # cold cross-target chip build + the profile captures) with headroom;
    # see the PR for the timing table this is based on.
    #
    # Split (2026-09-08): the ratchet (478 s) and the lp-cli tests (367 s of
    # tree build + 7 s of test) moved to `heap-budget-chips`, so this job is
    # expected back near 12 min — the `--verify` builds (91 s) and the
    # emulator's own suite. 35 stays, deliberately: it is headroom now, not a
    # ceiling, and a job that starts timing out wants its p95 re-measured.
    timeout-minutes: 35
    needs: detect-changes
    if: needs.detect-changes.outputs.emu_c6 == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025
          # build-reference-image.sh does `git worktree add --detach` at a
          # pinned historical commit and a `git cherry-pick -n` on top of it —
          # both need history a shallow (depth-1) checkout does not have.
          fetch-depth: 0

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      # rust-src is required: fw-esp32c6 builds core/alloc from source
      # (build-std) for its release-esp32 profile, same as firmware-size.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install RISC-V target
        run: rustup target add ${{ env.RISC_V_TARGET }}

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Shared `x64-nightly` rust-cache entry; save-if main-only (see the lint
      # job's cache step for both). The reference-image builds happen
      # inside a detached worktree under lp2025/target/emu-ref/, which is
      # still under this workspace root, so sccache (content-addressed) still
      # covers them even though target/ itself is not cached.
      #
      # cache-on-failure (2026-09-08): this job's own post-cache save step
      # was silently skipped on every run this job overran on, because
      # rust-cache's default post-if is `success()` — a step failure or a
      # timeout cancellation both make that false, so a cancelled run (see
      # timeout-minutes above) never published this job's cache, and main
      # ran cold on every subsequent run. cache-on-failure widens the
      # post-if to `success() || cache-on-failure`, so a future overrun
      # still saves what got built before the cutoff.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: x64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt, not `cargo install`: the same call the two deploy workflows
      # make, pinned to the same 3.3.0. The version is load-bearing rather
      # than incidental — espflash bundles the ESP-IDF second-stage
      # bootloader, `build-merged-image.sh` refuses any other version, and
      # the boot-log gate diffs that bootloader's output against a silicon
      # capture of the same binary. A different espflash is a different
      # program in the image.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install espflash (prebuilt — the merged image's bootloader)
        run: cargo binstall --no-confirm --locked espflash@3.3.0

      # The reference image is reproducible (L4): the same sha256 on this
      # runner and on a Mac, for the same pinned firmware commit. This step is
      # what keeps that true — it builds the memfs image twice, in two cold
      # worktrees at different paths, and fails if the bytes differ.
      #
      # One image, not all three: the claim is about the recipe, and the other
      # two go through the same code path. It runs BEFORE the suite so its
      # first build is the one the tests then use (the script publishes to the
      # path they resolve), which is why it does not simply double the job.
      - name: Reference image reproducibility (--verify)
        run: cd lp2025 && ./scripts/emu/build-reference-image.sh --verify esp32c6,server,radio,spike_uart0_link,memory_fs

      - name: Emulator C6 boot tests + replays
        run: cd lp2025 && just test-emu-c6-boot

      # The tab module: a release build of the machine for wasm32-wasip1,
      # whose script FAILS if any `emu_*` export is missing from the linked
      # module. That is the gate — the export list in
      # scripts/emu/build-tab-wasm.sh and the ABI in
      # lp-emu-esp32c6/src/tab_abi/ drifting apart is the failure it exists
      # to catch, and it is invisible to every native test.
      #
      # Cost, MEASURED on this runner (2026-09-11, run 34555276339): the
      # target install plus the build plus the export gate is **45 s**, cold
      # sccache. 29 s of that is the same build on an M2 Max, so the runner is
      # barely slower here — the wasip1 tree is small and sccache is
      # content-addressed and target-triple aware. The 35-minute budget above
      # is headroom rather than a ceiling (see its own comment), which is why
      # this rides here rather than becoming a fourth job for one
      # `cargo build`.
      #
      # `just emu-c6-wasm` installs the target itself if it is missing; it is
      # named on its own step anyway, so the toolchain this job needs is
      # readable in one place, beside the RISC-V target above.
      - name: Install wasip1 target (the tab module)
        run: rustup target add wasm32-wasip1

      - name: Tab module (wasm32-wasip1) + export gate
        run: cd lp2025 && just emu-c6-wasm

      # The tab host's hermetic smoke (C6-in-tab D18): the module just built,
      # under the PAGE'S OWN WASI shim (it imports
      # `public/lpa-link/emulator_wasi.js`, it does not copy it), driving the
      # real mask ROM to its `ESP-ROM:esp32c6` banner and its `waiting for
      # download` line, plus the flash word's blank → loaded → blank sequence
      # and a control reply carrying `cyc=`.
      #
      # Since P5b it also proves the JIT SEAM, which is what makes it the gate
      # that a module and its JS host have drifted apart: the module imports
      # `emu_host` (the wasm build translates by default, M7 P7) and does not
      # instantiate without a host, `attach`'s table round trip is checked in
      # node's own engine, and a `boot=direct` board — the mask ROM's committed
      # ELF, because `boot=rom-up` installs no translated core — hands the host
      # real modules and produces the interpreter's transcript at the
      # interpreter's cycle.
      #
      # No browser, no firmware build, no network — which is the whole reason
      # it can be a CI step at all. The tab-backed conformance suite and
      # `just walk-no-board --tab` want Chrome and stay local recipes (PD9).
      #
      # Cost, MEASURED (desk, same module the step above built): **0.65 s** for
      # all twenty-nine claims, of which the translated boot is ~0.2 s. The node
      # setup beside it is the only part worth a second.
      - name: Set up node (the tab smoke)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tab host smoke (node + the page's WASI shim)
        run: cd lp2025 && node scripts/emu/tab-smoke.mjs

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # The CLASSIC ESP32's machine, and M3's own gate.
  #
  # **Non-required and path-gated** (Q8, ruling R10 of the Xtensa emulator
  # plan). It is here rather than in M5 for one reason: M3's gate is what this
  # job runs, so the milestone's claim is protected by the thing that checks
  # it, in the same PR that makes it.
  #
  # What it costs, and why each part is here:
  #
  #   * a cross-target **Xtensa** firmware build (`just build-fw-esp32v3`),
  #     because the whole gate is about the SHIPPED image and not a fixture;
  #   * `espflash save-image --chip esp32 --merge` on it, which bundles the
  #     exact ESP-IDF `v5.1-beta1-378-gea5e0ff298` second-stage bootloader the
  #     desk board runs — the ROM-up boot log is diffed against a silicon
  #     capture of that binary's output, so the espflash version is
  #     load-bearing and pinned to 3.3.0 like the C6 job's;
  #   * the suite with the `#[ignore]`d half included: both boot paths to the
  #     idle heartbeat under `--strict-bus`, the boot-log comparison, the
  #     direct-vs-ROM-up app-entry byte equality, determinism, the snapshot
  #     identity;
  #   * the reference image **twice**, for `--verify`.
  #
  # `fetch-depth: 0` for the same reason as emu-c6: the reference build does
  # `git worktree add --detach` at a pinned commit, which a depth-1 checkout
  # cannot serve.
  emu-esp32v3:
    name: Emulator ESP32v3 (x64)
    runs-on: ubuntu-24.04
    # No p95 yet — this job is new in M3 P8. The budget is the C6 job's 35
    # with the same reasoning: a fully cold run is two reference-image builds
    # plus the shipped image plus the emulator suite, and a job living at
    # 90 % of its budget is a job that starts failing on cache misses. The
    # first green run's wall-clock goes in this comment.
    timeout-minutes: 35
    needs: detect-changes
    if: needs.detect-changes.outputs.emu_esp32v3 == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport/espflash)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025
          # build-reference-image.sh does `git worktree add --detach` at a
          # pinned commit; a shallow checkout has no history to detach to.
          fetch-depth: 0

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # The emulator itself is a HOST binary on the repo's own nightly; the
      # firmware it boots is Xtensa. Both toolchains are installed, in that
      # order, and the Xtensa one is NOT made default — `lp-fw/fw-esp32v3`
      # selects it through its own rust-toolchain.toml, and making it default
      # would build the host crates on the fork as well.
      - name: Install Rust toolchain (host)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      # Same version and buildtargets as the `firmware-esp32v3` job; keep them
      # in sync. Pinned rather than floating so an espup release cannot turn a
      # green PR red on its own.
      - name: Install Xtensa Rust toolchain
        uses: ./lp2025/.github/actions/xtensa-toolchain
        with:
          version: 1.95.0.0
          buildtargets: esp32
          default: false

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Its own shared-key: this job builds both a host test tree on the
      # repo nightly AND an Xtensa firmware on the fork, so it matches
      # neither `x64-nightly` nor `xtensa-fw` cleanly and would evict from
      # whichever it borrowed. save-if main-only, cache-on-failure for the
      # reason emu-c6's step gives: a cancelled run must still publish what
      # it built.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: emu-esp32v3
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      # Prebuilt and pinned, exactly as emu-c6 does it. espflash bundles the
      # second-stage bootloader whose log this job diffs against a silicon
      # capture: a different espflash is a different program in the image.
      - name: Install espflash (prebuilt — the merged image's bootloader)
        run: cargo binstall --no-confirm --locked espflash@3.3.0

      # Since M5 P6 the recipe also runs the two host test commands: `cargo
      # test -p lp-emu-validate` (which owns `tests/v3_replays.rs`, the four
      # committed transcript pairs) and `cargo test -p lp-cli --test
      # validate_registry_parity`. They are IN THE RECIPE rather than extra
      # steps here, so that the gate a human runs and the gate CI runs stay
      # one thing.
      - name: Emulator ESP32v3 gate (both boot paths, the replays, the reference image)
        run: cd lp2025 && just test-emu-esp32v3-gate

      # The classic's half of the heap-budget record's chip section (M5 P5).
      # It lives here rather than in `Heap budget (esp32c6 chip)` because it
      # needs the Xtensa toolchain this job already installs — a cold espup
      # install is ~8 minutes, and the other job is path-gated on `emu_c6`,
      # which does not fire for `lp-fw/fw-esp32v3/**` at all.
      #
      # Cost, measured on an M2 Max with a warm cargo cache: 24 s all in — a
      # 22 s `fw-esp32v3` rebuild (the recipe touches `src/main.rs`, because
      # this crate's cfg-dependent codegen does not always retrigger on a
      # feature flip) plus a 0.2 s boot that ends on its own `[JIT] used=`
      # line at 119 ms of emulated time. The C6's arm in the other job is ~8
      # minutes (its comment's own figure: a release `lp-cli`, a firmware
      # build and the profile captures), so the classic's arm is well under
      # it — but the two are not in the same job, so the comparison is about
      # size and not about a shared budget. The release `lp-emu-esp32v3`
      # binary the ratchet runs is the one expense this job does not already
      # pay; it is a much smaller dependency tree than `lp-cli`'s.
      - name: Heap budget ratchet — the classic's own ledger
        run: cd lp2025 && just heap-budget-check-chips-v3

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The heap-budget record's chip half (`just heap-budget-check-chips`,
  # docs/heap-budget-gate.md "The second source") and lp-cli's two
  # emulator-backed tests (`just test-emu-c6-cli`). Both were steps of
  # `emu-c6` until 2026-09-08. That job had been cut at its 20-minute budget
  # on every run since #599 (PR #613 raised it to 35 as a stopgap), and its
  # step timings on main run 34308562027 said why: 478 s for the ratchet and
  # 367 s inside the suite for `cargo test -p lp-cli` — a second full
  # test-tree build, because `-p lp-cli` unifies features differently from
  # `-p lp-emu-esp32c6`. The ratchet needs that same lp-cli build (release,
  # `heap-budget-check.sh` line ~206) plus a cross-target firmware build the
  # script does itself under `LP_EMU_BUILD_FW=1`, so the two ride together
  # here and the emulator job keeps only the emulator's own suite.
  #
  # Cheaper setup than emu-c6 on purpose: a depth-1 checkout (nothing here
  # builds a reference image, so no historical commits are needed) and no
  # espflash (nothing here builds a merged flash image — the tests boot a
  # plain ELF). Same toolchain family as emu-c6 and firmware-size: the
  # pinned nightly with rust-src (build-std) plus the riscv32imac target.
  #
  # `heap-budget-check` in the required `Validate (x64)` job prints a named
  # SKIP for the chip half; here `LP_EMU_BUILD_FW=1` is set by the recipe, so
  # a skip is a failure and cannot happen quietly. Path-gated on `emu_c6`
  # like the emulator job.
  heap-budget-chips:
    name: Heap budget (esp32c6 chip)
    runs-on: ubuntu-24.04
    # Expected ~15 min: ~1 min setup, ~6 min lp-cli test tree (sccache floor),
    # ~8 min ratchet (release lp-cli + firmware + the profile captures). 30 is
    # a fully cold run with headroom; re-measure before tightening.
    timeout-minutes: 30
    needs: detect-changes
    if: needs.detect-changes.outputs.emu_c6 == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      # rust-src is required: fw-esp32c6 builds core/alloc from source
      # (build-std) for its release-esp32 profile, same as firmware-size.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install RISC-V target
        run: rustup target add ${{ env.RISC_V_TARGET }}

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Shared `x64-nightly` rust-cache entry; save-if main-only (see the lint
      # job's cache step for both). cache-on-failure for the same reason as
      # emu-c6: an overrun must still publish what it built.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          cache-targets: false
          cache-bin: false
          shared-key: x64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Emulator-backed lp-cli tests
        run: cd lp2025 && just test-emu-c6-cli

      # The shipped image booted whole, read from the allocator figures its
      # own first heartbeat reports. It lives in this job and not in the
      # required `Validate (x64)` job because it needs a cross-target firmware
      # build; `heap-budget-check` in the required job prints a named SKIP for
      # the same reason, and a skip here would be a failure.
      # `-c6` and not the bare `heap-budget-check-chips` since M5 P5: that one
      # now does BOTH chips, and this job has no Xtensa toolchain. The
      # classic's arm rides `Emulator ESP32v3 (x64)`, which does.
      - name: Heap budget ratchet — the C6's own ledger
        run: cd lp2025 && just heap-budget-check-chips-c6

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The main validate job runs on x64. It was ARM from 2026-06 (x64 was
  # disabled over x86_64 host-JIT failures in `lpvm-cranelift`; that JIT was
  # removed 2026-07-11), and a 2026-07 side-by-side comparison run showed x64
  # green at equivalent wall-clock. Consolidated on x64 2026-07-27: every
  # browser-dependent job is x64-only anyway (Google Chrome ships no
  # linux-arm64 build). validate-gfx stays on ARM deliberately — it needs no
  # browser and keeps a second architecture compiling the tree.
  #
  # The old standalone `just check build-ci test` chain is gone: cargo test
  # builds everything a plain `cargo build` did, so build-ci only ever
  # duplicated work (~12 min/run). The true prerequisites — the RV32 builtins
  # ELF and the emu guest app that host tests embed/spawn — are built by
  # `ci-prereqs`. Test recipes are composed from the path gates and run
  # SEQUENTIALLY: the old [parallel] pairs thrashed the 4-core runner (two
  # concurrent ~18-min cargo builds); cargo parallelizes fine within one
  # invocation.
  validate-x64:
    name: Validate (x64)
    runs-on: ubuntu-24.04
    # p95 17.8 min, max 23.5.
    timeout-minutes: 45
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      - name: Install RISC-V target
        run: rustup target add ${{ env.RISC_V_TARGET }}

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Shared `x64-nightly` entry; save-if main-only (see the lint job's
      # cache step for both).
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          # target/ itself is NOT cached: sccache re-materializes crate
          # compiles content-addressed (91% hit rate measured on this PR's
          # warm run), and the 2-3GB-per-job target payloads pushed the repo
          # past its 10GB Actions-cache budget, which LRU-evicts into
          # thrash. Build scripts re-run each time — small next to the
          # eviction cost. The registry stays cached; ~/.cargo/bin does not
          # (cache-bin false): every tool comes prebuilt via cargo-binstall
          # in seconds, so a shared entry never depends on which job saved it.
          cache-targets: false
          cache-bin: false
          shared-key: x64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # test-rust-core always runs; the studio-web host test only when studio
      # paths changed (it forces a differently-feature-unified rebuild of the
      # Dioxus tree); filetests only when shader paths changed. Pushes to
      # main force every gate true.
      #
      # schema-check and the heap ratchet (next step) run against the
      # `target/debug/lp-cli` the workspace `cargo test` just built, via the
      # `LP_CLI` override both honor. They used to `cargo run -p lp-cli`,
      # and a `-p lp-cli` dev build unifies features differently from the
      # workspace test build, so it rebuilt every dependency: a third full
      # tree build, 4m49s on main run 34308562027 (2026-09-08), for a
      # binary cargo had already produced for lp-cli's integration tests.
      # The assertion is deliberate — if a future change stops `cargo test`
      # from building the bin, this must fail loudly rather than fall back
      # to the slow path unnoticed.
      - name: Validate
        env:
          SHADER: ${{ needs.detect-changes.outputs.shader }}
          STUDIO: ${{ needs.detect-changes.outputs.studio }}
        run: |
          cd lp2025
          recipes="test-rust-core"
          [ "$STUDIO" = "true" ] && recipes="$recipes test-studio-host"
          [ "$SHADER" = "true" ] && recipes="$recipes test-filetests"
          just ci-prereqs
          just $recipes
          test -x target/debug/lp-cli || { echo "::error::cargo test did not leave target/debug/lp-cli — the LP_CLI fast path needs it"; exit 1; }
          echo "LP_CLI=$PWD/target/debug/lp-cli" >> "$GITHUB_ENV"
          LP_CLI="$PWD/target/debug/lp-cli" just schema-check

      # Heap-budget ratchet: emulator window deltas vs the checked-in
      # measured record. Deterministic, 0% margin; re-baseline explicitly
      # with `just heap-budget-baseline`. See docs/heap-budget-gate.md.
      # Runs after the tests: fw-emu reuses warm deps and lp-cli is the
      # test-built binary (LP_CLI, exported by the step above).
      - name: Heap budget ratchet
        run: cd lp2025 && just heap-budget-check

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The wgpu-tree workspace members (lp-gfx-wgpu, fw-browser, naga-wasm-poc)
  # are validated here, separate from validate-x64: building `-p lp-gfx-wgpu`
  # unifies cargo features differently from the default-members build, so
  # folding it into `just test` recompiled ~25 crates at the tail of every
  # Validate run.
  validate-gfx:
    name: Validate GFX (ARM)
    runs-on: ubuntu-24.04-arm
    # p95 3.2 min, max 3.6.
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.gfx == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # `arm64-nightly` entry of its own (a different host arch is a
      # different registry payload). save-if main-only: see the lint job's
      # cache step for the rationale.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          # target/ itself is NOT cached: sccache re-materializes crate
          # compiles content-addressed (91% hit rate measured on this PR's
          # warm run), and the 2-3GB-per-job target payloads pushed the repo
          # past its 10GB Actions-cache budget, which LRU-evicts into
          # thrash. Build scripts re-run each time — small next to the
          # eviction cost. The registry stays cached; ~/.cargo/bin does not
          # (cache-bin false): every tool comes prebuilt via cargo-binstall
          # in seconds, so a shared entry never depends on which job saved it.
          cache-targets: false
          cache-bin: false
          shared-key: arm64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Validate GFX
        run: cd lp2025 && just validate-gfx

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Real-browser wasm suites: lpa-fs-opfs (real OPFS ops, Web Locks, store
  # round-trip — the Safari-OPFS-corruption defect class) and fw-browser
  # (runtime protocol tests). Both run `cargo test --target
  # wasm32-unknown-unknown` through wasm-bindgen-test-runner against headless
  # Chrome. Runs on x64 because Google Chrome has no linux-arm64 build; GitHub
  # x64 images preinstall Chrome and a matching chromedriver, and host arch is
  # irrelevant for wasm tests.
  validate-browser:
    name: Validate Browser (x64)
    runs-on: ubuntu-24.04
    # p95 3.6 min, max 4.1.
    timeout-minutes: 20
    needs: detect-changes
    if: needs.detect-changes.outputs.browser == 'true'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Install system deps (libudev for serialport)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rustfmt, clippy, rust-src

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      # Shared `x64-nightly` entry; save-if main-only (see the lint job's
      # cache step for both).
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: lp2025 -> target
          # target/ itself is NOT cached: sccache re-materializes crate
          # compiles content-addressed (91% hit rate measured on this PR's
          # warm run), and the 2-3GB-per-job target payloads pushed the repo
          # past its 10GB Actions-cache budget, which LRU-evicts into
          # thrash. Build scripts re-run each time — small next to the
          # eviction cost. The registry stays cached; ~/.cargo/bin does not
          # (cache-bin false): every tool comes prebuilt via cargo-binstall
          # in seconds, so a shared entry never depends on which job saved it.
          cache-targets: false
          cache-bin: false
          shared-key: x64-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt, pinned to match the workspace wasm-bindgen dep; the just
      # recipes refuse to run with a missing runner and print this exact
      # version.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install wasm-bindgen-cli (prebuilt)
        run: command -v wasm-bindgen-test-runner >/dev/null || cargo binstall --no-confirm --locked wasm-bindgen-cli@0.2.114

      # The smoke check drives Chrome over a raw CDP WebSocket; pin node so
      # the global WebSocket client is guaranteed (same rationale as the
      # stories job).
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # End-to-end smoke: builds the fw-browser wasm bundle, loads smoke.html
      # in headless Chrome (preinstalled on the x64 image), and fails unless
      # the page reaches dataset.smoke === "ok" — the gate that catches page
      # rot and wasm-emission regressions the unit suites can't see. Runs
      # before the unit suites so a suite failure can't mask smoke signal.
      - name: fw-browser smoke check
        run: cd lp2025 && just fw-browser-smoke-check

      # All three run through `scripts/browser-test-harness.sh`, because
      # `wasm-bindgen-test-runner` ends a dead browser and a red suite with the
      # same `Error: some tests failed` (this job, PR #651: headless Firefox's
      # compositor failed, geckodriver was SIGKILLed, no test ever finished,
      # and a re-run of the same commit was green). A crash is reported as
      # `ENVIRONMENT FAILURE, not a test failure` and retried once, loudly; a
      # test failure is passed straight through. See
      # `docs/defects/2026-09-09-browser-crash-reported-as-test-failure.md`.
      - name: Browser wasm tests
        run: cd lp2025 && just lpa-fs-opfs-test fw-browser-test lpa-link-browser-test

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Story baselines are CI-canonical and live OUTSIDE this repo, in the
  # companion repo PhotomancerArt/lightplayer-stories: one snapshot commit per
  # captured lightplayer main commit (ref `sha-<sha>`), each parented on the
  # snapshot it was compared against so GitHub's compare view shows exactly
  # the changed stories. Merge-to-main IS acceptance — nothing here ever
  # commits or pushes to THIS repo, on any path.
  #
  #   - PR runs: baseline = nearest captured first-parent ancestor of the
  #     merge ref's first parent. Capture, compare (pixel tolerance, see
  #     studio-story-pngs.mjs), push a `pr-<n>` snapshot, post a sticky
  #     comment (counts, thumbnails, compare link). Visual changes PASS —
  #     the comment is the review surface, merging is acceptance.
  #   - main pushes: publish the new acceptance snapshot (`sha-<sha>`) and
  #     force-update `latest` (the root README's hero images point there).
  #     The delta-vs-parent step summary is the standing churn monitor.
  #   - Failure paths: capture crash/incomplete, no captured ancestor found,
  #     snapshot push failure. Fork PRs (no secrets): capture + compare still
  #     run; the fresh set uploads as `story-images-fresh` instead.
  #
  # Pushes to the stories repo use an app token for the org-wide
  # `lightplayer-infra` GitHub App (deploy keys are disabled by org policy).
  # Those pushes trigger no workflows here — no loop risk, no bot commits on
  # PR branches, no add/add PNG conflicts, structurally.
  #
  # This job is deliberately EXEMPT from the sccache/incremental/debug env the
  # other jobs set: it is the pinned canonical capture environment, and its
  # build behavior must not churn alongside CI-speed experiments.
  validate-stories:
    name: Validate story baselines
    # x64: Chrome ships no linux-arm64 build, and the canonical capture
    # environment is pinned to Chrome for Testing on x64 Linux.
    runs-on: ubuntu-24.04
    # p95 23.7 min, max 24.4 (the p95 IS the cold-cache case).
    timeout-minutes: 45
    needs: detect-changes
    if: needs.detect-changes.outputs.studio == 'true'
    # The repo defaults workflow tokens to read-only; this job posts the
    # sticky story-changes comment. It has NO write access to this repo's
    # contents — snapshot pushes go to the stories repo via an app token.
    permissions:
      contents: read
      pull-requests: write
    env:
      STORIES_REPO: PhotomancerArt/lightplayer-stories
      # Bumping the pinned browser (or oxipng) is a DELIBERATE baseline-refresh
      # PR: bump, push, and this job auto-commits the regenerated PNGs to the
      # branch. Do not bump casually.
      CHROME_FOR_TESTING_VERSION: "151.0.7922.47"
      OXIPNG_VERSION: "10.1.1"
      WASM_BINDGEN_VERSION: "0.2.114"
      DIOXUS_CLI_VERSION: "0.7.9"
    steps:
      - name: Install system deps (libudev for serialport build scripts)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout lp2025
        uses: actions/checkout@v4
        with:
          path: lp2025

      - name: Checkout lp-regalloc2
        uses: actions/checkout@v4
        with:
          repository: PhotomancerArt/lp-regalloc2
          path: lp-regalloc2

      # Toolchain is pinned in lp2025/rust-toolchain.toml; keep this in sync.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # The capture script drives Chrome over a raw CDP WebSocket; pin node so
      # the global WebSocket client is guaranteed (and rendering-adjacent
      # tooling stays deterministic).
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deploy-workflow-style cache (registry + git + bins + target) rather
      # than rust-cache: the cargo-installed tools live in ~/.cargo/bin and
      # must be cached with a key that includes their pinned versions.
      # Restore/save are split so saving happens only on main — same repo-wide
      # cache-eviction rationale as the lint job's cache step.
      - name: Restore cargo registry, tools, and build artifacts
        id: stories_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lp2025/target/
          key: ${{ runner.os }}-${{ runner.arch }}-stories-wb${{ env.WASM_BINDGEN_VERSION }}-dx${{ env.DIOXUS_CLI_VERSION }}-ox${{ env.OXIPNG_VERSION }}-cargo-${{ hashFiles('lp2025/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stories-wb${{ env.WASM_BINDGEN_VERSION }}-dx${{ env.DIOXUS_CLI_VERSION }}-ox${{ env.OXIPNG_VERSION }}-cargo-

      - name: Restore Chrome for Testing cache
        id: chrome_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/chrome
          key: chrome-for-testing-${{ env.CHROME_FOR_TESTING_VERSION }}

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt (cargo-binstall), not `cargo install`: on a cache miss the
      # source builds cost 627 s and 619 s on two of 2026-09-08's three main
      # runs — dioxus-cli alone is ~8 min — and the miss was routine because
      # this job's 1 GB entry was the first thing the over-budget cache
      # evicted. binstall verifies the pinned version and falls back to a
      # `--locked` source build only if a release asset ever disappears.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install pinned tools (wasm-bindgen, dioxus-cli, oxipng)
        shell: bash
        run: |
          wasm-bindgen --version 2>/dev/null | grep -qF "$WASM_BINDGEN_VERSION" \
            || cargo binstall --no-confirm --locked --force "wasm-bindgen-cli@$WASM_BINDGEN_VERSION"
          dx --version 2>/dev/null | grep -qF "$DIOXUS_CLI_VERSION" \
            || cargo binstall --no-confirm --locked --force "dioxus-cli@$DIOXUS_CLI_VERSION"
          oxipng --version 2>/dev/null | grep -qF "$OXIPNG_VERSION" \
            || cargo binstall --no-confirm --locked --force "oxipng@$OXIPNG_VERSION"

      # Ubuntu 23.10+ AppArmor blocks unprivileged user namespaces, which the
      # pinned Chrome-for-Testing binary needs for its sandbox (the runner's
      # preinstalled Chrome deb ships an AppArmor profile; a raw CfT download
      # does not). Relax the restriction instead of running --no-sandbox so
      # the capture browser stays as close to a real one as possible.
      - name: Allow Chrome sandbox (unprivileged userns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Chrome for Testing (pinned)
        shell: bash
        run: |
          npx -y @puppeteer/browsers install "chrome@$CHROME_FOR_TESTING_VERSION" --path "$HOME/chrome"
          CHROME_BIN="$(find "$HOME/chrome" -type f -name chrome -path '*chrome-linux64*' | head -1)"
          test -x "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      # Baseline lookup needs main's recent first-parent chain: the checkout
      # is depth-1, and the comparison root is HEAD's first parent — on a PR
      # merge-ref checkout that is the main tip the merge was built against
      # (so the comparison shows exactly what this PR changes relative to
      # current main); on a main push it is the previous main commit. The
      # depth must stay comfortably above the lookup's walk limit (50).
      - name: Fetch main history (baseline lookup)
        run: cd lp2025 && git fetch origin main --depth=60

      # Resolve which stories-repo snapshot to compare against, and fetch its
      # PNG set. Exit 2 (job failure) when no captured ancestor exists within
      # the walk — the remedy is rebasing on main.
      - name: Resolve baseline snapshot
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          cd lp2025
          # NOT `git rev-parse HEAD^1`: the depth-1 checkout grafts HEAD as
          # parentless in .git/shallow, so ^1 is "unknown revision" even
          # though the parent OBJECT arrived via the main fetch above. The
          # raw commit header keeps its parent lines regardless of grafts.
          root="$(git cat-file commit HEAD | awk '/^parent /{print $2; exit}')"
          test -n "$root"
          node lp-app/lpa-studio-web/scripts/story-baseline-lookup.mjs \
            --root "$root" --fetch "$RUNNER_TEMP/story-baseline" \
            > "$RUNNER_TEMP/baseline.json"
          cat "$RUNNER_TEMP/baseline.json"
          {
            echo "source_sha=$(jq -r .baselineSourceSha "$RUNNER_TEMP/baseline.json")"
            echo "stories_sha=$(jq -r .storiesCommitSha "$RUNNER_TEMP/baseline.json")"
            echo "ref=$(jq -r .ref "$RUNNER_TEMP/baseline.json")"
          } >> "$GITHUB_OUTPUT"

      # `shell: bash` (not the default) so pipefail keeps tee from masking the
      # check's exit code — piped-away failures have bitten this pipeline
      # before (docs/debt/story-capture-pipeline.md).
      #
      # continue-on-error: a failing check with a COMPLETE capture means
      # story drift, which is expected output here (the snapshot + comment
      # carry it; merging is acceptance), not a job failure. The "Fail on
      # crashed capture" step at the end restores the failure for incomplete
      # captures. NOTE: this makes `failure()` false for the rest of the job;
      # downstream steps condition on step outcomes instead.
      - name: Story check
        id: story_check
        continue-on-error: true
        shell: bash
        env:
          # The historical navigate-stall wedge (a long-lived capture browser
          # degrades after a few hundred wasm navigations; see the debt
          # entry) is handled structurally by the script's periodic browser
          # restart (STUDIO_STORY_BROWSER_RESTART_EVERY, default 120), so
          # full default concurrency is fine here. Generous CDP timeout and
          # attempts stay as cheap insurance — completed captures resume
          # from disk.
          STUDIO_STORY_CDP_TIMEOUT_MS: 120000
          STUDIO_STORY_CAPTURE_ATTEMPTS: 4
          # Compare against the fetched snapshot, not any in-repo directory.
          STUDIO_STORY_BASELINES_DIR: ${{ runner.temp }}/story-baseline/images
        run: cd lp2025 && just studio-story-check 2>&1 | tee "$RUNNER_TEMP/story-check.log"

      # Only a COMPLETE comparison may become a snapshot: a crashed partial
      # capture is missing stories, and snapshotting it would publish an
      # images/ set whose absences lie. The capture script writes
      # .check-complete only after comparing a full capture set.
      #
      # Tolerated-diff evidence retention (the Δ199 `opening-a-project`
      # lesson, docs/defects/2026-07-27-story-check-tolerance-ignores-
      # amplitude.md) now lives INSIDE the snapshot: fresh pixels of
      # tolerated files land in its `tolerated/` directory while `images/`
      # keeps the parent's bytes, so both variants stay diffable forever —
      # no separate artifact needed.
      - name: Detect completed comparison
        id: check_complete
        shell: bash
        run: |
          new_dir=lp2025/lp-app/lpa-studio-web/story-images/.new
          if [ -f "$new_dir/.check-complete" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      # Deploy keys are disabled by org policy; snapshot pushes authenticate
      # as the org-wide `lightplayer-infra` GitHub App (contents: write on all
      # org repos — same pattern as deploy-pages-channel.yml), scoped here to
      # just the stories repo. Fork PRs have no secrets and skip this — they
      # fall through to the story-images-fresh artifact below.
      - name: Mint stories-repo token
        id: stories_token
        if: >-
          steps.check_complete.outputs.complete == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LIGHTPLAYER_PAGES_APP_ID }}
          private-key: ${{ secrets.LIGHTPLAYER_PAGES_PRIVATE_KEY }}
          owner: PhotomancerArt
          repositories: lightplayer-stories

      # Runs on drift AND on no-change: an unchanged capture still publishes
      # (a `sha-*` ref marks the commit as captured — the lookup walk depends
      # on that; a `pr-*` snapshot records "captured, no changes"). Snapshots
      # are manifest-applied, so tolerated jitter never rewrites images/
      # bytes and the snapshot-to-snapshot compare view stays clean.
      - name: Push snapshot to the stories repo
        id: snapshot
        if: steps.stories_token.outcome == 'success'
        shell: bash
        env:
          STORIES_TOKEN: ${{ steps.stories_token.outputs.token }}
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
          BASELINE_STORIES_SHA: ${{ steps.baseline.outputs.stories_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd lp2025
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target_ref="pr-${PR_NUMBER}"
            source_sha="$HEAD_SHA"
            extra=()
          else
            target_ref="sha-${GITHUB_SHA}"
            source_sha="$GITHUB_SHA"
            extra=(--update-latest)
          fi
          node lp-app/lpa-studio-web/scripts/story-snapshot.mjs \
            --new-dir lp-app/lpa-studio-web/story-images/.new \
            --baseline-ref "$BASELINE_REF" \
            --baseline-commit "$BASELINE_STORIES_SHA" \
            --target-ref "$target_ref" \
            --source-sha "$source_sha" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --push-url "https://x-access-token:${STORIES_TOKEN}@github.com/${STORIES_REPO}.git" \
            "${extra[@]}" \
            > "$RUNNER_TEMP/story-changes.json"
          cat "$RUNNER_TEMP/story-changes.json"
          {
            echo "snapshot_sha=$(jq -r .snapshotSha "$RUNNER_TEMP/story-changes.json")"
            echo "changed_total=$(jq -r '(.added|length)+(.modified|length)+(.removed|length)' "$RUNNER_TEMP/story-changes.json")"
            echo "tolerated_count=$(jq -r .toleratedCount "$RUNNER_TEMP/story-changes.json")"
          } >> "$GITHUB_OUTPUT"

      # The comment is the review surface (visual changes pass CI; merging is
      # acceptance). Cosmetic failure tolerance: the snapshot already landed,
      # and a red here would stay red with nothing left to validate.
      - name: Post story-changes PR comment
        if: github.event_name == 'pull_request' && steps.snapshot.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_STORIES_SHA: ${{ steps.baseline.outputs.stories_sha }}
          BASELINE_SOURCE_SHA: ${{ steps.baseline.outputs.source_sha }}
          CHANGES_FILE: ${{ runner.temp }}/story-changes.json
        run: cd lp2025 && node lp-app/lpa-studio-web/scripts/story-drift-comment.mjs

      # The standing churn monitor: on main this delta is against the parent
      # snapshot, so a nondeterministic story shows up here run after run
      # (defect family: docs/defects/2026-08-08-tape-transport-baselines-
      # oscillate.md). Check this summary when comment noise appears on PRs.
      - name: Snapshot summary
        if: steps.snapshot.outcome == 'success'
        shell: bash
        env:
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.snapshot_sha }}
          CHANGED_TOTAL: ${{ steps.snapshot.outputs.changed_total }}
          TOLERATED_COUNT: ${{ steps.snapshot.outputs.tolerated_count }}
          BASELINE_SOURCE_SHA: ${{ steps.baseline.outputs.source_sha }}
        run: |
          {
            echo "## Story snapshot published"
            echo
            echo "Snapshot \`${SNAPSHOT_SHA}\` pushed to \`${STORIES_REPO}\`"
            echo "(baseline: main \`${BASELINE_SOURCE_SHA:0:10}\`)."
            echo
            echo "- Changed vs baseline: **${CHANGED_TOTAL}** file(s)"
            echo "- Tolerated (sub-threshold jitter, evidence in \`tolerated/\`): ${TOLERATED_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs can't mint the app token, so their capture can't become a
      # snapshot or a comment — upload the fresh set for manual review
      # instead. The capture and comparison still ran; this is review
      # evidence, not a failure.
      - name: Upload fresh captures (fork PRs — story-images-fresh)
        if: >-
          steps.check_complete.outputs.complete == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: story-images-fresh
          path: lp2025/lp-app/lpa-studio-web/story-images/.new/
          retention-days: 7
          if-no-files-found: error
          # The capture dir itself is dot-prefixed; without this the v4
          # default hidden-file exclusion uploads nothing.
          include-hidden-files: true

      - name: Fork-PR story summary
        if: >-
          steps.check_complete.outputs.complete == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          {
            echo "## Story capture from a fork PR"
            echo
            echo 'Fork PRs have no stories-repo credentials, so no snapshot or PR comment'
            echo 'was produced. The full fresh capture is the `story-images-fresh`'
            echo 'artifact; the comparison log tail is below.'
            echo
            echo '```'
            tail -40 "$RUNNER_TEMP/story-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture crash summary
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.check_complete.outputs.complete == 'false'
        shell: bash
        run: |
          {
            echo "## Story capture crashed (no artifact)"
            echo
            echo 'The capture did not complete, so no baseline artifact was uploaded —'
            echo 'this is a pipeline failure, not story drift. See the log tail below.'
            echo
            echo '```'
            tail -40 "$RUNNER_TEMP/story-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # story_check runs with continue-on-error, so this is what actually
      # fails the job when the capture never completed. Drift with a complete
      # capture is NOT a failure — the snapshot + comment carry it, and
      # merging is acceptance. Lookup and snapshot-push failures fail their
      # own steps directly.
      - name: Fail on crashed capture
        if: >-
          steps.story_check.outcome == 'failure' &&
          steps.check_complete.outputs.complete != 'true'
        shell: bash
        run: |
          echo "Story capture did not complete — this is a pipeline failure," \
               "not story drift. See the crash summary above."
          exit 1

      # Main-only saves (see the restore steps above). `always()` preserves
      # the old actions/cache post-step behavior of saving even when a
      # main-push drift failed the job — the build artifacts are still good.
      - name: Save cargo registry, tools, and build artifacts (main only)
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          steps.stories_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lp2025/target/
          key: ${{ steps.stories_cache.outputs.cache-primary-key }}

      - name: Save Chrome for Testing cache (main only)
        if: >-
          always() && github.ref == 'refs/heads/main' &&
          steps.chrome_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/chrome
          key: ${{ steps.chrome_cache.outputs.cache-primary-key }}
