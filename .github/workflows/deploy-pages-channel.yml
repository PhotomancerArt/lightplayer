name: Deploy Pages Channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Static site channel to deploy
        required: true
        type: choice
        options:
          - beta
          - demo
      ref:
        description: Git ref to build
        required: true
        default: main
      dry_run:
        description: Build and smoke-check without pushing to the Pages repo
        required: true
        type: boolean
        default: false

concurrency:
  group: pages-channel-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  RISC_V_TARGET: riscv32imac-unknown-none-elf
  RUSTUP_PERMIT_COPY_RENAME: 1
  # Same compile-reuse shape as pre-merge.yml and deploy-cloud.yml: sccache
  # (GHA backend) caches individual rustc invocations content-addressed.
  # CARGO_INCREMENTAL=0 because sccache cannot cache incremental compiles.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  deploy:
    name: Build and deploy ${{ inputs.channel }}
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Before the build, for the same reason as the production deploy in
      # deploy-cloud.yml: `print-app-version.sh` reads `git status --porcelain`,
      # and the build writes generated files into the checkout. No
      # `--require-tag` here — channels deploy arbitrary refs, and an untagged
      # ref legitimately stamps `<sha>`.
      - name: Resolve app version
        run: |
          set -euo pipefail
          version="$(scripts/print-app-version.sh)"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Deploying app version: ${version}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install Rust targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add ${{ env.RISC_V_TARGET }}

      # Studio serves an image per chip (lp-fw/builds/served.json) and two of
      # the three are Xtensa. Same pin, targets and `default: false` reasoning
      # as the retired deploy-studio-pages.yml did (production is fly.io now,
      # via deploy-cloud.yml — read the comment there). Beta-only,
      # matching the studio build step below: the demo channel ships no
      # firmware.
      - name: Install Xtensa Rust toolchain
        if: inputs.channel == 'beta'
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          version: 1.95.0.0
          buildtargets: esp32s3,esp32
          default: false
          ldproxy: false

      # target/ is deliberately NOT cached (cache-targets: false): multi-GB
      # target payloads get LRU-evicted from the repo's 10 GB Actions-cache
      # budget before they are ever restored (see deploy-cloud.yml). sccache
      # re-materializes crate compiles content-addressed instead. `shared-key`
      # is shared with deploy-cloud.yml on purpose: the two build the same
      # artifact from the same tree.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: deploy

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt binaries, not `cargo install` — see deploy-cloud.yml for the
      # full rationale (source builds cost ~11 min per run, dx alone ~8).
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install web build tools (prebuilt)
        run: cargo binstall --no-confirm --locked wasm-bindgen-cli@0.2.114 dioxus-cli@0.7.9

      - name: Install espflash (prebuilt)
        if: inputs.channel == 'beta'
        run: cargo binstall --no-confirm --locked espflash@3.3.0

      - name: Build beta artifact
        if: inputs.channel == 'beta'
        run: just studio-web-deploy-dir beta target/pages/channel beta.lightplayer.app

      - name: Smoke-check beta artifact
        if: inputs.channel == 'beta'
        run: just studio-web-smoke target/pages/channel

      - name: Build demo artifact
        if: inputs.channel == 'demo'
        run: just web-demo-deploy-dir demo target/pages/channel demo.lightplayer.app

      - name: Smoke-check demo artifact
        if: inputs.channel == 'demo'
        run: just web-demo-smoke target/pages/channel

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Pages App token
        if: ${{ inputs.dry_run == false }}
        id: pages-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LIGHTPLAYER_PAGES_APP_ID }}
          private-key: ${{ secrets.LIGHTPLAYER_PAGES_PRIVATE_KEY }}
          owner: PhotomancerArt
          repositories: |
            lightplayer-beta-pages
            lightplayer-demo-pages
          permission-contents: write

      - name: Publish channel artifact
        env:
          LIGHTPLAYER_PAGES_TOKEN: ${{ steps.pages-app-token.outputs.token }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          target_repo=""
          case "$CHANNEL" in
            beta) target_repo="PhotomancerArt/lightplayer-beta-pages" ;;
            demo) target_repo="PhotomancerArt/lightplayer-demo-pages" ;;
            *) echo "unknown channel: $CHANNEL" >&2; exit 2 ;;
          esac

          args=(--repo "$target_repo" --dir target/pages/channel --message "deploy: ${CHANNEL} ${GITHUB_SHA::12}")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          scripts/pages/publish-static-repo.sh "${args[@]}"
