name: Deploy Cloud Service

# The lightplayer.app origin: one fly.io machine running lp-cloud-server,
# which serves the API, the blob planes, the share pages, AND the Studio
# bundle (D26 — one origin, real 200s, per-URL OG tags).
#
# The Studio web artifact is built HERE and shipped into the image as bytes;
# infra/Dockerfile deliberately does not run `dx`. The build steps were
# inherited from the retired deploy-studio-pages.yml (GH Pages hosting died
# with the 2026-08-06 DNS cutover; the last-deployed Pages site remains as
# the DNS-rollback target — see docs/runbooks/godaddy-dns-cutover.md §5).
#
# The bundle's FIRMWARE is not built here. It is the release's own:
# release-firmware.yml builds every served package once for this commit and
# attaches it to the release, and the build step below waits for that run
# and downloads the packages, verified by SHA-256
# (scripts/release/fetch-release-firmware.sh). One build: the engine a
# bundle flashes is one lightplayer.app's firmware store serves, so a board
# flashed from this Studio can always be healed by any Studio
# (docs/adr/2026-10-06-firmware-distribution.md). The cost is deliberate: a
# release whose firmware fails to build does not deploy.

# Deploys ride the "Main push" workflow (tag + release, ~90 s) — NOT the
# full "CI" validation workflow, so a red CI run on main does not block a
# deploy today. Retargeting workflow_run to "CI" would close that gap at
# the cost of ~20 min extra merge→live latency; that trade is still open
# (post-merge CI audit, 2026-08-08). workflow_dispatch remains the manual
# override for re-deploys and incident response.
on:
  workflow_run:
    workflows: ["Main push"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Never two deploys at once: the machine is single-writer by design and an
  # overlapping `flyctl deploy` would race the volume handoff.
  group: deploy-cloud
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  RUSTUP_PERMIT_COPY_RENAME: 1
  # Same compile-reuse shape as pre-merge.yml: sccache (GHA backend) caches
  # individual rustc invocations content-addressed, workspace members
  # included. CARGO_INCREMENTAL=0 because sccache cannot cache incremental
  # compiles.
  CARGO_INCREMENTAL: "0"
  # Match pre-merge.yml exactly: these two are part of the rustc arguments
  # sccache hashes. (They were added when this job still built lp-cli for
  # the firmware packages — `dev [unoptimized + debuginfo]`, sharing nothing
  # with CI, 2026-09-08; they stay so the wasm builds keep their sccache
  # keys.)
  CARGO_PROFILE_DEV_DEBUG: "false"
  CARGO_PROFILE_TEST_DEBUG: "false"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # A 20-minute wasm build that then discovers it has no deploy token is a
  # bad way to learn that. This job costs seconds.
  gate:
    name: Deploy token present?
    # On the CI-ride path, only a GREEN "Main push" run on main proceeds;
    # a manual dispatch always may.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - name: Check FLY_API_TOKEN
        id: token
        # Via env, not interpolated into the script: a secret in a shell
        # command line is a secret in a process listing.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "FLY_API_TOKEN is not set — skipping the cloud deploy."
            echo "Set it (fly tokens create deploy) once the app exists: infra/bootstrap.sh"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build artifact and deploy to fly.io
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Includes the bounded wait for this commit's "Release firmware" run,
    # which starts with this job and builds in parallel with the wasm.
    timeout-minutes: 90
    permissions:
      contents: read
      # `gh run list` / `gh run watch` on release-firmware.yml.
      actions: read
    # Every `run` step works inside lp2025/, the same path pre-merge.yml
    # checks out into. That is not cosmetic: sccache hashes the compile's
    # working directory ("the cwd of the compile" in its Rust hasher), so a
    # root checkout could never share an object with CI — measured 10 %
    # sccache hits and a 13m41s lp-cli build on 2026-09-08, with the three
    # firmware images CI had just built rebuilt from scratch. The checkout
    # comes first because the directory must exist before any `run` step.
    defaults:
      run:
        working-directory: lp2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lp2025
          # Deploy exactly the commit CI validated (empty on manual
          # dispatch, which then checks out the default branch head).
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history AND tags: the version below is read from the tag
          # `main-push.yml` pushed for this very commit.
          fetch-depth: 0
          fetch-tags: true

      - name: Install system deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome* /etc/apt/sources.list.d/*google*
          sudo apt-get update || echo "apt-get update reported errors; continuing — the install below is the real gate"
          sudo apt-get install -y libudev-dev pkg-config

      # BEFORE the build, and this ordering is the whole point:
      # `print-app-version.sh` reads `git status --porcelain`, and the build
      # writes generated files into the checkout — resolve after it and
      # production stamps `<sha>-dirty-<time>` instead of the version. That
      # exact bug is why tagging and deploying were merged into main-push.yml;
      # this deploy rides that workflow's success, so the tag already exists.
      # `--require-tag` fails loudly rather than shipping a sha-stamped
      # production build.
      - name: Resolve app version
        run: |
          set -euo pipefail
          version="$(scripts/print-app-version.sh --require-tag)"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Deploying app version: ${version}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install Rust targets
        run: |
          rustup target add wasm32-unknown-unknown
          # wasm32-wasip1 is the ESP32-C6 emulator module Studio now ships
          # as a sidecar (`just studio-emu-sidecar`, called by
          # `studio-web-build`). The recipe installs it itself if it is
          # missing; it is named here beside the others so the toolchain
          # this job needs is readable in one place.
          rustup target add wasm32-wasip1

      # No RISC-V target, no Xtensa toolchain and no espflash: the firmware
      # comes from the release (see the top of this file). They lived here
      # only for `lp-cli firmware package`.

      # target/ is deliberately NOT cached: multi-GB target payloads get
      # LRU-evicted from the repo's 10 GB Actions-cache budget before they
      # are ever restored (the old `cloud-cargo` entry was, every deploy).
      # sccache re-materializes crate compiles content-addressed instead,
      # same shape as pre-merge.yml, and with the working directory and
      # profile env aligned (above) its objects are the same ones CI writes.
      # The registry is the repo's ONE
      # cargo-registry entry, restored read-only — pre-merge's lint job on
      # main is its only writer (this workflow used to save its own
      # ~517 MB `deploy` copy of the same bytes;
      # docs/debt/actions-cache-budget.md).
      #
      # Referenced as owner/repo/path@main, NOT `./`. This workflow's file
      # comes from the default branch, but its checkout is an arbitrary
      # older ref (workflow_run.head_sha / inputs.ref) — so a `./` local
      # action resolves against a tree that may predate the action and dies
      # with "Can't find 'action.yml'". That is not hypothetical: run
      # 34204176179 failed exactly that way, deploying #601's commit under
      # main's newer workflow. `@main` resolves from the repository instead
      # of the workspace, so the two are decoupled. pre-merge.yml
      # deliberately keeps `./` — there the PR's own copy is what CI must
      # validate.
      - name: Restore cargo registry
        uses: PhotomancerArt/lightplayer/.github/actions/cargo-registry@main

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10
        with:
          version: v0.18.0

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt binaries, not `cargo install`: these compiled from source on
      # EVERY deploy (dx alone ~8 min, ~11 min total — `--force` defeats even
      # a warm ~/.cargo/bin). Both publish binaries for exactly these pins;
      # binstall verifies the requested version and falls back to a
      # `--locked` source build only if an asset ever disappears.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install web build tools (prebuilt)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked wasm-bindgen-cli@0.2.114 dioxus-cli@0.7.9

      # `production` + the domain are what put the canonical origin into the
      # artifact. The output path is contractual: infra/Dockerfile COPYs
      # exactly target/pages/studio.
      #
      # LP_STUDIO_FIRMWARE: the bundle's firmware is release v<version>'s
      # (`just studio-web-firmware`), fetched after dx so this job's wasm
      # build overlaps the release's firmware build; it waits for this
      # commit's "Release firmware" run (bounded by timeout-minutes) and
      # fails if that run fails — the deploy never ships firmware it did not
      # release. Rollback: revert this change to build it here again.
      - name: Build web artifact
        env:
          LP_STUDIO_FIRMWARE: release:${{ env.APP_VERSION }}
          LP_STUDIO_FIRMWARE_WAIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: just studio-web-deploy-dir production target/pages/studio lightplayer.app

      - name: Smoke-check web artifact
        run: just studio-web-smoke target/pages/studio

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Docker only reads `.dockerignore` from the context root, and the
      # context is the repo root. Without this the upload to fly's builder
      # includes a multi-gigabyte warm `target/`. See infra/dockerignore.
      - name: Stage .dockerignore
        run: cp infra/dockerignore .dockerignore

      # `--remote-only` IS the docker build: flyctl uploads the context and
      # builds the image on fly's builder, which has the layer cache from the
      # previous deploy. Building locally first and pushing would duplicate
      # the work on a runner that starts cold every time.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy . \
            --config infra/fly.toml \
            --dockerfile infra/Dockerfile \
            --build-arg GIT_SHA="$(git rev-parse HEAD)" \
            --remote-only \
            --wait-timeout 600

      - name: Verify the deployed machine answers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # Against fly.dev, not the apex: this must pass identically before
          # and after the DNS cutover.
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://lightplayer.fly.dev/healthz; then
              exit 0
            fi
            echo "healthz not ready yet (attempt ${attempt})"
            sleep 10
          done
          echo "healthz never answered — check: flyctl logs --app lightplayer"
          exit 1

      - name: Verify plain HTTP still redirects (and only the relay's device leg does not)
        run: |
          set -euo pipefail
          # fly's `force_https` is off so boards can reach the relay over
          # plain HTTP; the app redirects everything else itself
          # (lp-cloud-server/src/https_redirect.rs). This is the live check
          # that it does.
          #
          # `fly deploy` returns while the rollout is still landing, so the
          # first probes can hit the old machine, a half-started one, or a
          # connection that times out (main's deploy failed on #999, #1030 and
          # #1038 this way; the same probes pass a minute later). Both probes
          # therefore repeat, 5 s apart, for up to ~90 s, until BOTH hold.
          # What counts as success is unchanged: a page path answers 301 to
          # https with path and query kept, and the relay's device leg (a
          # WebSocket upgrade on /relay/device over plain HTTP) answers 101.
          # A timeout or refused connection is "not yet" until the budget
          # ends; then the step fails with the last statuses seen.
          python3 - <<'PY'
          import http.client
          import os
          import socket
          import time

          # RELAY_SMOKE_* exist so the retry loop can be proven against a
          # local fake; the workflow sets none of them.
          addr = os.environ.get("RELAY_SMOKE_ADDR", "lightplayer.app:80")
          host, _, port = addr.partition(":")
          port = int(port or 80)
          budget = float(os.environ.get("RELAY_SMOKE_BUDGET", "90"))
          pause = float(os.environ.get("RELAY_SMOKE_PAUSE", "5"))
          probe_timeout = 5
          # Always the real Host header, whatever address we connect to.
          site = "lightplayer.app"


          def page_status():
              """Return (ok, what-was-seen) for the plain-HTTP page redirect."""
              try:
                  c = http.client.HTTPConnection(host, port, timeout=probe_timeout)
                  c.request("GET", "/?relay-smoke=1", headers={"Host": site})
                  r = c.getresponse()
                  line = f"HTTP/1.1 {r.status}"
                  loc = r.getheader("Location") or ""
                  c.close()
              except Exception as e:  # timeout, refused, reset: not yet
                  return False, f"{type(e).__name__}: {e}"
              if r.status != 301:
                  return False, line
              want = f"https://{site}/?relay-smoke=1"
              if not loc.lower().startswith(want):
                  return False, f"{line} (location: {loc!r})"
              return True, f"{line} -> {loc}"


          def device_status():
              """Return (ok, what-was-seen) for the relay's device-leg upgrade."""
              try:
                  s = socket.create_connection((host, port), timeout=probe_timeout)
                  try:
                      s.sendall(b"GET /relay/device HTTP/1.1\r\nHost: " + site.encode()
                                + b"\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n"
                                b"Sec-WebSocket-Version: 13\r\n"
                                b"Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n\r\n")
                      data = b""
                      while b"\r\n" not in data:
                          chunk = s.recv(4096)
                          if not chunk:
                              break
                          data += chunk
                  finally:
                      s.close()
              except Exception as e:  # timeout, refused, reset: not yet
                  return False, f"{type(e).__name__}: {e}"
              status = data.split(b"\r\n", 1)[0].decode(errors="replace")
              return " 101 " in status, status


          deadline = time.monotonic() + budget
          attempt = 0
          while True:
              attempt += 1
              page_ok, page = page_status()
              dev_ok, dev = device_status()
              print(f"attempt {attempt}: page={page!r} device-leg={dev!r}", flush=True)
              if page_ok and dev_ok:
                  break
              if time.monotonic() + pause >= deadline:
                  failed = []
                  if not page_ok:
                      failed.append(f"http://{site}/ is not a 301 to https with path and query kept: {page}")
                  if not dev_ok:
                      failed.append(f"the device leg did not upgrade: {dev}")
                  raise SystemExit("; ".join(failed) + f" (after {attempt} attempts)")
              time.sleep(pause)
          PY
