name: Deploy Cloud Service

# The lightplayer.app origin: one fly.io machine running lp-cloud-server,
# which serves the API, the blob planes, the share pages, AND the Studio
# bundle (D26 — one origin, real 200s, per-URL OG tags).
#
# The Studio web artifact is built HERE and shipped into the image as bytes;
# infra/Dockerfile deliberately does not run `dx`. The build steps were
# inherited from the retired deploy-studio-pages.yml (GH Pages hosting died
# with the 2026-08-06 DNS cutover; the last-deployed Pages site remains as
# the DNS-rollback target — see docs/runbooks/godaddy-dns-cutover.md §5).

# Deploys ride the "Main push" workflow (tag + release, ~90 s) — NOT the
# full "CI" validation workflow, so a red CI run on main does not block a
# deploy today. Retargeting workflow_run to "CI" would close that gap at
# the cost of ~20 min extra merge→live latency; that trade is still open
# (post-merge CI audit, 2026-08-08). workflow_dispatch remains the manual
# override for re-deploys and incident response.
on:
  workflow_run:
    workflows: ["Main push"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Never two deploys at once: the machine is single-writer by design and an
  # overlapping `flyctl deploy` would race the volume handoff.
  group: deploy-cloud
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  RISC_V_TARGET: riscv32imac-unknown-none-elf
  RUSTUP_PERMIT_COPY_RENAME: 1
  # Same compile-reuse shape as pre-merge.yml: sccache (GHA backend) caches
  # individual rustc invocations content-addressed, workspace members
  # included. CARGO_INCREMENTAL=0 because sccache cannot cache incremental
  # compiles. The wrapper also covers the Xtensa firmware cross-builds —
  # sccache + Espressif toolchain + build-std is proven by pre-merge's
  # firmware-size job.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # A 20-minute wasm+firmware build that then discovers it has no deploy
  # token is a bad way to learn that. This job costs seconds.
  gate:
    name: Deploy token present?
    # On the CI-ride path, only a GREEN "Main push" run on main proceeds;
    # a manual dispatch always may.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - name: Check FLY_API_TOKEN
        id: token
        # Via env, not interpolated into the script: a secret in a shell
        # command line is a secret in a process listing.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "FLY_API_TOKEN is not set — skipping the cloud deploy."
            echo "Set it (fly tokens create deploy) once the app exists: infra/bootstrap.sh"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build artifact and deploy to fly.io
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated (empty on manual
          # dispatch, which then checks out the default branch head).
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history AND tags: the version below is read from the tag
          # `main-push.yml` pushed for this very commit.
          fetch-depth: 0
          fetch-tags: true

      # BEFORE the build, and this ordering is the whole point:
      # `print-app-version.sh` reads `git status --porcelain`, and the build
      # writes generated files into the checkout — resolve after it and
      # production stamps `<sha>-dirty-<time>` instead of the version. That
      # exact bug is why tagging and deploying were merged into main-push.yml;
      # this deploy rides that workflow's success, so the tag already exists.
      # `--require-tag` fails loudly rather than shipping a sha-stamped
      # production build.
      - name: Resolve app version
        run: |
          set -euo pipefail
          version="$(scripts/print-app-version.sh --require-tag)"
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Deploying app version: ${version}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-27
          components: rust-src

      - name: Install Rust targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add ${{ env.RISC_V_TARGET }}

      # The bundle ships a firmware image per chip (lp-fw/builds/served.json)
      # and two of the three are Xtensa, so both build targets are named
      # here exactly as in deploy-studio-pages.yml. `default: false` for the
      # same reason: the wasm bundle and host tooling build on the pinned
      # nightly above. Keep the version in sync with the other workflows.
      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          version: 1.95.0.0
          buildtargets: esp32s3,esp32
          default: false
          ldproxy: false

      # target/ is deliberately NOT cached (cache-targets: false): the old
      # multi-GB `cloud-cargo` actions/cache entry was LRU-evicted between
      # deploys every single time (the repo's 10 GB Actions-cache budget
      # lives in thousands of small sccache entries), so it never restored —
      # it only burned 48 s of save time and cache budget per run. sccache
      # re-materializes crate compiles content-addressed instead, same shape
      # as pre-merge.yml. `shared-key` is shared with deploy-pages-channel.yml
      # on purpose: the two build the same artifact from the same tree.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: deploy

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.10

      - name: Install just
        uses: extractions/setup-just@v3

      # Prebuilt binaries, not `cargo install`: these three compiled from
      # source on EVERY deploy (dx alone ~8 min, ~11 min total — `--force`
      # defeats even a warm ~/.cargo/bin). All three publish binaries for
      # exactly these pins; binstall verifies the requested version and falls
      # back to a `--locked` source build only if an asset ever disappears.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install web build tools (prebuilt)
        run: cargo binstall --no-confirm --locked wasm-bindgen-cli@0.2.114 dioxus-cli@0.7.9 espflash@3.3.0

      # `production` + the domain are what put the canonical origin into the
      # artifact. The output path is contractual: infra/Dockerfile COPYs
      # exactly target/pages/studio.
      - name: Build web artifact
        run: just studio-web-deploy-dir production target/pages/studio lightplayer.app

      - name: Smoke-check web artifact
        run: just studio-web-smoke target/pages/studio

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            { echo '#### sccache'; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Docker only reads `.dockerignore` from the context root, and the
      # context is the repo root. Without this the upload to fly's builder
      # includes a multi-gigabyte warm `target/`. See infra/dockerignore.
      - name: Stage .dockerignore
        run: cp infra/dockerignore .dockerignore

      # `--remote-only` IS the docker build: flyctl uploads the context and
      # builds the image on fly's builder, which has the layer cache from the
      # previous deploy. Building locally first and pushing would duplicate
      # the work on a runner that starts cold every time.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy . \
            --config infra/fly.toml \
            --dockerfile infra/Dockerfile \
            --build-arg GIT_SHA="$(git rev-parse HEAD)" \
            --remote-only \
            --wait-timeout 600

      - name: Verify the deployed machine answers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # Against fly.dev, not the apex: this must pass identically before
          # and after the DNS cutover.
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://lightplayer.fly.dev/healthz; then
              exit 0
            fi
            echo "healthz not ready yet (attempt ${attempt})"
            sleep 10
          done
          echo "healthz never answered — check: flyctl logs --app lightplayer"
          exit 1
