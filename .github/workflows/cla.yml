name: CLA Assistant

# Requires every outside contributor to sign the LightPlayer Individual CLA
# (docs/cla/individual-cla.md) before their first PR can merge. Signatures are
# recorded on the `cla-signatures` branch, keyed by GitHub account.
# See docs/adr/2026-07-31-contributor-license-agreement.md.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          branch: 'cla-signatures'
          path-to-document: 'https://github.com/light-player/lightplayer/blob/main/docs/cla/individual-cla.md'
          allowlist: 'Yona-Appletree,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: >
            Thank you for your contribution to LightPlayer! Before we can merge
            it, you need to sign the
            [LightPlayer Individual Contributor License Agreement](https://github.com/light-player/lightplayer/blob/main/docs/cla/individual-cla.md).
            LightPlayer is dual-licensed (AGPL-3.0-or-later plus commercial
            terms), and the CLA is what lets your contribution be part of both —
            you keep ownership of your work, and it will always remain available
            under an OSI-approved open-source license. If you are contributing
            on behalf of your employer, please have them execute the
            [Corporate CLA](https://github.com/light-player/lightplayer/blob/main/docs/cla/corporate-cla.md)
            instead. To sign, post the comment below.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the LightPlayer CLA. ✅'
          lock-pullrequest-aftermerge: false
