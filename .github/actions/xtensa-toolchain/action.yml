name: Xtensa Rust toolchain (cached, retried)
description: >
  Install the Espressif Xtensa Rust fork the way esp-rs/xtensa-toolchain does,
  but authenticated, cached and retried.

# WHY THIS EXISTS
#
# `esp-rs/xtensa-toolchain@v1.6` is forty lines of bash that shell out to
# espup, and espup's first act is an UNAUTHENTICATED query to
# `api.github.com/repos/esp-rs/rust-build/releases`. Unauthenticated
# api.github.com is 60 requests/hour *per source IP*, and hosted runners share
# a NAT pool with every other repository on the platform. When that pool is
# hot, the query returns 403 and the job dies in ~20 seconds:
#
#   [debug]: Querying GitHub API: '.../esp-rs/rust-build/releases?...'
#   Error: espup::toolchain::http_error
#     x HTTP GET Error: GitHub API returned status code: 403 Forbidden
#
# Observed on two unrelated PRs a day apart, both green on rerun:
#   PR #557 https://github.com/PhotomancerArt/lightplayer/actions/runs/34098208425/job/101666493090
#   PR #596 https://github.com/PhotomancerArt/lightplayer/actions/runs/34190629728/job/101947822790
#
# Three layers, cheapest first:
#
#   1. GITHUB_TOKEN. espup reads it (src/toolchain/mod.rs: `if let
#      Some(token) = env::var_os("GITHUB_TOKEN")` -> Bearer header) and the
#      limit becomes 1000/hour scoped to THIS repository rather than 60/hour
#      shared with the planet. This alone removes the observed failure.
#   2. A bounded retry. Layer 1 does nothing for a genuine api.github.com
#      blip, a 5xx from objects.githubusercontent.com, or a truncated tarball.
#      Three attempts, 15s/30s backoff.
#   3. An Actions cache of the installed tree, so the warm path makes no
#      network calls at all and neither of the above can fire.
#
# Upstream is inlined rather than wrapped because a composite action cannot
# put `continue-on-error` on a step, so a `uses:` step cannot be retried from
# inside one. The inlined bash is a faithful copy of v1.6's Linux/macOS path
# (the callers are all ubuntu-24.04); the only intentional differences are the
# token, the loop, and skipping the whole thing on a verified cache hit.

inputs:
  version:
    description: Xtensa Rust fork version, pinned (never "latest" — see the callers).
    required: true
  buildtargets:
    description: Comma-separated chip list, e.g. "esp32s3" or "esp32s3,esp32".
    required: true
  default:
    description: Make `esp` the default rustup toolchain.
    default: "false"
  override:
    description: Clear any rustup directory override, as upstream does.
    default: "true"
  save-cache:
    description: >
      Populate the Actions cache on a miss. Pass the branch test the rest of
      this repo uses for rust-cache (`github.ref == 'refs/heads/main'`): PR
      branches read main's entry and write nothing, so the repo pays for one
      entry per (version, targets) pair rather than one per branch.
    default: "false"

outputs:
  cache-hit:
    description: '"true" when the install was skipped because the cache was usable.'
    value: ${{ steps.verify.outputs.usable }}

runs:
  using: composite
  steps:
    # Upstream's first step. Every current caller is on an image that ships
    # rustup, but a caller that is not would otherwise fail three steps later
    # with a confusing message.
    - name: Ensure rustup is installed
      shell: bash
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -sSf https://sh.rustup.rs \
            | sh -s -- --profile minimal -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        echo "HOST_TARGET=$(rustup show | grep 'Default host' | sed -e 's/.* //')" >> "$GITHUB_ENV"
        echo "ESPUP_EXPORT_FILE=$HOME/exports" >> "$GITHUB_ENV"

    # espup lays the whole ecosystem under the toolchain directory:
    #   ~/.rustup/toolchains/esp                              (the Rust fork)
    #   ~/.rustup/toolchains/esp/xtensa-esp-elf/<ver>         (GNU binutils/gcc)
    #   ~/.rustup/toolchains/esp/xtensa-esp32-elf-clang/<ver> (LLVM libs)
    # plus a ~/.espup/esp-clang symlink into that tree and the ~/exports file
    # that carries PATH and LIBCLANG_PATH. All four are cached together; the
    # symlink survives because its target is in the same archive.
    #
    # The key is the pin plus the chip list: espup's layout is a function of
    # both, and a floating key would silently serve the wrong fork after a
    # version bump.
    - name: Restore the Xtensa toolchain
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.rustup/toolchains/esp
          ~/.espup
          ~/exports
        key: xtensa-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.buildtargets }}-v1

    # A cache hit is a claim, not a fact: a half-written entry, or one saved by
    # a job that died mid-install, would hand the build a toolchain that fails
    # 300 lines into a compile. Prove the three things the callers actually
    # use — the fork runs, the export file exists, and every requested chip's
    # gcc is on the exported PATH — and fall through to a real install if any
    # of them is missing. Cheap insurance against a poisoned cache.
    - name: Verify the restored toolchain
      id: verify
      shell: bash
      run: |
        set -uo pipefail
        usable=false
        if [[ "${{ steps.restore.outputs.cache-hit }}" == "true" ]]; then
          if [[ -f "$HOME/exports" ]] && rustup run esp rustc -vV >/dev/null 2>&1; then
            # shellcheck disable=SC1091
            source "$HOME/exports"
            missing=""
            IFS=',' read -ra chips <<< "${{ inputs.buildtargets }}"
            for chip in "${chips[@]}"; do
              command -v "xtensa-${chip}-elf-gcc" >/dev/null 2>&1 || missing="$missing $chip"
            done
            if [[ -z "$missing" ]]; then
              usable=true
            else
              echo "::warning::Cached Xtensa toolchain is missing gcc for:$missing — reinstalling."
            fi
          else
            echo "::warning::Cached Xtensa toolchain did not run — reinstalling."
          fi
        fi
        echo "usable=$usable" >> "$GITHUB_OUTPUT"
        echo "Cache usable: $usable"

    - name: Install the Xtensa toolchain (espup)
      if: steps.verify.outputs.usable != 'true'
      shell: bash
      env:
        # The fix for the observed 403. Read by espup for every
        # api.github.com call; scoped to this repository and read-only for the
        # public release metadata it fetches.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        version_flag=(--toolchain-version "${{ inputs.version }}")

        install_once() {
          rm -f "espup-${HOST_TARGET}.zip"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --location --silent --show-error --fail \
            -o "espup-${HOST_TARGET}.zip" \
            "https://github.com/esp-rs/espup/releases/latest/download/espup-${HOST_TARGET}.zip" || return 1
          unzip -o "espup-${HOST_TARGET}.zip" -d "$HOME/.cargo/bin" || return 1
          chmod +x "$HOME/.cargo/bin/espup"*
          "$HOME/.cargo/bin/espup" install -l debug --targets "${{ inputs.buildtargets }}" "${version_flag[@]}"
        }

        for attempt in 1 2 3; do
          echo "::group::espup install (attempt $attempt/3)"
          if install_once; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if [[ $attempt -lt 3 ]]; then
            backoff=$((attempt * 15))
            echo "::warning::Xtensa toolchain install failed (attempt $attempt/3); retrying in ${backoff}s."
            sleep $backoff
          fi
        done
        echo "::error::Xtensa toolchain install failed after 3 attempts."
        exit 1

    # Save before exporting, so a job that later fails for its own reasons has
    # still paid the download forward. Only on a miss, and only where the
    # caller says so.
    - name: Save the Xtensa toolchain
      if: inputs.save-cache == 'true' && steps.verify.outputs.usable != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.rustup/toolchains/esp
          ~/.espup
          ~/exports
        key: ${{ steps.restore.outputs.cache-primary-key }}

    # Upstream's export block, run on BOTH paths: the cache carries the files
    # but not the process environment, so a warm job still has to publish
    # PATH and LIBCLANG_PATH itself.
    - name: Export the toolchain environment
      shell: bash
      run: |
        set -uo pipefail
        # shellcheck disable=SC1091
        source "$HOME/exports"
        echo "$PATH" >> "$GITHUB_PATH"
        [[ -n "${LIBCLANG_PATH:-}" ]] && echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "$GITHUB_ENV"
        [[ -n "${CLANG_PATH:-}" ]] && echo "CLANG_PATH=${CLANG_PATH}" >> "$GITHUB_ENV"
        exit 0

    - name: Set default and override
      shell: bash
      run: |
        [[ "${{ inputs.default }}" = "true" ]] && rustup default esp || true
        [[ "${{ inputs.override }}" = "true" ]] && rustup override unset || true
        exit 0
