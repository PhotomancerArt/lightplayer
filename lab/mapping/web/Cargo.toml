[package]
name = "lab-mapping-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Mapping design lab: the canvas page (Dioxus web) over lab-mapping-model"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }
lab-mapping-model = { path = "../model" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect", "MouseEvent", "EventTarget", "Performance"] }

[lints]
workspace = true
