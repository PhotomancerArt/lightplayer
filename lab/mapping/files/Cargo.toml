[package]
name = "lab-mapping-files"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Mapping design lab: opens and saves real LightPlayer projects in the product's own formats"

# The fence: the lab model and serde only — NO product crate. The product's
# document shapes (project format 11, map2d 1–5, patch files) are
# re-created here (fit-check §6).
[dependencies]
lab-mapping-model = { path = "../model" }
# Never `preserve_order`: Studio builds this crate (the Graph tab), and cargo
# unifies features per build, so it would flip serde_json's map order for
# every crate in Studio — and the committed schema corpus (see lpa-upgrade's
# `json::JsonNode`). A file this crate writes is a file that changed; its
# keys come out in serde_json's sorted order, which every product reader
# reads the same.
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
lab-layout = { path = "../layout" }

[lints]
workspace = true
