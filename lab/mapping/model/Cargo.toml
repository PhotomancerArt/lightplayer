[package]
name = "lab-mapping-model"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Mapping design lab: the Graph editor model — fixtures on lpc-mapping parts, selection, hints"

# The fixture domain is the product's own: `lpc-mapping` (the part tree,
# the patcher and its `edit` operations), the model the engine and firmware
# run, so what the Graph shows is what the board does (mapping rebuild M4
# P03). That ends this crate's fence (C32); M4 P10 moves it into `lp-app/`.
# Its node-graph domain (nodes, channels, bindings, the simulated board)
# stays its own.
[dependencies]
lab-layout = { path = "../layout" }
libm = "0.2"
lpc-mapping = { path = "../../../lp-core/lpc-mapping", features = ["std", "edit"] }

[lints]
workspace = true
