[package]
name = "lab-mapping-fit-tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Mapping design lab: proves the lab's files crate fits the product (lamps, wire, round trips)"

# The proof, not the lab: this crate MAY depend on product crates, and it
# is the only lab crate that does. Nothing depends on it. Its tests open
# each test project in the lab and in the product, and compare.
[dependencies]

[dev-dependencies]
lab-mapping-files = { path = "../files" }
lab-mapping-model = { path = "../model" }
lpc-engine = { path = "../../../lp-core/lpc-engine" }
lpc-mapping = { path = "../../../lp-core/lpc-mapping" }
lpc-model = { path = "../../../lp-core/lpc-model" }
lpfs = { path = "../../../lp-base/lpfs", default-features = false, features = ["std"] }
lp-gfx-lpvm = { path = "../../../lp-gfx/lp-gfx-lpvm", default-features = false }
lp-shader = { path = "../../../lp-shader/lp-shader", default-features = false }

[lints]
workspace = true
