[package]
name = "lp-emu-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "Architecture-neutral emulator infrastructure shared by LightPlayer emulators"

[lints]
workspace = true

[dependencies]
lp-emu-abi = { path = "../lp-emu-abi" }
log = { workspace = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rustc-demangle = { version = "0.1", optional = true }
# Host-only oracle for the fragmentation replay's first-fit model
# (`profile::frag`). MIT/Apache-2.0. Pinned to the exact version esp-alloc
# 0.10 uses, so the model is checked against the allocator the classic and
# the emulator guest actually run.
linked_list_allocator = { version = "=0.10.5", default-features = false, optional = true }

# `mmap`/`mprotect`/`munmap` for the guard-paged guest arena (`arena`). MIT OR
# Apache-2.0, already in the tree via `lp-riscv-emu`, and a raw syscall surface
# rather than a library. Declared per-target rather than optional so that the
# hosts that HAVE virtual memory always get the guarded arena and the hosts
# that do not — `wasm32-wasip1`, the browser rig — cannot even name it.
[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
libc = { version = "0.2", default-features = false }

[features]
std = [
    "log/std",
    "lp-emu-abi/std",
    "serde",
    "serde_json",
    "rustc-demangle",
    "linked_list_allocator",
]

[dev-dependencies]
tempfile = "3"
# The oracle for the TLSF counterfactual's model (`profile::frag::tlsf_heap`).
# MIT/Apache-2.0. The version esp-alloc 0.10 uses for its `TLSF` heap
# algorithm, with the `unstable` feature esp-alloc also enables
# (`Tlsf::iter_blocks`). Test-only: the real crate runs at the host's word
# width, so the replay runs the model at the device's and the tests check the
# model against the crate at the host's.
rlsf = { version = "0.2.2", default-features = false, features = ["unstable"] }
