[package]
name = "lp-emu-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Architecture-neutral emulator infrastructure shared by LightPlayer emulators"

[lints]
workspace = true

[dependencies]
lp-emu-abi = { path = "../lp-emu-abi" }
log = { workspace = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rustc-demangle = { version = "0.1", optional = true }
# Host-only oracle for the fragmentation replay's first-fit model
# (`profile::frag`). MIT/Apache-2.0. Pinned to the exact version esp-alloc
# 0.10 uses, so the model is checked against the allocator the classic and
# the emulator guest actually run.
linked_list_allocator = { version = "=0.10.5", default-features = false, optional = true }
# Host-only TLSF counterfactual (`profile::frag::tlsf_heap`). MIT/Apache-2.0.
# The same crate, version and generic instantiation esp-alloc 0.10 uses for
# its `TLSF` heap algorithm, with the `unstable` feature esp-alloc also
# enables — `Tlsf::iter_blocks` is how the free-list shape is read back.
rlsf = { version = "0.2.2", default-features = false, features = [
    "unstable",
], optional = true }

[features]
std = [
    "log/std",
    "lp-emu-abi/std",
    "serde",
    "serde_json",
    "rustc-demangle",
    "linked_list_allocator",
    "rlsf",
]

[dev-dependencies]
tempfile = "3"
