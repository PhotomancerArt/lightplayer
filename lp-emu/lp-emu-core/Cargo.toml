[package]
name = "lp-emu-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Architecture-neutral emulator infrastructure shared by LightPlayer emulators"

[lints]
workspace = true

[dependencies]
lp-emu-abi = { path = "../lp-emu-abi" }
log = { workspace = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rustc-demangle = { version = "0.1", optional = true }

[features]
std = [
    "log/std",
    "lp-emu-abi/std",
    "serde",
    "serde_json",
    "rustc-demangle",
]

[dev-dependencies]
tempfile = "3"
