[package]
name = "lp-riscv-emu-guest"
version.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"

[lib]
crate-type = ["lib"]

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
lp-emu-abi = { path = "../lp-emu-abi" }
lp-perf = { path = "../../lp-base/lp-perf", features = ["syscall"], optional = true }
lp-recovery = { workspace = true }
critical-section = { workspace = true }
log = { workspace = true, default-features = false }

[features]
# `lp-perf` is only needed to install the free-list-shape hook
# (`allocator::init_heap`), which only exists under `profile`.
profile = ["dep:lp-perf"]

[build-dependencies]
