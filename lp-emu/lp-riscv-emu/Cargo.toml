[package]
name = "lp-riscv-emu"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "RISC-V 32-bit emulator runtime"

[lints]
workspace = true

[dependencies]
lp-emu-core = { path = "../lp-emu-core" }
lp-riscv-inst = { path = "../../lp-riscv/lp-riscv-inst" }
lp-emu-abi = { path = "../lp-emu-abi" }
cranelift-codegen = { workspace = true, features = ["riscv32"] }
hashbrown = { workspace = true }
log = { workspace = true, default-features = false }
env_logger = { workspace = true, optional = true }

libc = { version = "0.2", optional = true }

[features]
std = [
    "lp-emu-core/std",
    "env_logger",
    "log/std",
    "libc",
]

# THROWAWAY (M5 P1b) — never merge. Ablations of the block executor's
# per-slot bookkeeping. Each one produces an INCORRECT emulator; they exist
# to be timed, not to be right.
abl-issuing = []
abl-charge = []
abl-count = []
abl-sideband = []
abl-memcost = []
abl-pc = []
abl-all = ["abl-issuing", "abl-charge", "abl-count", "abl-sideband", "abl-memcost", "abl-pc"]
# Block-shape statistics: terminator reason, realised length, and whether a
# block could have been extended. Counters, not timings.
blockstats = []
# THROWAWAY (M5 P1b): experimental slot payloads (see mach/block.rs).
slot-packed = []
slot-dense = []
bk-hoist = []

[dev-dependencies]
# Self-dependency: lp-riscv-emu's own tests need the `std` feature. This used to
# arrive implicitly via lp-riscv-elf's (now dev-only) dependency on this crate.
lp-riscv-emu = { path = ".", features = ["std"] }
cranelift-codegen = { workspace = true, features = ["riscv32"] }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
lp-riscv-elf = { path = "../../lp-riscv/lp-riscv-elf", features = ["std"] }
tempfile = "3"
