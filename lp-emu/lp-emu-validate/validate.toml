# The validation system's policy table.
#
# `[[set]]`  — named lists of payloads, so a desk session is "run this set on
#              this port" and nothing else (vision D10: quick turnaround is the
#              design goal).
# `[[configuration]]`
#            — the named reference implementations (plan PD4) and, per field
#              class, what each is trusted for. Trust is stated, never inferred:
#              a class with no entry is `modeled`, because silence is not trust.
#
# The payload registry is NOT here — it lives in `src/payload.rs`, because it
# carries regexes and field classes that a TOML file could only hold as strings
# nobody checks. This file is policy; that file is parsing.

# ---------------------------------------------------------------------------
# Sets
# ---------------------------------------------------------------------------

[[set]]
name = "compile-parity"
description = "The incremental-compile harness: heap parity and the cycle-model measurement (spike report §11.1)."
payloads = ["shader-compile-stress"]

[[set]]
name = "g3-desk"
description = "The G3 desk batch: the compile harness plus the GPIO calibration payload, captured in one sitting."
payloads = ["shader-compile-stress", "gpio-calibrate"]

[[set]]
name = "lab-tap"
description = "The bridge harness that turns a spare board into the lab's USB-to-UART tap. Not a measurement of a device under test — the instrument that makes one possible (g3-desk-batch.md step 4)."
payloads = ["uart-bridge"]

[[set]]
name = "pins"
description = "Payloads that make a claim about a pin."
payloads = ["gpio-calibrate"]

[[set]]
name = "shipped-image"
description = "The shipped image at rest: boot to the first idle heartbeat, and the hello frame that precedes it. A scenario rather than a check — nothing here is behind a `test_*` feature — and the only set that says what the product does when nobody is asking it for anything. It is a set of one because `emu-m3` pairs it with the compile harness, and a desk sitting that wants only the idle walk cannot ask for that pair twice."
payloads = ["boot-idle"]

[[set]]
name = "emu-m3"
description = "The M3 gate set for our own C6 machine: the compile harness (heap parity against silicon, the first point on the time ladder) and the shipped image's boot to the idle heartbeat. Both run against the reference images `scripts/emu/build-reference-image.sh` builds, so `--image` is part of the recipe."
payloads = ["shader-compile-stress", "boot-idle"]

[[set]]
name = "emu-m4"
description = "The M4 gate set: the flash-backed shipped image booting to the idle heartbeat (the `[FS]` mount pair and spike report §5.1's heap and stack figures, which M3 could not reach because it stopped on SPI1.cmd), and the project-upload walk (§5.3's load gate and compile outputs, replayed from the committed host script so the transcript is a function of guest time). Both run against the reference image `scripts/emu/build-reference-image.sh` builds, so `--image` is part of the recipe."
payloads = ["boot-idle-flash", "upload-walk"]

[[set]]
name = "usb-negative-control"
description = "M6's negative control, rig-free: flash the shipped image, leave the port CLOSED for several seconds, then open a non-resetting reader and read the first heartbeat. The device is enumerated and undrained throughout, which is the one link state it cannot report on at the time — the `link` object's `hostNotDrainingMs` / `hostDrainingAgainMs` / `notDrainingCount` are its own record of it, on its own clock. Runs on silicon today; M6 P4 adds the emulator twin."
payloads = ["usb-negative-control"]

[[set]]
name = "emu-m6"
description = "M6's four USB-Serial-JTAG scenarios on our own machine, all four over the link the product actually ships: the shipped image with a host attached and reading (the DD26/DD30 arbitration against sitting 1's silicon capture of the same bytes), the port held closed from boot and opened after eight seconds (the emulator twin of the silicon negative control), the cable out mid-session and back in (`s7-unplug-mid-op`'s device side, which has had no trace since M2), and no cable at all — which silicon cannot record, because recording is what a host does."
payloads = [
    "boot-idle",
    "usb-negative-control",
    "usb-detach-reattach",
    "usb-host-absent",
]

[[set]]
name = "jit-math-perf"
description = "The Q32 math kernel cycle-cost payload (Q12 ledger, cheapest test_* migration): mul/div/sin kernels and LUT access cost against the PMU cycle counter. Timing only — never a gate under esp-emu, which has no cycle model."
payloads = ["jit-math-perf"]

# ---------------------------------------------------------------------------
# Configurations
# ---------------------------------------------------------------------------

[[configuration]]
# Identity is the CHIP, not the board (Yona, G2 2026-09-06): this is chip
# simulation, not board simulation, and the board is not something the runner
# can determine programmatically anyway. Which board a capture came from lives
# in that transcript's sidecar as `board`, beside `mac` and `silicon_rev`.
name = "silicon:esp32c6"
description = "Real ESP32-C6 silicon on a serial port. The desk board is a XIAO ESP32-C6 (chip revision v0.2, MAC a0:f2:62:87:b4:8c), which each transcript records in its own sidecar."
chip = "esp32c6"

[[configuration.trust]]
class = "memory"
grade = "measured"
because = "the board is the ground truth; nothing models it"

[[configuration.trust]]
class = "timing"
grade = "measured"
because = "a real clock on real flash with real wait states"

[[configuration.trust]]
class = "pin"
grade = "measured"
because = "a scope or a logic analyser on the header pin is the definition of what the pin did"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "measured"
because = "a real host really attaches, or really does not"

[[configuration.trust]]
class = "boot-log"
grade = "measured"
because = "the real ROM and the real IDF bootloader printed it"

[[configuration.trust]]
class = "wire"
grade = "measured"
because = "real bytes over a real port"

[[configuration]]
name = "esp-emu:0.42.0"
description = "Espressif's binary emulator, 0.42.0. A second oracle for the C6 only where the desk validated it (spike report §11)."
chip = "esp32c6"

[[configuration.trust]]
class = "memory"
grade = "measured"
because = "byte-equal to silicon on the same image: harness peak/resident/after-drop 48,132/18,932/3,976 B and all 184 per-tick values (spike report §11.1); meteor load gate 216,056 B (§11.2)"

[[configuration.trust]]
class = "boot-log"
grade = "documented"
because = "same words and values as silicon, different columns — the intercepted ROM printf drops width and zero-pad flags (spike report §11.1)"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "no cycle model. Compile ticks run 2.37x faster than silicon and log-bearing ticks 14.5x, because the ROM UART drains for free; the harness's own 5 ms slice budget passes here and FAILS on the board (spike report §11.1)"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "asserts SOF forever and reports EP1 free forever, so the firmware serves into the void believing a host is attached (spike report §4). Never trust a USB-SJ claim from here"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "no pin observation: RMT frames are produced and vanish. IO_MUX is modeled only to GPIO15, and the WS281x pin is GPIO18 (spike report §8)"

[[configuration.trust]]
class = "wire"
grade = "measured"
because = "the masked UART0 walk transcript is content-identical to silicon's (spike report §11.3)"

# ---------------------------------------------------------------------------
# Our own machine, one entry per time grade.
#
# Every class is `modeled`, and that is not modesty. Byte-equality with silicon
# on one payload is *evidence*, and it is written into the `because` where a
# reader can weigh it; it is not a promotion. `measured` means the class was
# measured on silicon, or on a configuration whose agreement with silicon for
# that class is itself in a committed transcript — which for us will mean a
# transcript per class, not one payload's heap ledger standing in for all of
# them. The vision's graded ladder is the same idea for time.
#
# `mac` / `silicon_rev` / `board` are the desk board's, because an emulator has
# no eFuse to read: the runner passes them as `--efuse-mac` / `--efuse-rev`, so
# a hello frame's identity fields compare equal to silicon's transcripts rather
# than differing for a reason that says nothing about the model. The
# configuration is still the CHIP (PD4); the board is metadata, here and in
# every sidecar.
# ---------------------------------------------------------------------------

[[configuration]]
name = "lp-emu:esp32c6:t1"
description = "Our own C6 machine (lp-emu/esp/lp-emu-esp32c6) at time grade 1: one cycle per instruction. The gate configuration for M3."
chip = "esp32c6"
mac = "a0:f2:62:87:b4:8c"
silicon_rev = "v0.2"
board = "seeed/xiao-esp32-c6"

[[configuration.trust]]
class = "memory"
grade = "modeled"
because = "the allocator is the guest's own and the RAM model is byte-exact, and on the compile harness this configuration is byte-equal to silicon — 372/372 values, peak 48,132 / resident 18,932 / after-drop 3,976 B and all 184 per-tick figures (M3 P6). That is evidence, not a promotion: the boot-idle heap sample sits 104 B below esp-emu's §5.4 figure (266,688 vs 266,792 at 5 s; 266,788 by 15 s, 4 B away), a transient in silent guest state that only a silicon capture of the memfs variant can arbitrate. Never tuned toward it"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "t1 counts one cycle per instruction — no cache, no flash wait states — and neither grade is graded by a transcript yet (the vision's 'time is a graded ladder, never a promise'). What is modelled honestly is the UART drain, at baud in emulated time, which is why the harness's log-bearing ticks land at 1.01x silicon while its compute ticks are 0.42x"

[[configuration.trust]]
class = "boot-log"
grade = "modeled"
because = "there is no boot log: a direct load places the app's segments and jumps to its entry, so no ROM banner and no IDF bootloader lines are printed at all. M7 boots from reset and is where this class becomes a claim"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "M6 built the host's side — absent, attached with the port closed, attached and draining — and four committed transcripts under `lp-emu/transcripts/esp32c6/` are what it has to show for it: `boot-idle` over the shipped link against sitting 1's silicon capture of the SAME image bytes (stack high-water 11,784 B equal, heap 8 B apart); `usb-negative-control`, the port held closed from boot and opened at eight seconds, latching at 893 ms and recovering at 8,145; `usb-detach-reattach`, the cable out at six seconds and back at nine, recovering with exactly one hello and the firmware noticing nothing; and `usb-host-absent`, where the stamp pair reads 893 / never — the discriminator absent-vs-unread. The block's own registers are graded one by one (`--strict-grade`, the table in `periph/usb_sj.rs`) and the data path is `measured` there. This class stays `modeled` all the same, by the rule the ADR states and DD33 Q4 confirmed: byte-equality and agreement are EVIDENCE, weighed here where a reader can see them, not a promotion. What earns `measured` is a silicon transcript of this class, and the one M6 needs — `usb-negative-control` on the desk board — is owed"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "a pin IS observed (M5 P2): GPIO is a routing view over the bus's signal fabric, the RMT drives RMT_SIG_0/1 into it, and a WS281x decoder reads a routed pad's edges at the datasheet's +/-150 ns into frames (--dump-frames, --pin-log). Those frames are byte-equal to the word-level decode of the same transmission, which is two readings of one model and not a measurement: nothing on silicon has confirmed a pad here and no capture is committed. The grade moves when one is (M5 P4 puts the first lit frame against the host oracle)"

[[configuration.trust]]
class = "wire"
grade = "modeled"
because = "the bytes are the guest's own, drained through a UART0 model at the configured baud, so their content and order are the firmware's. What is not the firmware's is when a host's bytes arrive on a live socket — that is host time, not guest time, and `--uart0-script` is the deterministic path for anything a transcript should carry"

[[configuration]]
name = "lp-emu:esp32c6:t2"
description = "The same machine at time grade 2: the measured per-class cycle model. Memory is identical to t1 by construction; the interleaving is not, and the stack high-water mark moves with it."
chip = "esp32c6"
mac = "a0:f2:62:87:b4:8c"
silicon_rev = "v0.2"
board = "seeed/xiao-esp32-c6"

[[configuration.trust]]
class = "memory"
grade = "modeled"
because = "the same allocator and the same RAM model as t1, and the harness's 372 memory values are identical under both grades — a time grade must not move a heap byte. The one figure that does move is the idle stack high-water mark (11,432 B under t1, 11,752 B under t2), which is interleaving, not memory: the deepest interrupted call chain is not the same chain"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "t2 uses the per-class cycle model rather than one cycle per instruction, and no transcript grades it either. It is a rung up the ladder, not a promise about milliseconds on silicon"

[[configuration.trust]]
class = "boot-log"
grade = "modeled"
because = "direct load prints no ROM or bootloader banner; the time grade changes nothing about that. M7 owns it"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "the same host model as t1, and the same four transcripts stand behind it — `boot-idle` is recorded on this grade too and its heap figures are t1's to the byte, which is what a time grade must never move. `modeled` for t1's reason: the evidence is here to be weighed, and the silicon half of the negative control is owed"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "the same pin observation as t1 (M5 P2), and the same reason for the grade: the fabric and the decoder are in the machine, not on a scope"

[[configuration.trust]]
class = "wire"
grade = "modeled"
because = "the same UART0 model as t1: the bytes are the guest's, a live socket's arrival times are the host's"
