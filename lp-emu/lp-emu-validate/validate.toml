[[configuration]]
name = "lp-emu:esp32c6:t3"
description = "The same machine at time grade 3: the class costs the cycle-probe kernels measured on silicon, plus what an access's address costs — the flash cache's 32-byte fills and the APB's wait states. The first grade in which two instructions with the same opcode cost different amounts. Memory is identical to t1 and t2 by construction; the interleaving is not."
chip = "esp32c6"
mac = "a0:f2:62:87:b4:8c"
silicon_rev = "v0.2"
board = "seeed/xiao-esp32-c6"
records_pins = true

[[configuration.trust]]
class = "memory"
grade = "modeled"
because = "the same allocator and the same RAM model as t1 and t2; the harness's 372 memory values are identical under all three grades (`t3_memory_equals_t1`, `tests/harness_parity.rs`) — a time grade must not move a heap byte, and a memory-cost model answers in cycles, never in bytes"

[[configuration.trust]]
class = "timing"
grade = "documented"
band = { per_sample = [0.80, 1.25], per_sample_coverage = 0.90, aggregate = 0.20, on = ["shader-compile-stress", "cycle-probe"] }
because = "PROPOSED AT G1, NOT YET BLESSED. t3 is structural rather than per-class — a 32 KiB 4-way cache of 32-byte lines at 338 cycles a fill (the mask ROM's Cache_Get_Mode for the geometry, cycle-probe's code_walk for the cost) and 9 cycles of APB wait state (cycle-probe's mmio_poll) — calibrated on the cycle-probe kernels and validated against 92 like-for-like silicon ticks that no parameter was ever fitted to (docs/reports/2026-09-08-esp32c6-t3-calibration.md §3, §4). Measured on those 92 ticks: 85 of 92 silicon/t3 ratios inside [0.80, 1.25] (92.4 %), aggregate 1.154, and the residual has TWO SIGNS — compute slices are one-signed cheap (all >= 1.016, worst 1.356, only 11 of 18 in the interval) while the ten cheapest log-bearing slices run 0.910-0.989 because the emulator's console path costs about 1.5x silicon's. Two model gaps, not one number. `documented` and not `measured`: the interval is the round figure RD3 named before the model existed, and it holds on the payload as a whole rather than on either class of slice separately; a one-signed compute residual with three named unmodelled causes (no invalidation, an assumed LRU, a fetch charged on the first byte's line only) is a known bias rather than a measurement uncertainty; and cycle-probe is the CALIBRATION payload, so this band rests on one independent workload, one silicon capture and one link. Promotion to `measured` wants a second independent payload, per M1's own rule that a model must not be graded on the set it was fitted to. Transcripts: lp-emu-esp32c6-t3-2026-09-08-17ac011f7 and silicon-esp32c6-2026-09-07-735af98ae (shader-compile-stress), lp-emu-esp32c6-t3-2026-09-08-17ac011f7 and silicon-esp32c6-2026-09-08-b89893962 (cycle-probe). A payload outside the `on` list gets no band at all: it is compared exactly, which is `modeled` behaviour, because nobody has measured this model there"

[[configuration.trust]]
class = "boot-log"
grade = "modeled"
because = "direct load prints no ROM or bootloader banner; the time grade changes nothing about that. M7 owns it"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "the same host model as t1 and t2. t3 charges the guest's own accesses to the USB block the APB's wait states, which makes the console path *more* expensive, not more accurate: §2.3 of the calibration record measures the emulator's console path at about 1.5x silicon's already, and that is a peripheral model rather than a cycle model"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "the same pin observation as t1 and t2, from the same fabric and the same decoder. What a time grade moves here is the frame count in a fixed wall of emulated time, which is reported as timing"

[[configuration.trust]]
class = "wire"
grade = "modeled"
because = "the same UART0 model as t1 and t2: the bytes are the guest's, a live socket's arrival times are the host's"

# ---------------------------------------------------------------------------
# The classic ESP32 on our own machine (M5).
#
# One grade, and that is a statement rather than an omission. `TimeGrade` on
# `lp-emu-esp32v3` has ONE arm and the binary's `--time-grade` accepts `t1`
# alone: there is no measured LX6 per-class cost model, and CCOUNT calibration
# is out of this plan's scope. Inventing a `t2` that is `t1` under another name
# would be the exact dishonesty this trust table exists to prevent (ruling R1).
# A second grade would be added here, and to `ChipSpec::time_grades`, once
# something measures one.
#
# Every class is `modeled`. Byte-equality with silicon on seven of nine
# memory-class fields is EVIDENCE, written into the `because` where a reader
# can weigh it — including the two fields that are NOT equal, by name. It is
# not a promotion.
# ---------------------------------------------------------------------------

[[configuration]]
name = "lp-emu:esp32v3:t1"
description = "Our own classic ESP32 machine (lp-emu/esp/lp-emu-esp32v3) at time grade 1: one cycle per instruction. Two harts on a deterministic quantum interleave (D3), the real mask ROM and the real ESP-IDF second-stage bootloader on the ROM-up path, and the CH340 cable modelled as the host's side of UART0 — this part has no USB-Serial-JTAG peripheral, so UART0 is the product's link and not a workaround."
chip = "esp32v3"
mac = "30:76:f5:ec:f6:34"
silicon_rev = "v3.1"
board = "domraem/dom-z-102"
# ⚠️ **STALE, and deliberately not flipped by M5 P6.** The condition this
# comment named is now met: M4 P3 landed `--dump-frames` on the classic
# binary and M4 P5 (#702) committed the first `.pins.jsonl` beside a classic
# transcript (`transcripts/esp32v3/rmt-chase/lp-emu-esp32v3-t1-2026-09-11-
# dc2df69d4.txt.pins.jsonl`). So this machine CAN decode a pad and this line
# understates it.
#
# P6 left the flip alone all the same, and the reason is the phase's own
# rule rather than doubt about the fact: a capability claim on a
# configuration changes what every replay of that configuration reports
# about the pin class, no payload in P6's four pairs declares a pin capture,
# and the classic's `rmt-chase` has no silicon twin for a flipped flag to be
# checked against. It is the director's to flip, with the walk record's §9
# sentence about what has and has not been on a classic pad (nothing: no
# logic analyser, no scope) written at the same time. Stated rather than
# inferred, for the reason `ConfigurationEntry::records_pins` gives: silence
# is not a capability — and neither is a stale `false`.
records_pins = false

[[configuration.trust]]
class = "memory"
grade = "modeled"
because = "the allocator is the guest's own and the RAM model is byte-exact, and the comparison behind this row is now a COMMITTED PAIR rather than a sitting: `lp-emu/transcripts/esp32v3/boot-idle/lp-emu-esp32v3-t1-2026-09-11-c976f17a9.txt` against `silicon-esp32v3-2026-09-11-c976f17a9-921600.txt`, replayed by `lp-emu-validate/tests/v3_replays.rs` on every run of the gate. Same commit c976f17a9a1e, same ELF sha256 670b7bf1b5bcc161772bb9c5fc2354f497522b890ee2910e6f1e80920419a1f9 stated by BOTH sidecars, same merged.bin, same ROM-up boot path, same elicited stimulus (`walks/v3-stop-all.script`), and both sides a SECOND boot. SEVEN of the nine memory-class figures in the heartbeat triple are equal to the byte: the boot heap arithmetic `heap=15072+112640+98304+15536=241552`, `[INIT] main stack 45280 B`, the whole `[JIT]` census (`used=0 peak=0 cap=65536 spans=0 peak_spans=0 allocs=0 frees=0 fails=0 largest_free=65536`), `[MEM] largest_free 108526`, `retry_saves 0`, the heap total, and the JIT region line `sram0 ibus 0x40088000..0x40098000 (64 KiB, placed, rwtext_end=0x40083f78)`. TWO ARE NOT EQUAL AND BOTH ARE NAMED HERE: `[MEM] used` is +84 B on this machine (silicon 18200, here 18284, with `free` moving the same 84 the other way — 223352 against 223268 — so it is one arena partitioned differently rather than two arenas), and the `[stack]` high-water is -480 B (silicon 16972, here 16492). Neither is sampling: both repeat deterministically on both sides, which is what refuted the sampling explanation that would have made them go away, and M4 P1's two cores did not close either — DD48's carry is spent. ⚠️ The stack figure is -480 and not the -640 `lp-emu-esp32v3/tests/boot_idle.rs` pins, and the two do not conflict: that constant is the DIRECT-load path, this is the ROM-up path, and the cross-path difference is that file's own +160 (16332 + 160 = 16492). On a board every boot is a ROM-up boot, so -480 is the LIKE-FOR-LIKE figure. Both gaps are pinned exactly in `v3_replays.rs` — a move in either direction fails — and the replay REPORTS them rather than masking them; no mask-set entry hides a memory-class field and no threshold is widened. E2 is open with Yona. A further trap that is not a model difference at all: espflash hard-resets after writing, so every silicon capture is a SECOND boot, while a machine handed a fresh flash copy is on its first and reports `largest_free=106494` — 2032 B short — because the `lpfs` format is still live. The arm's `second_boot` is that fact, the runner acts on it, and `largest_free` is equal to the byte because it does. BETWEEN TWO HOSTS: this desk and the CI runner build the same commit into ELFs 500 bytes apart (2,985,952 against 2,986,452 at 111976fc0) and produce IDENTICAL memory figures — stackHighWater 16,060 and usedBytes 17,044 on both — which is `scripts/heap-budget-record.json`'s `host_band`. Never tuned toward any of it"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "t1 counts one cycle per instruction — no cache, no flash wait states, no LX6 per-class cost model — and this machine defines NO OTHER GRADE (ruling R1): there is nothing on the classic to calibrate a `t2` against, and CCOUNT calibration is out of this plan's scope. What is modelled honestly is the UART0 drain, at baud in emulated time, which is why the wire's content and order are the firmware's. The first thing a `t2` would have to fix is DD40's crystal-versus-PLL rate gap: before the app reprograms the PLL the guest's own notion of the rate and ours differ, which is visible in the bootloader's timings and in nothing after them. The `cycle-probe` payload's CCOUNT figures are RECORDED on this configuration and gate nothing at all — they are that future grade's input, not a claim about milliseconds on silicon (the vision's graded ladder). The gate's stop-all send lands 1 ms of emulated time after its trigger line and a desk host's select loop polls at 50 ms; that is host latency, and it is why nothing in this class is compared between the two sides"

[[configuration.trust]]
class = "boot-log"
grade = "modeled"
because = "and it is the one class where this machine has the most to show. On the ROM-up path it prints the REAL mask ROM banner out of the real `esp32_rev300_rom.elf` and the REAL ESP-IDF `v5.1-beta1-378-gea5e0ff298` second-stage bootloader out of espflash 3.3.0's bundled resources — nothing is vendored and nothing is synthesised, so the image IS the provenance (DD25). `lp-emu-esp32v3/tests/rom_up_boot.rs` compares it line for line against the committed 115200 silicon capture of the same merged.bin, `rst:0x1 (POWERON_RESET),boot:0x13 (SPI_FAST_FLASH_BOOT)` included, and the benign `E boot: Image contains multiple DROM segments. Only the last one will be mapped.` line is printed by the desk board too (two DROM segments, the first 256 bytes of `esp_app_desc`). `modeled` all the same: the ROM's own printf is executed here rather than intercepted, but the second-stage bootloader's timings and the flash controller under it are ours"

[[configuration.trust]]
class = "wire"
grade = "modeled"
because = "the bytes are the guest's own, drained through the UART0 model at the configured baud, so their content and order are the firmware's. What is not the firmware's is when a host's bytes arrive on a live socket — that is host time, not guest time — and `--uart0-script` is the deterministic path for anything a transcript should carry. This row also carries the CABLE, because ruling R7 declined a class of its own for it: the CH340K's DTR/RTS to EN/IO0 circuit is modelled as the host's side of UART0 (`--control`, `--control-script`), and the real cable's download-mode row WAS measured on the desk — whole-status TIOCMSET 0x4, 100 ms, 0x2, 80 ms, 0x0, producing `boot:0x3 (DOWNLOAD_BOOT…)` and `waiting for download` (lab task L1's 161-byte raw attachment beside the 115200 transcript). The WCH macOS dext ignores single-bit TIOCMBIS/TIOCMBIC, which is why the model has a whole-status control channel at all. The classic binary has no `--strap` flag, so there is no emulated twin of that capture to compare it against yet; it is named here rather than promoted"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "the waveform is a modelled RMT's, driven into the bus's signal fabric and decoded back by our own decoder (M4 P2/P3). NO INSTRUMENT HAS BEEN ON A CLASSIC PAD — not a logic analyser, not a scope — so both readings of the pad are ours, and the walk record says so in as many words. The two MODEM lines are the exception and they are not a pad: EN and IO0 were driven on the real cable and their effect read off the ROM's own banner, which is a measurement of the cable, recorded in the `wire` row above. `records_pins` is `false` on this configuration until the classic binary has `--dump-frames` (M4 P3), so no classic transcript claims a pin capture it does not have"
