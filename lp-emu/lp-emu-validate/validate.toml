[[configuration]]
# Identity is the CHIP, not the board (Yona, G2 2026-09-06): this is chip
# simulation, not board simulation, and the board is not something the runner
# can determine programmatically anyway. Which board a capture came from lives
# in that transcript's sidecar as `board`, beside `mac` and `silicon_rev`.
name = "silicon:esp32c6"
description = "Real ESP32-C6 silicon on a serial port. The desk board is a XIAO ESP32-C6 (chip revision v0.2, MAC a0:f2:62:87:b4:8c), which each transcript records in its own sidecar."
chip = "esp32c6"

[[configuration.trust]]
class = "memory"
grade = "measured"
because = "the board is the ground truth; nothing models it"

[[configuration.trust]]
class = "timing"
grade = "measured"
because = "a real clock on real flash with real wait states"

[[configuration.trust]]
class = "pin"
grade = "measured"
because = "a scope or a logic analyser on the header pin is the definition of what the pin did"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "measured"
because = "a real host really attaches, or really does not"

[[configuration.trust]]
class = "boot-log"
grade = "measured"
because = "the real ROM and the real IDF bootloader printed it"

[[configuration.trust]]
class = "wire"
grade = "measured"
because = "real bytes over a real port"

[[configuration]]
# Identity is the CHIP, not the board (Yona, G2 2026-09-06), same as
# `silicon:esp32c6` above. The desk board is a `domraem/dom-z-102`, which
# each transcript records in its own sidecar, beside `mac` and `silicon_rev`.
name = "silicon:esp32v3"
description = "Real ESP32 (classic, revision v3) silicon on a serial port. The desk board is a domraem/dom-z-102 (chip revision v3.1, MAC 30:76:f5:ec:f6:34) reached over a CH340K bridge, which each transcript records in its own sidecar."
chip = "esp32v3"

[[configuration.trust]]
class = "memory"
grade = "measured"
because = "the board is the ground truth; nothing models it"

[[configuration.trust]]
class = "timing"
grade = "measured"
because = "a real clock on real flash with real wait states"

[[configuration.trust]]
class = "boot-log"
grade = "measured"
because = "the real ROM and the real IDF bootloader printed it"

[[configuration.trust]]
class = "wire"
grade = "measured"
because = "real bytes over a real CH340K"

[[configuration]]
name = "esp-emu:0.42.0"
description = "Espressif's binary emulator, 0.42.0. A second oracle for the C6 only where the desk validated it (spike report §11)."
chip = "esp32c6"

[[configuration.trust]]
class = "memory"
grade = "measured"
because = "byte-equal to silicon on the same image: harness peak/resident/after-drop 48,132/18,932/3,976 B and all 184 per-tick values (spike report §11.1); meteor load gate 216,056 B (§11.2)"

[[configuration.trust]]
class = "boot-log"
grade = "documented"
because = "same words and values as silicon, different columns — the intercepted ROM printf drops width and zero-pad flags (spike report §11.1)"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "no cycle model. Compile ticks run 2.37x faster than silicon and log-bearing ticks 14.5x, because the ROM UART drains for free; the harness's own 5 ms slice budget passes here and FAILS on the board (spike report §11.1)"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "asserts SOF forever and reports EP1 free forever, so the firmware serves into the void believing a host is attached (spike report §4). Never trust a USB-SJ claim from here"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "no pin observation: RMT frames are produced and vanish. IO_MUX is modeled only to GPIO15, and the WS281x pin is GPIO18 (spike report §8)"

[[configuration.trust]]
class = "wire"
grade = "measured"
because = "the masked UART0 walk transcript is content-identical to silicon's (spike report §11.3)"

# ---------------------------------------------------------------------------
# Our own machine, one entry per time grade.
#
# Every class is `modeled`, and that is not modesty. Byte-equality with silicon
# on one payload is *evidence*, and it is written into the `because` where a
# reader can weigh it; it is not a promotion. `measured` means the class was
# measured on silicon, or on a configuration whose agreement with silicon for
# that class is itself in a committed transcript — which for us will mean a
# transcript per class, not one payload's heap ledger standing in for all of
# them. The vision's graded ladder is the same idea for time.
#
# `mac` / `silicon_rev` / `board` are the desk board's, because an emulator has
# no eFuse to read: the runner passes them as `--efuse-mac` / `--efuse-rev`, so
# a hello frame's identity fields compare equal to silicon's transcripts rather
# than differing for a reason that says nothing about the model. The
# configuration is still the CHIP (PD4); the board is metadata, here and in
# every sidecar.
# ---------------------------------------------------------------------------

[[configuration]]
name = "lp-emu:esp32c6:t1"
description = "Our own C6 machine (lp-emu/esp/lp-emu-esp32c6) at time grade 1: one cycle per instruction. The gate configuration from M3 onward. Since M6 P5 the image under test is the SHIPPED one — default features, mounted from a modelled flash chip, served over the modelled USB-Serial-JTAG link with a host attached — and `spike_uart0_link` survives only for the payloads whose committed transcripts are of that older image."
chip = "esp32c6"
mac = "a0:f2:62:87:b4:8c"
silicon_rev = "v0.2"
board = "seeed/xiao-esp32-c6"
# The pad is decoded off this machine's own signal fabric (M5 P2), so a
# capture from it carries a per-frame pin log. Silicon says nothing here and
# therefore records none: reading a real pad needs an instrument nobody has
# put on this bench, which is the same thing the `pin` trust entry says.
records_pins = true

[[configuration.trust]]
class = "memory"
grade = "modeled"
because = "the allocator is the guest's own and the RAM model is byte-exact, and on the compile harness this configuration is byte-equal to silicon — 372/372 values, peak 48,132 / resident 18,932 / after-drop 3,976 B and all 184 per-tick figures (M3 P6). On the shipped image against the desk board, same commit and same bytes, the residual is EIGHT BYTES of `freeBytes` (complementary in `usedBytes`) and nothing else: `totalBytes` equal, the stack's first high-water mark equal to the byte on both the memfs pair (11,784 B, M6 P4) and the flash-backed pair (11,908 B, M6 P5). M3's 104 B was a sample of a live ~108 B allocation that comes and goes between heartbeats — silicon's own three read 266,392 / 266,496 / 266,388 — and §11.2's meteor `-4 B` is the same shape: one M6 P5 run reports both 152,316 and 152,320 five seconds apart. The eight bytes are not that: they repeat to the byte at 5 s and 10 s, across memfs and flash, across two commits, and across silicon boots 3 and 10, and the two machines agree to the byte on what the filesystem backing costs (1,296 B either side). One live 8-byte block silicon has and we do not, unnamed. Never tuned toward it"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "t1 counts one cycle per instruction — no cache, no flash wait states — and neither grade is graded by a transcript yet (the vision's 'time is a graded ladder, never a promise'). What is modelled honestly is the UART drain, at baud in emulated time, which is why the harness's log-bearing ticks land at 1.01x silicon while its compute ticks are 0.42x"

[[configuration.trust]]
class = "boot-log"
grade = "modeled"
because = "there is no boot log: a direct load places the app's segments and jumps to its entry, so no ROM banner and no IDF bootloader lines are printed at all. M7 boots from reset and is where this class becomes a claim"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "M6 built the host's side — absent, attached with the port closed, attached and draining — and four committed transcripts under `lp-emu/transcripts/esp32c6/` are what it has to show for it: `boot-idle` over the shipped link against sitting 1's silicon capture of the SAME image bytes (stack high-water 11,784 B equal, heap 8 B apart); `usb-negative-control`, the port held closed from boot and opened at eight seconds, latching at 893 ms and recovering at 8,145; `usb-detach-reattach`, the cable out at six seconds and back at nine, recovering with exactly one hello and the firmware noticing nothing; and `usb-host-absent`, where the stamp pair reads 893 / never — the discriminator absent-vs-unread. The block's own registers are graded one by one (`--strict-grade`, the table in `periph/usb_sj.rs`) and the data path is `measured` there. M6 P5 adds the working half: the shipped image FROM FLASH over this link takes a real `lp-cli upload` (`upload-walk-usb`, `meteor-walk-usb`) with every filesystem write, every heap gate and every compiler output identical to M4's run of the same script over the spike's UART0 link — so the host model carries a day's work and not just a boot, and the link driver is demonstrably not in the heap ledger. This class stays `modeled` all the same, by the rule the ADR states and DD33 Q4 confirmed: byte-equality and agreement are EVIDENCE, weighed here where a reader can see them, not a promotion. The silicon transcript that would let anybody argue otherwise has now landed (`usb-negative-control/silicon-esp32c6-2026-09-07-b18360ea6.txt`, G3 step 4); whether it promotes this class is the director's to rule, not a phase's to assume"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "the waveform is a modelled peripheral's, decoded by our own decoder: GPIO is a routing view over the bus's signal fabric, the RMT drives RMT_SIG_0/1 into it, and a WS281x decoder reads a routed pad's edges at the datasheet's +/-150 ns into frames (--dump-frames, --pin-log; M5 P2). Two pin captures are COMMITTED beside their transcripts. On `rmt-chase` (M5 P3) the guest's own per-frame FNV-1a checksum agrees with the bytes the pad carried on all 768 frames. On `shader-oracle-walk` (M5 P4) the SHIPPED image's first lit frame off gpio18 — the frame after the compile-window black one — is byte-equal to the host oracle's `[ORACLE] rgb=` and `[ORACLE-RV32] rgb=` (crc 0x55772254, 64 LEDs, `unpermute(wire, GRB)`), and every later frame in the run is the same bytes; `examples/basic` puts whole, latched 241-LED frames on the same pad at a steady period. That is the nearest independent check there is without an instrument: the oracle never touched the machine. It is still not a measurement, because both readings of the PAD are ours — the fabric and the decoder are in the machine, not on a scope. No silicon pin transcript exists yet; a logic-analyser capture, or the C6 `frame-dump` port M8 owns read beside the decoder, would be the `measured` step"

[[configuration.trust]]
class = "wire"
grade = "modeled"
because = "the bytes are the guest's own, drained through a UART0 model at the configured baud, so their content and order are the firmware's. What is not the firmware's is when a host's bytes arrive on a live socket — that is host time, not guest time, and `--uart0-script` is the deterministic path for anything a transcript should carry"

[[configuration]]
name = "lp-emu:esp32c6:t2"
description = "The same machine at time grade 2: the measured per-class cycle model. Memory is identical to t1 by construction; the interleaving is not, and the stack high-water mark moves with it."
chip = "esp32c6"
mac = "a0:f2:62:87:b4:8c"
silicon_rev = "v0.2"
board = "seeed/xiao-esp32-c6"
# The pad is decoded off this machine's own signal fabric (M5 P2), so a
# capture from it carries a per-frame pin log. Silicon says nothing here and
# therefore records none: reading a real pad needs an instrument nobody has
# put on this bench, which is the same thing the `pin` trust entry says.
records_pins = true

[[configuration.trust]]
class = "memory"
grade = "modeled"
because = "the same allocator and the same RAM model as t1, and the harness's 372 memory values are identical under both grades — a time grade must not move a heap byte. The one figure that does move is the idle stack high-water mark (11,432 B under t1, 11,752 B under t2), which is interleaving, not memory: the deepest interrupted call chain is not the same chain"

[[configuration.trust]]
class = "timing"
grade = "modeled"
because = "t2 uses the per-class cycle model rather than one cycle per instruction, and no transcript grades it either. It is a rung up the ladder, not a promise about milliseconds on silicon"

[[configuration.trust]]
class = "boot-log"
grade = "modeled"
because = "direct load prints no ROM or bootloader banner; the time grade changes nothing about that. M7 owns it"

[[configuration.trust]]
class = "usb-serial-jtag"
grade = "modeled"
because = "the same host model as t1, and the same four transcripts stand behind it — `boot-idle` is recorded on this grade too and its heap figures are t1's to the byte, which is what a time grade must never move. `modeled` for t1's reason: the evidence is here to be weighed, and the silicon half of the negative control is owed"

[[configuration.trust]]
class = "pin"
grade = "modeled"
because = "the same pin observation as t1, on the same two committed captures: the rmt-chase checksums agree on all 768 frames and the shipped image's first lit frame off gpio18 is the host oracle's (`shader-oracle-walk`, crc 0x55772254), with only the frame COUNT by the sentinel moving between the grades (39 against t1's 59 in three seconds — the clock's, reported as timing). The same reason for the grade: the fabric and the decoder are in the machine, not on a scope, and no silicon pin transcript exists"

[[configuration.trust]]
class = "wire"
