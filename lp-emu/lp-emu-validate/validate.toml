# The validation system's policy table.
#
# `[[set]]`  — named lists of payloads, so a desk session is "run this set on
#              this port" and nothing else (vision D10: quick turnaround is the
#              design goal).
# `[[configuration]]`
#            — the named reference implementations (plan PD4) and, per field
#              class, what each is trusted for. Trust is stated, never inferred:
#              a class with no entry is `modeled`, because silence is not trust.
#
# The payload registry is NOT here — it lives in `src/payload.rs`, because it
# carries regexes and field classes that a TOML file could only hold as strings
# nobody checks. This file is policy; that file is parsing.

# ---------------------------------------------------------------------------
# Sets
# ---------------------------------------------------------------------------

[[set]]
name = "compile-parity"
description = "The incremental-compile harness: heap parity and the cycle-model measurement (spike report §11.1)."
payloads = ["shader-compile-stress"]

[[set]]
name = "g3-desk"
description = "The G3 desk batch: the compile harness plus the GPIO calibration payload, captured in one sitting."
payloads = ["shader-compile-stress", "gpio-calibrate"]

[[set]]
name = "lab-tap"
description = "The bridge harness that turns a spare board into the lab's USB-to-UART tap. Not a measurement of a device under test — the instrument that makes one possible (g3-desk-batch.md step 4)."
payloads = ["uart-bridge"]

[[set]]
name = "pins"
description = "Payloads that make a claim about a pin."
payloads = ["gpio-calibrate"]

[[set]]
name = "shipped-image"
description = "The shipped image at rest: boot to the first idle heartbeat, and the hello frame that precedes it. A scenario rather than a check — nothing here is behind a `test_*` feature — and the only set that says what the product does when nobody is asking it for anything. It is a set of one because `emu-m3` pairs it with the compile harness, and a desk sitting that wants only the idle walk cannot ask for that pair twice."
payloads = ["boot-idle"]

[[set]]
name = "emu-m3"
description = "The M3 gate set for our own C6 machine: the compile harness (heap parity against silicon, the first point on the time ladder) and the shipped image's boot to the idle heartbeat. Both run against the reference images `scripts/emu/build-reference-image.sh` builds, so `--image` is part of the recipe."
payloads = ["shader-compile-stress", "boot-idle"]

[[set]]
name = "emu-m4"
description = "The M4 gate set: the flash-backed shipped image booting to the idle heartbeat (the `[FS]` mount pair and spike report §5.1's heap and stack figures, which M3 could not reach because it stopped on SPI1.cmd), and the project-upload walk (§5.3's load gate and compile outputs, replayed from the committed host script so the transcript is a function of guest time). Both run against the reference image `scripts/emu/build-reference-image.sh` builds, so `--image` is part of the recipe."
payloads = ["boot-idle-flash", "upload-walk"]

[[set]]
name = "emu-m5"
description = "M5's gate set: the RMT chase. A 256-LED white dot walks the strip three times on GPIO18 through the shipping `lp-ws281x` refill path, printing one `rmt-frame` record per frame with an FNV-1a checksum of the bytes it handed the driver, and — because three chases cross the telemetry module's ten-second period — one `[WS281X]` line saying what the driver believes about its own refill race. It is the first payload whose claims are checked against a **pin**: the machine decodes the same frames off the pad and the two checksums must agree, frame for frame. The image is the harness's own, over the link it ships with, so a silicon capture of it would be the same bytes. Then the pin claim on the SHIPPED image (M5 P4): `lp-cli upload projects/test/shader-oracle` replayed over the USB link, with the frames the pad carried recorded beside the console, so the first lit frame off gpio18 can be held against the host oracle's `[ORACLE] rgb=` line — the walk's own PASS criterion, with the decoder standing in for the frame-dump line the C6 does not have."
payloads = ["rmt-chase", "shader-oracle-walk"]

[[set]]
name = "usb-negative-control"
description = "M6's negative control, rig-free: flash the shipped image, leave the port CLOSED for several seconds, then open a non-resetting reader and read the first heartbeat. The device is enumerated and undrained throughout, which is the one link state it cannot report on at the time — the `link` object's `hostNotDrainingMs` / `hostDrainingAgainMs` / `notDrainingCount` are its own record of it, on its own clock. Runs on silicon today; M6 P4 adds the emulator twin."
payloads = ["usb-negative-control"]

[[set]]
name = "emu-m6"
description = "M6's four USB-Serial-JTAG scenarios on our own machine, all four over the link the product actually ships: the shipped image with a host attached and reading (the DD26/DD30 arbitration against sitting 1's silicon capture of the same bytes), the port held closed from boot and opened after eight seconds (the emulator twin of the silicon negative control), the cable out mid-session and back in (`s7-unplug-mid-op`'s device side, which has had no trace since M2), and no cable at all — which silicon cannot record, because recording is what a host does."
payloads = [
    "boot-idle",
    "usb-negative-control",
    "usb-detach-reattach",
    "usb-host-absent",
]

[[set]]
name = "rmt-chase"
description = "The RMT chase on its own, and the reason it is a set of one: `emu-m5` pairs it with `shader-oracle-walk`, whose recipe ERASES THE FLASH CHIP before it flashes (the erase is what gives that payload the blank filesystem and `bootCount 1` it needs). A silicon capture of the chase wants none of that — the chase is a harness image that never reaches `bootctl` — and a sitting that asks for one should not have to wipe a board's filesystem to get it. The payload is the same on either machine, so this set is how the emulator's committed captures and the desk's are of one recipe."
payloads = ["rmt-chase"]

[[set]]
name = "emu-m6-walk"
description = "M6 P5: the shipped flash-backed image doing a day's work over the link it ships with. `lp-cli upload examples/basic` (the same script M4 replayed over the spike's UART0 link, so the pair is a controlled comparison of the two link drivers on one image) and `lp-cli upload examples/meteor`, which runs on past the load to the steady heartbeat the spike report §11.2 measured on the desk. Both run against `scripts/emu/build-reference-image.sh esp32c6,server,radio d6cfaa205 none` — the commit §5.3 and §11.2 are at, built with NO cherry-pick, so the bytes are silicon's own merged-default.bin."
payloads = ["upload-walk-usb", "meteor-walk-usb"]

[[set]]
name = "emu-m7"
description = "M7's boot chain as a RECORDED claim rather than an integration test (M8's sweep, the item M7 filed): the shipped image reached from the reset vector through the real mask ROM and the ESP-IDF second-stage bootloader, `--reset-cause poweron --strap app`. Its transcript is `boot-idle-flash`'s with the boot chain in front of it, so replaying the two against each other is what keeps 'everything after `[INIT] Initializing board...` is the same lines' true. Emulator only: on silicon every boot is a ROM-up boot, so the silicon side of this claim IS the committed `boot-idle-flash` capture."
payloads = ["rom-up-boot"]

[[set]]
name = "jit-math-perf"
description = "The Q32 math kernel cycle-cost payload (Q12 ledger, cheapest test_* migration): mul/div/sin kernels and LUT access cost against the PMU cycle counter. Timing only — never a gate under esp-emu, which has no cycle model."
payloads = ["jit-math-perf"]

[[set]]
name = "cycle-probe"
description = "The cycle-model calibration kernels: an IRAM/flash pair, a code walk larger than any plausible cache, a .rodata stride curve, two MMIO poll loops, a mul and a div chain, and a slice-shaped case — each bracketed by BOTH the PMU cycle counter and SYSTIMER microseconds, five repetitions each, nothing averaged. It calibrates a time grade; it never gates one."
payloads = ["cycle-probe"]

[[set]]
name = "c6r-m2"
description = "M2's gate set: the `gpio-input` payload. A button read through the product's OWN `Esp32GpioButtonDriver` and debouncer — five contact bounces settling to one state change, a clean press and release, and a 20 ms glitch that must produce nothing at all — and a quadrature encoder decoded inside a both-edge GPIO interrupt handler, two detents clockwise and two back. The two sides are driven differently on purpose and both transcripts say so: silicon drives its own pads and reads them back through `GPIO.in_` (the read path), while an emulated configuration runs the same image with the pads driven from outside by `pins/gpio-input.pins` (the outside-driver path). What replays equal is every non-timing field: the state changes in order, the positions and directions in order."
payloads = ["gpio-input"]

[[set]]
name = "c6r-m2-rx"
description = "M2's second gate set: the `rmt-rx` payload, which is the RMT's receiver measured against its own transmitter. Each of 32 frames is encoded into WS2812 pulse codes, transmitted on RMT channel 0 out of gpio18, received on channel 2 in from gpio19 through a `--wire 18:19` loopback in the signal fabric, decoded back into bytes and checksummed with the same FNV-1a the transmitting side uses. The transcript therefore carries THREE readings of every frame: `rmt-frame` is what the guest built, `rmt-rx` is what the receiver read off the pad, and the committed `.pins.jsonl` beside it is what the machine's own WS281x decoder read off the same pad — and the gate is that the first two are equal, frame for frame. Emulator only for now: the same image runs on silicon and makes the same claim, but only with a jumper between the two header pins, which is the desk batch's optional hands-only item. A second oracle was tried against this set and did not answer: esp-emu 0.42.0 under `--rmt-loopback 0:2` hangs part way through the payload with the transmitter's read pointer and the receiver's write pointer both frozen at 24 words — `ch_rx_lim` — so there is no esp-emu transcript to set beside these, and the jumper stays the only thing that can arbitrate `ch_rx_lim`'s semantics (docs/reports/2026-09-08-esp-emu-rmt-loopback-differential.md)."
payloads = ["rmt-rx"]

[[set]]
name = "c6r-m4"
description = "M4's gate set: the `espnow-broadcast` payload — the roadmap's fourth acceptance criterion, and the only payload in this file whose subject needs TWO machines. Each device broadcasts a diagnostic message every 100 ms through the PRODUCT's own ESP-NOW driver, walking a four-step payload-length ladder (0, 8, 24, 64 bytes), and prints one line and one record per frame it sent and per frame it heard; the sentinel arrives after six of each and the payload keeps broadcasting afterwards, because the desk captures two boards one after the other through one port and the board that is not being recorded has to still be on the air. What replays equal is every non-timing field on both record kinds: the device ids, the sender's own event numbers, the kinds, the ladder's byte counts on the tx side, and on the rx side `gap` (all 1s — nothing was dropped between two frames) and `len_ok` (the frame carried the number of bytes the peer's own event number prescribes). The peer's RAW event number and byte count are masked, and that is a statement, not a convenience: a peer's counter starts at its own power-on, and no capture can align two of those. The emulated side is a LOCKSTEP PAIR (RD11) rather than one machine — one transcript per machine, each sidecar naming its peer and the air's stated latency."
payloads = ["espnow-broadcast"]

# ---------------------------------------------------------------------------
# The classic ESP32's sets (M5). A set is a name and a payload list with no
# chip of its own, which is exactly right here: the payload names are SHARED
# across the two chips (ruling R5 — `boot-idle` is `boot-idle` on both, and
# what differs is its arm), so the chip comes from `--config` and one set
# reads on silicon and on our own machine alike. `v3-walk` is the desk
# sitting's one line.
#
# Each of the four payloads needs its classic ARM before it will run; P1 lands
# the registry plumbing and P2 lands the arms with the firmware behind them.
# `rmt-chase` joins `v3-walk` once M4 P5 has landed the firmware half and P6
# has an emulated transcript for it.
# ---------------------------------------------------------------------------

[[set]]
name = "v3-boot"
description = "The classic's shipped image to the point where it will say what its heap looks like. The one classic payload with a committed silicon transcript already (lab task L1, 2026-09-10), and the one whose figures G2's field-by-field memory comparison stands on. Its heartbeat triple is ELICITED, not idle-emitted: `[stack] heartbeat:` / `[MEM]` / `[JIT]` come from `esp32_memory_stats`, which `lpa_server` calls on a project load/unload/stop-all or a client `runtime_status` and NEVER from the five-second server heartbeat — so the C6's shape (boot, wait 5.5 s, stop on the heartbeat line) produces nothing at all here unless the host asks. The arm carries the asking as a host script, with exactly `boot_idle.rs::STOP_ALL`'s bytes fired on exactly `[INIT] I/O task spawned`, so silicon and the emulator are the same STIMULUS as well as the same bytes."
payloads = ["boot-idle"]

[[set]]
name = "v3-compile-parity"
description = "The compile-parity harness on the classic: the incremental shader compiler's per-slice cost and the heap either side of it, the same question `compile-parity` asks on the C6 and against the same `fw-checks` module. The JIT half already exists on this chip — `fw-esp32v3`'s `server` pulls `lpvm-native` and `lp-gfx-lpvm` — so what M5 P2 adds is the thin chip harness in front of it."
payloads = ["shader-compile-stress"]

[[set]]
name = "v3-pins"
description = "The classic's pins set. On silicon the firmware drives its own pads and reads them back through the GPIO input path — a self-loop, because there is no wire and no hands on this bench — and the emulated twin drives the same image's pads from outside. Both are real and the two sidecars say which side drove."
payloads = ["gpio-calibrate"]

[[set]]
name = "v3-walk"
description = "The classic's whole desk batch in one line: the shipped image's boot and heap, the compile-parity harness, the pins, and the cycle-probe kernels. `lp-cli validate run v3-walk --config silicon:esp32v3 --port <resolved>` is what the sitting executes, one flash per payload, each with its `--dry-run` printed into the sitting log first. `cycle-probe` is RECORDED here and gated nowhere: the classic's counter is CCOUNT at 240 MHz and there is no `t2` to calibrate against (ruling R1), so its figures are the future calibration's input rather than a claim. `rmt-chase` joins this list once M4 P5 lands the firmware half and P6 has an emulated transcript to set beside a silicon one."
payloads = ["boot-idle", "shader-compile-stress", "gpio-calibrate", "cycle-probe"]

