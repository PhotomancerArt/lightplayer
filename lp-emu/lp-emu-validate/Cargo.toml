[package]
name = "lp-emu-validate"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of lp-emu/ (lp-emu/LICENSE-MIT,
# scripts/check-emu-fence.sh). This crate must never grow a dependency on a
# product crate — not even `fw-checks`, whose payload registry it deliberately
# mirrors rather than imports. `lp-cli` sees both and owns the parity test.
license = "MIT"
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
regex = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
# For the sidecar's `firmware_sha256`: which BYTES a transcript came from
# (L4). No product crate, so the fence holds.
sha2 = { workspace = true }
toml = "0.8"

[dev-dependencies]
# `tests/m4_replays.rs` pins the walk's shape frame by digest: 16,139 bytes
# that must stay the ones a real C6 sent, and quoting them in a test would be
# sixteen kilobytes of assertion nobody could read.
sha2 = "0.10"

[lints]
workspace = true
