[package]
name = "lp-emu-esp-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "SoC bus, MMIO decode, peripheral model and bus trace shared by the Espressif machine emulators"

[lints]
workspace = true

[dependencies]
lp-emu-core = { path = "../../lp-emu-core", features = ["std"] }
log = { workspace = true }
# ELF program headers and symbols. MIT/Apache-2.0, already in the tree via
# `lp-riscv-elf`; the read half only, because nothing here writes an ELF.
object = { version = "0.37.3", default-features = false, features = [
    "read_core",
    "elf",
    "std",
] }
# The WS281x wire timing and byte order the strip decoder reads against, from
# the same crate the firmware encodes with — so the decoder cannot drift from
# the driver's idea of a bit. MIT, and named on the fence allowlist
# (`scripts/check-emu-fence.sh`). No default features: `mock` is the host
# transmitter simulation and nothing here needs it.
lp-ws281x = { path = "../../../lp-fw/lp-ws281x", default-features = false }
# Emulator seams (`src/seam/`): the declarations, identity and table layout
# the firmware's seam table is written in. MIT, outside the fence, and the
# fence admits an MIT crate with no allowlist entry.
lp-seam = { path = "../../../lp-base/lp-seam" }
# Power cuts at flash operations (`src/engine/flash_cut.rs`): the tear models
# (`TearModel`, the calibrated CX1 mix) a cut tears the in-flight program or
# erase with, so the emulated C6 and the host testbed share one model. MIT,
# inside the fence (`lp-emu/lp-nor-sim`), no allowlist entry.
lp-nor-sim = { path = "../../lp-nor-sim" }
# The virtual LAN (`src/seam/net/`): the gateway's and the test probe's
# TCP/IP stacks, and the wire types its DHCP server reads and writes. 0BSD,
# already in the tree (embassy-net's stack). No default features: no OS
# interface, no IPv6, no logging; only what a /24 home LAN carries.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-udp",
    "multicast",
] }

[dev-dependencies]
test-log = { workspace = true }
# The virtual LAN's tests: a smoltcp board stand-in that takes its address
# over DHCP (`socket-dhcpv4`, test builds only), and the fixture file of test
# networks.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "socket-dhcpv4",
] }
toml = "0.8"

# The speed probes' guest-side counters, OFF by default and never in a gate
# binary: a per-fetch and per-MMIO-access hash lookup, which is several times
# the interpreter's own work. `scripts/emu/bench-esp32v3.sh` takes the seconds
# from a stock build and the shares from a `bench` one. See `src/benchprof.rs`.
[features]
default = []
bench = []
# The TEST ONLY seam implementations (`test=echo`, `test=take`;
# `src/seam/seam_impl.rs`). Dev-only: only the emulator crates' own tests turn
# it on, never a shipped command line.
test-seams = []
