[package]
name = "lp-emu-esp-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "SoC bus, MMIO decode, peripheral model and bus trace shared by the Espressif machine emulators"

[lints]
workspace = true

[dependencies]
lp-emu-core = { path = "../../lp-emu-core", features = ["std"] }
log = { workspace = true }
# ELF program headers and symbols. MIT/Apache-2.0, already in the tree via
# `lp-riscv-elf`; the read half only, because nothing here writes an ELF.
object = { version = "0.37.3", default-features = false, features = [
    "read_core",
    "elf",
    "std",
] }
# The WS281x wire timing and byte order the strip decoder reads against, from
# the same crate the firmware encodes with — so the decoder cannot drift from
# the driver's idea of a bit. MIT, and named on the fence allowlist
# (`scripts/check-emu-fence.sh`). No default features: `mock` is the host
# transmitter simulation and nothing here needs it.
lp-ws281x = { path = "../../../lp-fw/lp-ws281x", default-features = false }

[dev-dependencies]
test-log = { workspace = true }
