[package]
name = "lp-emu-esp-figures"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "The chip emulator tests' firmware-derived figures: read from a committed per-chip record, rewritten by a bless"

[lints]
workspace = true

[dependencies]
# Parsing only. The record is WRITTEN by this crate's own writer, so its key
# order and layout do not depend on whether some other crate in the build
# turned on serde_json's `preserve_order`.
serde_json = { workspace = true, features = ["std"] }
