[package]
name = "lp-emu-esp32v3"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "The classic ESP32 (v3, LX6) machine: memory map, mask-ROM loader, direct load, scheduler loop, snapshot, CLI"

[lints]
workspace = true

[[bin]]
name = "lp-emu-esp32v3"
path = "src/bin/lp-emu-esp32v3.rs"

[dependencies]
lp-emu-core = { path = "../../lp-emu-core", features = ["std"] }
lp-emu-esp-common = { path = "../lp-emu-esp-common" }
# The Xtensa hart. Declared here from the crate's first commit even though P1
# constructs none: the dependency edge is what makes P2's `machine.rs` an
# addition rather than a manifest change nobody reviewed. `lp-xt-emu` is
# inside the MIT fence (`lp-emu/lp-xt-emu`), so this edge costs the fence
# nothing.
lp-xt-emu = { path = "../../lp-xt-emu" }
# `ChannelTiming` / `ColorOrder`: the WS281x wire's own numbers, shared with
# the firmware that drives it so the emulator's decoder and the device's
# encoder cannot drift apart. `lp-emu-esp-common`'s decoder already takes
# them; this edge is so the machine can name a strip (`--strip-timing`,
# `--strip-order`) without re-declaring either enum. The C6 has the same one.
lp-ws281x = { path = "../../../lp-fw/lp-ws281x", default-features = false }
log = { workspace = true }
env_logger = { workspace = true }

# The Xtensa translator, and with it whichever host runs what it emits (M7
# P04). The C6's two entries, for the C6's two reasons.
#
# OPTIONAL and off by default: `wasmtime` needs minutes of cranelift
# compilation on the images this ladder measures, and every test and CI job
# depends on this binary starting fast. `--jit` on a build without this
# feature says so and exits.
[dependencies.lp-xt-jit]
path = "../../lp-xt-jit"
features = ["host-wasmtime"]
optional = true

# **On a wasm target the translator is not optional — it is the core** (P08's
# posture, landed here now so the cfgs are one commit rather than two). A build
# of the product that had to be asked for its own execution engine is a build
# one forgotten flag away from silently measuring the interpreter, so the
# dependency is unconditional there rather than behind the feature.
#
# It costs nothing the optional entry does not: `lp-emu-jit` declares wasmtime
# only for `cfg(not(target_family = "wasm"))`, and `lp-xt-jit` forwards that
# feature, so a wasm build gets the translator and `lp_emu_jit::host_browser`
# and no compiler. The code is gated on
# `any(feature = "jit", target_family = "wasm")` for exactly this reason.
#
# Natively the interpreter stays the default (JD9/JD24), so the optional entry
# above is what a native `--jit` reaches.
[target.'cfg(target_family = "wasm")'.dependencies.lp-xt-jit]
path = "../../lp-xt-jit"

[dev-dependencies]
# `tests/boot.rs` checks the ROM hook table's `break 1, 15` patch against the
# ENCODER rather than against a hand-derived word. M0 found a real misdecode
# in this repo that came from trusting an encoding by analogy, so the oracle
# is `lp_xt_inst::encode` and not arithmetic in a comment. A dev-dependency:
# the constant itself is `src/rom.rs`'s, and only the test needs the encoder.
lp-xt-inst = { path = "../../../lp-xt/lp-xt-inst" }
# The vendored ROM's checksum test. Reading `SHA256SUMS` and re-deriving the
# digest in-process is what makes a swapped ROM fail the build's tests rather
# than a boot; shelling out to `shasum` would make the assertion depend on
# which host ran it.
sha2 = "0.10"

# The speed probe's two instruments, both OFF by default and neither in a gate
# binary. `scripts/emu/bench-esp32v3.sh` builds the stock binary for the
# seconds and these for the shares; `lp-emu/README.md`'s Speed section says
# which number comes from which.
#
#   selfprof  an ITIMER_PROF pc sampler (macOS/arm64), for host-time buckets.
#             Enabled at runtime by LP_EMU_SELFPROF=<path>; a `selfprof`
#             binary with the variable unset runs the stock loop.
#   bench     guest-side counters on the bus and the interleave, dumped by
#             LP_EMU_V3_BENCHPROF=<path>. A hash lookup per fetch and per
#             MMIO access, so this build's SECONDS mean nothing; its SHARES
#             are the measurement.
[features]
default = []
selfprof = []
bench = ["lp-emu-esp-common/bench"]
# `--jit`: install a translated core. See the dependency above.
#
# On a wasm target this feature is redundant — the translator is there either
# way. Natively it is what brings `wasmtime` in, and so what `--jit` needs.
jit = ["dep:lp-xt-jit"]
