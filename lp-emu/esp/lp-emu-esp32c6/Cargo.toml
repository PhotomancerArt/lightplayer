[package]
name = "lp-emu-esp32c6"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "The ESP32-C6 machine: memory map, mask-ROM loader, direct load, scheduler loop, snapshot, CLI"

[lints]
workspace = true

[[bin]]
name = "lp-emu-esp32c6"
path = "src/bin/lp-emu-esp32c6.rs"

[dependencies]
lp-emu-core = { path = "../../lp-emu-core", features = ["std"] }
lp-emu-esp-common = { path = "../lp-emu-esp-common" }
lp-riscv-emu = { path = "../../lp-riscv-emu", features = ["std"] }
log = { workspace = true }
env_logger = { workspace = true }
# `--probe esp_println::serial_jtag_printer::TIMED_OUT@3000`: the static's
# ELF name is mangled with a hash nobody can type, so a probe is resolved by
# demangling every symbol and matching the path. MIT/Apache-2.0, already in
# the tree through the workspace's dependencies.
rustc-demangle = "0.1"
# The strip decoder's wire timing and byte order (`--strip-timing`,
# `--strip-order`), and `PulseItem::decode` in `tests/rmt_chase.rs`. The same
# crate the firmware encodes with, so the emulator's idea of a bit cannot
# drift from the driver's. MIT, on the fence allowlist
# (`scripts/check-emu-fence.sh`); no `mock` — the emulator is the cycle-time
# model of the same peripheral.
lp-ws281x = { path = "../../../lp-fw/lp-ws281x", default-features = false }

# The translator, and with it whichever host runs what it emits.
# OPTIONAL and off by default, deliberately (JD9, JD18): `wasmtime` needs
# minutes of cranelift compilation on the images this ladder measures, and
# every test and CI job depends on this binary starting fast. `--jit` on a
# build without this feature says so and exits.
#
# `host-wasmtime` is asked for unconditionally and costs nothing on a wasm
# target: `lp-emu-jit` declares wasmtime only for `cfg(not(target_family =
# "wasm"))`, so a `wasm32-wasip1` build of this binary gets the translator and
# `lp_emu_jit::host_browser` — the product host (JD11-JD13) — and no compiler.
[dependencies.lp-emu-jit]
path = "../../lp-emu-jit"
features = ["host-wasmtime"]
optional = true

[features]
# `--jit`: install a translated core. See the dependency above.
jit = ["dep:lp-emu-jit"]

[dev-dependencies]
test-log = { workspace = true }
# The vendored ROM's checksum test. Reading `SHA256SUMS` and re-deriving the
# digest in-process is what makes a swapped ROM fail the build's tests rather
# than a boot; shelling out to `shasum` would make the assertion depend on
# which host ran it.
sha2 = "0.10"
# `tests/harness_parity.rs` replays the harness capture against the committed
# silicon transcript with M2's runner. Inside the `lp-emu/` fence (MIT), and
# it mirrors `fw-checks` rather than importing it, so the fence lint passes.
lp-emu-validate = { path = "../../lp-emu-validate" }
# `tests/flash_over_socket.rs`: the flasher the gate is about, driven the way
# this repository's own product code drives it
# (`lp-cli/src/commands/fwcheck/flash.rs`,
# `lp-app/lpa-link/.../host_esp32_flash.rs`) — as a LIBRARY, with the `cli`
# feature and its dependency tree left out.
#
# Not a new dependency and not a new tool: the same crate at the same version
# is already resolved for `lp-cli` and `lpa-link`, and CI already installs its
# binary for `build-merged-image.sh`. It is here rather than the CLI because
# espflash's CLI resolves `--port` through the operating system's serial-port
# ENUMERATION and refuses a name that is not in it, and a pty is not an
# enumerated device on macOS or Linux — see `tests/flash_over_socket.rs`.
#
# Registry crates, so the MIT fence (`scripts/check-emu-fence.sh`, which walks
# WORKSPACE-local edges) is untouched; both are MIT/Apache-2.0.
espflash = { version = "3.3", default-features = false, features = [
    "serialport",
] }
serialport = "4.8"
