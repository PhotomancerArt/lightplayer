[package]
name = "lp-xt-emu"
version.workspace = true
authors.workspace = true
edition.workspace = true
# MIT as a unit with the rest of `lp-emu/`, NOT the workspace's AGPL.
# See lp-emu/LICENSE-MIT and `just lint-emu-fence`.
license = "MIT"
description = "Pure-Rust Xtensa (ESP32-S3 / LX7, classic ESP32 / LX6) instruction-set emulator core with windowed-register machinery."

[lints]
workspace = true

[dependencies]
lp-emu-core = { path = "../lp-emu-core" }
lp-xt-inst = { path = "../../lp-xt/lp-xt-inst" }
# The machine-mode hart's diagnostics (`mach`), as in `lp-riscv-emu`.
log = { workspace = true, default-features = false }

# The FP conformance corpus generator. A dev-dependency, not a dependency: the
# emulator does not need it to run, and `tests/fp_conformance.rs` is its only
# consumer on this side. `fw-esp32s3`'s device harness (M6 P5) will depend on it
# directly — the same crate on both sides is what makes the vectors identical,
# and `fingerprint()` is what makes that checkable rather than assumed.
[dev-dependencies]
lp-xt-fp-vectors = { path = "../../lp-xt/lp-xt-fp-vectors" }
# The ELF reader the `mach` fixture tests parse images with. A dev-dependency
# and a CYCLE (`lp-xt-elf` depends on this crate) — cargo permits that for dev
# dependencies, and it is the honest shape: the fixtures are ELF files, and the
# repo already has one Xtensa ELF reader. Allowlisted in the MIT fence
# (`scripts/check-emu-fence.sh`) alongside `lp-xt-inst`.
lp-xt-elf = { path = "../../lp-xt/lp-xt-elf" }
