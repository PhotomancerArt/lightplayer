crate: esp-radio

options:
  - name: wifi_max_burst_size
    description: See [embassy-net's documentation](https://docs.rs/embassy-net-driver/0.2.0/embassy_net_driver/struct.Capabilities.html#structfield.max_burst_size)
    default:
      - value: 3
    constraints:
      - type:
          validator: non_negative_integer

  - name: wifi_mtu
    description: "MTU, see [embassy-net's documentation](https://docs.rs/embassy-net-driver/0.2.0/embassy_net_driver/struct.Capabilities.html#structfield.max_transmission_unit)"
    default:
      - value: 1492
    constraints:
      - type:
          validator: positive_integer

  - name: dump_packets
    description: "Dump packets via an info log statement"
    default:
      - value: false

  # LP fork (third diff, README-LP.md): research switch, default off.
  - name: ble_controller_flash_only_params
    description: "Call the BLE controller blob's `esp_ble_controller_flash_only_param_config()` before `r_ble_controller_enable` — what ESP-IDF 5.5.3 does under `BT_CTRL_RUN_IN_FLASH_ONLY`, retuning three controller timing values for a controller that runs from flash. Pair with esp-hal's `place_ble_controller_iram_in_flash`."
    default:
      - value: false
    active: 'chip == "esp32c6"'

  # LP fork (fourth diff, README-LP.md): the C6 controller's mbuf pools, default
  # unchanged. No block is allocated at init on the emulator, and the blob's
  # block-get callback allocates one block at a time, so these read as a cap on
  # the controller's transient ACL memory, not a standing cost (RAM research E13).
  - name: ble_msys_1_block_count
    description: "Number of 256-byte mbuf blocks the BLE controller may take (ESP-IDF `BT_NIMBLE_MSYS_1_BLOCK_COUNT`, 12)"
    default:
      - value: 12
    constraints:
      - type:
          validator: positive_integer
    active: 'chip == "esp32c6"'

  - name: ble_msys_2_block_count
    description: "Number of 320-byte mbuf blocks the BLE controller may take (ESP-IDF `BT_NIMBLE_MSYS_2_BLOCK_COUNT`, 24)"
    default:
      - value: 24
    constraints:
      - type:
          validator: positive_integer
    active: 'chip == "esp32c6"'

  - name: event_channel_capacity
    description: "Capacity of the internal event channel"
    default:
      - value: 2
    constraints:
      - type:
          validator: non_negative_integer

  - name: event_channel_subscribers
    description: "Max subscriber count of the internal event channel"
    default:
      - value: 2
    constraints:
      - type:
          validator: non_negative_integer
